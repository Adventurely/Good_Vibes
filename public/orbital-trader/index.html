<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../theme.css">
<title>Orbital Trader</title>
<meta name="description" content="A cozy single-player orbital trading game. Plan burns, borrow speed from a grumpy gas giant, and carry goods between four peoples around a warm orange star.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d17'/%3E%3Ccircle cx='8' cy='8' r='2.6' fill='%23f7a531'/%3E%3Cellipse cx='8' cy='8' rx='6.5' ry='4.2' fill='none' stroke='%23ffd23f' stroke-width='1' transform='rotate(-25 8 8)'/%3E%3Ccircle cx='13.2' cy='5.2' r='1.2' fill='%236cc24a'/%3E%3C/svg%3E">
<style>
  /* The site's look, from theme.css, with the chart itself as the backdrop —
     the real renderer, drawing the real sky, from the same modules the game
     plays on. A picture of the game would go stale the first time somebody
     moved a moon. The chart is drawn on paper now rather than on black, the
     way a star chart is, so the page and the sky are the same colour. */
  /* Orbital Trader is played on the night side. The site's paper look is
     right for a greenhouse and wrong for a star chart: a road drawn on
     paper is a line among other lines, and a road drawn on black is the
     only thing there. So this page keeps the site's names and its type and
     re-points every colour at the dark. */
  :root{
    --gv-paper:#000000; --gv-paper-2:#0e1119; --gv-sunk:#171b26;
    --gv-line:#2a3048; --gv-line-2:#3b4468;
    --gv-text:#f5ead6; --gv-muted:#a99e8c; --gv-faint:#7b7261;
    --gv-leaf:#6cc24a; --gv-leaf-soft:#6cc24a;
    --gv-sun:#ffd23f; --gv-gold:#ffd23f; --gv-gold-deep:#f59a2e;
    --gv-sky:#5aa6e8; --gv-bad:#ff5f5f;
    --gv-glass:rgba(10,12,18,.86); --gv-glass-2:rgba(14,17,26,.94);
    --gv-shadow:0 10px 30px rgba(0,0,0,.55);
    --gv-ground:#000000;
  }
  :root{
    --space:var(--gv-paper); --ink:var(--gv-text); --muted:var(--gv-muted); --faint:var(--gv-faint);
    --gold:var(--gv-gold); --gold-deep:var(--gv-gold-deep); --mint:#1f8f7a; --line:var(--gv-line);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--space); color:var(--ink);
    font:16px/1.55 var(--gv-type);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #sky{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .veil{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    /* Enough to read the words over, not so much that the sky behind them
       turns into a dark rectangle. */
    background:
      linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.15) 34%, rgba(0,0,0,.15) 62%, rgba(0,0,0,.92) 100%),
      radial-gradient(70% 46% at 50% 30%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 100%);
  }
  main{
    position:fixed; inset:0; z-index:2;
    display:grid; grid-template-rows:1fr auto 1fr; justify-items:center;
    /* One column, and a definite one. An auto column is sized to its own
       contents, and a child that will not go narrower than the screen — a
       grid of cards asking for four 150px columns, say — makes the whole page
       wider than the window, which with overflow:hidden means the far side of
       it is simply not there. This is the column being told how wide it is. */
    grid-template-columns:minmax(0, 1fr);
    padding:clamp(1.2rem, 4vw, 3rem); text-align:center;
    /* The two 1fr rows are what centres this on a screen with room to spare.
       On one without, they collapse to nothing and the page is exactly as
       tall as its contents — which used to mean the bottom of it was simply
       not there, the body being overflow:hidden for the sake of the chart.
       It scrolls instead. Nothing on a phone should be unreachable because a
       save added a second button. */
    overflow-y:auto; overscroll-behavior:contain;
  }
  .wrap{ grid-row:2; max-width:46rem; width:100%; }
  .eyebrow{ margin:0 0 .5rem; font-size:clamp(.7rem, 2vw, .82rem); letter-spacing:.34em; text-transform:uppercase; color:var(--gold-deep); }
  h1{
    margin:0; font-size:clamp(2.3rem, 8.5vw, 5.4rem); line-height:.95; letter-spacing:-.02em; font-weight:800;
    background:linear-gradient(180deg, #b8720c 0%, var(--gv-sun) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tag{ margin:.9rem auto 0; max-width:36rem; color:var(--muted); font-size:clamp(.95rem, 2.6vw, 1.08rem); }
  .enter{
    display:inline-block; padding:.85rem 2.4rem; border:0; border-radius:999px;
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%); color:#1a1310;
    font:inherit; font-weight:800; font-size:1.02rem; letter-spacing:.04em; text-transform:uppercase; text-decoration:none;
    cursor:pointer; box-shadow:var(--gv-shadow); transition:transform .12s ease, filter .12s ease;
  }
  .enter:hover, .enter:focus-visible{ transform:translateY(-2px); filter:brightness(1.06); }
  .enter:focus-visible{ outline:3px solid var(--mint); outline-offset:3px; }
  .enter.quiet{ background:var(--gv-glass-2); color:var(--ink); border:1px solid var(--gv-line-2); box-shadow:none; font-weight:600; }
  .enter[hidden]{ display:none; }
  .saved{ margin:.6rem 0 0; color:var(--faint); font-size:.85rem; min-height:1.3em; }
  /* An empty line is still a line. With no save to describe, this one gives
     its height back instead of holding a gap open under the buttons — which
     on a short phone was the difference between the back link being on the
     screen and being under it. */
  .saved:empty{ margin:0; min-height:0; }
  .back{ grid-row:3; align-self:end; color:var(--faint); font-size:.85rem; text-decoration:none; }
  .back:hover{ color:var(--ink); }
  .wip{ display:inline-block; margin-top:.9rem; padding:.18rem .6rem; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }
  /* Phone. The page is one screen, and it should not need the scroll it now
     has as a net — so on a small one what gives is the air between the
     blocks, not any of the words. */
  @media (max-width: 560px){
    .tag{ margin-top:.6rem; }
    /* Narrow enough that Continue and New game stay on one row at 360px,
       which is where a saved game used to push them onto two and shove the
       rest of the page off the bottom. */
    .enter{ padding:.8rem 1.35rem; font-size:.98rem; }
    .wip{ margin-top:.7rem; }
    /* The home indicator sits where the back link wants to be. */
    main{ padding-bottom:calc(1.2rem + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce){ .enter{ transition:none; } .enter:hover{ transform:none; } }
  /* Lying down: less height than width, so the air between the blocks comes
     in. Nothing needs hiding now that the cards are gone. */
  @media (max-height: 600px){
    .tag{ margin-top:.5rem; }
  }
  /* Three slots. A card each, stacked on a phone and in a row when there is
     room for one — and every card the same height whether or not it has a
     game in it, so the row does not jump about as slots fill up. */
  .slots{
    margin-top:clamp(1.2rem, 4vw, 2rem);
    display:grid; gap:.7rem;
    grid-template-columns:repeat(auto-fit, minmax(13.5rem, 1fr));
    text-align:left;
  }
  .slot{
    display:flex; flex-direction:column; gap:.45rem;
    padding:.85rem .95rem; border-radius:.7rem;
    border:1px solid var(--gv-line-2); background:var(--gv-glass-2);
  }
  .slot h2{ margin:0; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; }
  .slot .who{ margin:0; font-weight:600; font-size:1rem; color:var(--ink); }
  .slot .when{ margin:0; font-size:.82rem; color:var(--muted); min-height:1.2em; }
  .slot .row{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:auto; padding-top:.4rem; }
  .slot button{
    font:inherit; font-size:.82rem; font-weight:600; cursor:pointer;
    padding:.4rem .7rem; border-radius:999px;
    border:1px solid var(--gv-line-2); background:transparent; color:var(--ink);
  }
  .slot button.go{ background:linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%); color:#1a1310; border:0; }
  .slot button:hover{ filter:brightness(1.12); }
  .slot button:focus-visible{ outline:3px solid var(--mint); outline-offset:2px; }
  .slot.empty .who{ color:var(--faint); font-weight:500; }
  #carry{
    border:1px solid var(--gv-line-2); border-radius:.8rem; padding:1.1rem;
    background:var(--gv-glass-2); color:var(--ink); max-width:34rem; width:92vw;
  }
  #carry::backdrop{ background:rgba(0,0,0,.72); }
  #carry h2{ margin:0 0 .4rem; font-size:1.05rem; }
  .carry-note{ margin:0 0 .6rem; font-size:.85rem; color:var(--muted); }
  #carry-text{
    width:100%; font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background:var(--gv-sunk); color:var(--ink);
    border:1px solid var(--gv-line); border-radius:.5rem; padding:.55rem; resize:vertical;
    word-break:break-all;
  }
  .carry-btns{ display:flex; gap:.5rem; margin-top:.7rem; flex-wrap:wrap; }
  .carry-btns .enter{ padding:.5rem 1.1rem; font-size:.85rem; text-transform:none; letter-spacing:0; }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil"></div>

<main>
  <div class="wrap">
    <p class="eyebrow">Good Vibe Games</p>
    <h1>Orbital Trader</h1>
    <p class="tag">A small merchant ship, a warm orange star, and four peoples who each want what
       the others make.</p>

    <!-- The slots are drawn by script, because only script can read them. The
         link inside is what is there before that happens and what is there if
         it never does: a page that cannot list your saves can still start a
         game. renderSlots() replaces it. -->
    <div class="slots" id="slots">
      <noscript><p class="saved">Saved games need JavaScript to list. You can still start a new one.</p></noscript>
      <a class="enter" href="./play.html?new">New game</a>
    </div>
    <p class="saved" id="saved"></p>

    <dialog id="carry">
      <h2 id="carry-title">Carry a game</h2>
      <p id="carry-note" class="carry-note"></p>
      <textarea id="carry-text" rows="5" spellcheck="false" autocomplete="off"
        aria-label="The save, written out"></textarea>
      <div class="carry-btns">
        <button class="enter quiet" id="carry-copy" type="button">Copy</button>
        <button class="enter quiet" id="carry-load" type="button" hidden>Load it</button>
        <button class="enter quiet" id="carry-close" type="button">Close</button>
      </div>
    </dialog>

    <span class="wip">Single player &middot; early build</span>
  </div>

  <a class="back" href="/">&larr; all Good Vibe Games</a>
</main>

<script type="module">
import { createChart } from './render.js';
import { BODIES, CONST, BELT_ROCKS, ARC_DEBRIS } from './content.js';
import { makeWorld } from './orbit.js';
import * as S from './sim.js';

/* Continue only if there is something to continue. localStorage can throw
   in a private window; the page must render fine having learned nothing. */
/* Offer Continue only for a save the game will actually take. Checking the
   version alone offered it for saves play.html then threw away, which is a
   worse welcome than no button at all. */
/* Three slots, and a save you can carry. Everything about how a save is
   stored, written out and read back lives in sim.js, so this page and the game
   page cannot come to disagree about what a save is. */
S.migrateLegacy();

const slotsEl = document.getElementById('slots');
const savedEl = document.getElementById('saved');
const dlg = document.getElementById('carry');

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function renderSlots(){
  let any = false;
  slotsEl.innerHTML = S.SLOTS.map(n => {
    const state = S.readSlot(n);
    const sum = S.slotSummary(state);
    if(sum) any = true;
    return `<div class="slot${sum ? '' : ' empty'}">
      <h2>Slot ${n}</h2>
      <p class="who">${sum ? esc(sum.shipName) : 'Empty'}</p>
      <p class="when">${sum ? `Year ${sum.year}, day ${sum.day}<br>${sum.where ? 'Docked at ' + esc(sum.where) : 'Under way'}` : 'No game here yet'}</p>
      <div class="row">
        ${sum
          ? `<button class="go" data-act="play" data-slot="${n}">Continue</button>
             <button data-act="export" data-slot="${n}">Copy out</button>
             <button data-act="new" data-slot="${n}">New</button>
             <button data-act="delete" data-slot="${n}">Delete</button>`
          : `<button class="go" data-act="new" data-slot="${n}">New game</button>
             <button data-act="import" data-slot="${n}">Paste in</button>`}
      </div>
    </div>`;
  }).join('');
  savedEl.textContent = any ? '' : 'Three saves live in this browser. Copy one out to carry it somewhere else.';
}

function openCarry({ title, note, text, readonly, onLoad }){
  document.getElementById('carry-title').textContent = title;
  document.getElementById('carry-note').textContent = note;
  const box = document.getElementById('carry-text');
  box.value = text ?? '';
  box.readOnly = !!readonly;
  const copy = document.getElementById('carry-copy');
  const load = document.getElementById('carry-load');
  copy.hidden = !readonly;
  load.hidden = !onLoad;
  load.onclick = onLoad ? () => onLoad(box.value) : null;
  copy.onclick = async () => {
    box.select();
    /* The clipboard API needs a secure context and a permission; selecting the
       text is the fallback that always works, and is what the note says to do
       if the button cannot. */
    try{ await navigator.clipboard.writeText(box.value); copy.textContent = 'Copied'; }
    catch{ copy.textContent = 'Press ⌘/Ctrl+C'; }
    setTimeout(() => { copy.textContent = 'Copy'; }, 1800);
  };
  dlg.showModal();
  if(!readonly) box.focus();
}
document.getElementById('carry-close').addEventListener('click', () => dlg.close());

slotsEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const n = Number(btn.dataset.slot);
  const act = btn.dataset.act;
  const state = S.readSlot(n);
  const sum = S.slotSummary(state);

  if(act === 'play'){ S.setActiveSlot(n); location.href = `./play.html?slot=${n}`; return; }
  if(act === 'new'){
    if(sum && !confirm(`Start over in slot ${n}? ${sum.text} is replaced.`)) return;
    S.setActiveSlot(n);
    location.href = `./play.html?slot=${n}&new`;
    return;
  }
  if(act === 'delete'){
    if(!confirm(`Delete slot ${n}? ${sum ? sum.text : 'It is empty'}. This cannot be undone.`)) return;
    S.clearSlot(n); renderSlots(); return;
  }
  if(act === 'export'){
    if(!state) return;
    openCarry({
      title: `Slot ${n}, written out`,
      note: 'Copy this and keep it anywhere. Pasting it into an empty slot on any machine brings this game back exactly as it is.',
      text: S.exportSave(state),
      readonly: true,
    });
    return;
  }
  if(act === 'import'){
    openCarry({
      title: `Paste a game into slot ${n}`,
      note: 'Paste a save you copied out earlier. Spaces and line breaks do not matter.',
      text: '',
      readonly: false,
      onLoad: hex => {
        let loaded;
        try{ loaded = S.importSave(hex); }
        catch(err){ alert(err.message); return; }
        if(S.readSlot(n) && !confirm(`Slot ${n} already has a game. Replace it?`)) return;
        if(!S.writeSlot(n, loaded)){ alert('This browser would not store it — the save is too large, or site data is blocked.'); return; }
        dlg.close(); renderSlots();
      },
    });
  }
});
renderSlots();

/* The sky: the real chart, at a slow warp, looking at the inner system so
   the moons of Tassel and the Belt havens both read. */
const world = makeWorld(BODIES);
const canvas = document.getElementById('sky');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const chart = createChart(canvas, world, {
  reducedMotion: still, starSeed: 3, showScale: false,
  // The title, the cards and the link along the bottom own those strips.
  labelInsets: { top: 60, right: 20, bottom: 70, left: 20 },
});
const belt = { inner: CONST.BELT.inner, outer: CONST.BELT.outer, rocks: BELT_ROCKS, debris: ARC_DEBRIS };
/* Put the Lamp low and left, so the orbits sweep up behind the title instead
   of sitting under the button, and frame about seven au: Cinder through the
   Belt, with the Arc riding just beyond it. */
function fit(){
  chart.resize();
  chart.camera.follow = null;
  chart.camera.zoom = Math.min(chart.width, chart.height) / 7.0;
  const want = [chart.width * 0.26, chart.height * 0.78];
  /* Nothing is followed here, so the chart's anchor is the Lamp at the origin
     and the whole of this framing is a pan away from it. */
  chart.camera.pan = [
    (chart.width / 2 - want[0]) / chart.camera.zoom,
    (want[1] - chart.height / 2) / chart.camera.zoom,
  ];
  chart.settle();
}
fit();
addEventListener('resize', fit);
// Start the clock somewhere in the save, or at a day that spreads the sky out.
/* Start the sky wherever the newest game is, so the title screen looks
   like the game the player is most likely to press Continue on. */
const newest = S.SLOTS.map(n => S.readSlot(n)).filter(Boolean).sort((a, b) => b.t - a.t)[0];
let t = newest?.t ?? 140;
let last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if(!still) t += dt * 1.5;   // a day and a half per second: the moons visibly turn
  chart.draw({ t, now, shipAbs: null, prediction: null, nodes: [], belt, target: null });
  if(!still) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('keydown', e => { if(e.key === 'Enter' && e.target === document.body) (document.getElementById('continue').hidden ? document.getElementById('new') : document.getElementById('continue')).click(); });
</script>
</body>
</html>
