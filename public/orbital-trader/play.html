<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../theme.css">
<title>Orbital Trader</title>
<meta name="description" content="A cozy single-player orbital trading game. Plan burns, borrow speed from a grumpy gas giant, and carry goods between four peoples around a warm orange star.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d17'/%3E%3Ccircle cx='8' cy='8' r='2.6' fill='%23f7a531'/%3E%3Cellipse cx='8' cy='8' rx='6.5' ry='4.2' fill='none' stroke='%23ffd23f' stroke-width='1' transform='rotate(-25 8 8)'/%3E%3Ccircle cx='13.2' cy='5.2' r='1.2' fill='%236cc24a'/%3E%3C/svg%3E">
<style>
  /* The chart is the page. Everything else floats over it in glass panels
     the same paper as the chart, so the eye stays on the sky. The site's
     look, from theme.css: this page's own names are kept and aliased onto
     it. Gold is still the Lamp's colour and still means "you can press
     this" — but only as a surface with dark type on it. As type it is
     `--gold-ink`, the darker tone that reads on paper; the bright one
     measured 1.7:1 and was a highlighter, not a word. The mint, the rose and
     the sky are likewise the ink versions of the lights they were. */
  /* Orbital Trader is played on the night side. The site's paper look is
     right for a greenhouse and wrong for a star chart: a road drawn on
     paper is a line among other lines, and a road drawn on black is the
     only thing there. So this page keeps the site's names and its type and
     re-points every colour at the dark. */
  :root{
    --gv-paper:#000000; --gv-paper-2:#0e1119; --gv-sunk:#171b26;
    --gv-line:#2a3048; --gv-line-2:#3b4468;
    --gv-text:#f5ead6; --gv-muted:#a99e8c; --gv-faint:#7b7261;
    --gv-leaf:#6cc24a; --gv-leaf-soft:#6cc24a;
    --gv-sun:#ffd23f; --gv-gold:#ffd23f; --gv-gold-deep:#f59a2e;
    --gv-sky:#5aa6e8; --gv-bad:#ff5f5f;
    --gv-glass:rgba(10,12,18,.86); --gv-glass-2:rgba(14,17,26,.94);
    --gv-shadow:0 10px 30px rgba(0,0,0,.55);
    --gv-ground:#000000;
  }
  :root{
    --space:var(--gv-paper); --glass:var(--gv-glass); --glass-2:var(--gv-glass-2);
    --line:var(--gv-line); --line-2:var(--gv-line-2);
    --ink:var(--gv-text); --dim:var(--gv-muted); --faint:var(--gv-faint);
    --gold:var(--gv-gold); --gold-2:var(--gv-gold-deep); --gold-ink:var(--gv-gold);
    --mint:#1f8f7a; --rose:#b5372a; --sky:var(--gv-sky); --leaf:var(--gv-leaf);
    --bad:var(--gv-bad);
    --emberkin:#c8611a; --otter:var(--gv-leaf); --cat:#8a6a3a; --frog:#2d7fb3; --chorus:#7a4fb5;
    --radius:12px;
    --panel-w:350px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--space); color:var(--ink);
    font:14px/1.45 var(--gv-type);
    -webkit-font-smoothing:antialiased;
    overflow:hidden; overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  button{ font:inherit; color:inherit; }
  #chart{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  #chart.grab{ cursor:grabbing; }

  /* ---- HUD: one strip along the top ---------------------------------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; flex-wrap:wrap; gap:.35rem .9rem; align-items:center;
    padding:.45rem .8rem; padding-top:max(.45rem, env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.6) 80%, transparent);
    pointer-events:none; font-variant-numeric:tabular-nums;
  }
  #hud > *{ pointer-events:auto; }
  .stat{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  /* display:flex outranks the [hidden] default, so say it here or a hidden
     stat keeps its space and its em dash. */
  .stat[hidden]{ display:none; }
  .stat small{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
  .stat b{ font-weight:600; font-size:.92rem; white-space:nowrap; }
  .stat.warn b{ color:var(--rose); }
  #dvbar{ position:relative; width:120px; height:5px; background:var(--gv-sunk); border-radius:3px; overflow:hidden; margin-top:3px; }
  #dvbar i{ display:block; height:100%; background:linear-gradient(90deg, var(--gold-2), var(--gold)); width:100%; transition:width .2s; }
  #dvbar i.low{ background:var(--rose); }
  /* What the marks on the chart will spend, eaten off the right-hand end of
     the gauge. Hatched rather than solid: it is not gone yet. The selector
     has to out-rank `#dvbar i` above, or the gold gradient paints over it and
     the segment is invisible. */
  #dvbar i#h-dvplan{
    position:absolute; top:0; right:0; width:0; transition:width .2s, right .2s;
    border-left:1px solid rgba(20,16,12,.85);
    background:repeating-linear-gradient(-45deg, rgba(20,16,12,.75) 0 2px, rgba(255,255,255,.35) 2px 4px);
  }
  #where{ flex:1 1 auto; text-align:right; }
  #where b{ color:var(--dim); font-weight:500; }
  #dockhint{ color:var(--mint); font-size:.85rem; }
  #dockhint.far{ color:var(--dim); }
  /* Inside the mouth and only the speed is wrong. That is not "nowhere near
     it", which is what the dim grey says; it is the one thing the pilot can
     act on, and it wants to be read. */
  #dockhint.near{ color:var(--gold); }

  /* ---- Warp controls: bottom left ------------------------------------ */
  /* The ×1 clock has no controls but one: a hold. Time is skipped by pointing
     at where on your road you want to be, not by climbing a ladder of speeds,
     so there is no strip of numbers along the bottom of the sky any more. */
  .btn:focus-visible, .tab:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---- Chart controls: bottom right ---------------------------------- */
  #view{
    position:fixed; right:.8rem; bottom:max(.8rem, env(safe-area-inset-bottom)); z-index:7;
    display:flex; flex-direction:column; gap:.35rem;
  }
  /* The panel owns the right gutter while it is open, so the view buttons step
     out of it: they used to sit underneath it, where a press meant to zoom in
     landed on whatever the market had in that spot. */
  body.panel-open #view{ right: calc(.8rem + var(--panel-w) + .8rem); }
  /* The one button that does something to the ship rather than to the view,
     so it lives on its own away from the two that open menus: top left, under
     the fuel gauge and the way back to the title. */
  #act{
    position:fixed; left:.8rem; top:calc(70px + env(safe-area-inset-top)); z-index:7;
    display:flex; flex-direction:column; gap:.35rem;
  }
  #view button, #act button{
    width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
    background:var(--glass); color:var(--dim); cursor:pointer; backdrop-filter:blur(8px); font-size:1.05rem;
    /* An inline <svg> sits on the text baseline, which left the ship and the
       harbour drawn low and a little left in their boxes while the ◎ next to
       them — a glyph, centred by the button itself — sat true. Centring the
       box's content puts all three on the same middle. */
    display:flex; align-items:center; justify-content:center; padding:0; line-height:1;
  }
  #view button svg, #act button svg{ display:block; }
  /* `display:block` above beats the browser's own rule for the hidden
     attribute, so the anchor and the liftoff arrow were drawn side by side in
     a button stretched to hold both. */
  #view button svg[hidden], #act button svg[hidden]{ display:none; }
  #view button:hover, #act button:hover{ color:var(--ink); border-color:var(--line-2); }
  #view button[aria-pressed="true"]{ color:var(--gold-ink); border-color:var(--gold-2); }
  /* Dragged off the thing the chart is locked to. The button that brings you
     back is the one that lights up, so "where am I" and "get me back" are the
     same place on the screen. */
  #v-fit.off{ color:var(--gold-ink); border-color:var(--gold-2); }
  #v-far[hidden]{ display:none; }
  #v-far.off{ opacity:.55; }
  /* A job finished and waiting to be collected. The log lives behind the ship
     button, so the ship button is what says so — the same slow breath the
     mooring ring uses, because it is the same kind of news: there is something
     here worth pressing. It stops under the pointer, and it stops altogether
     once the log is open, having said what it had to say. */
  #m-ship.owed{ color:var(--gold-ink); border-color:var(--gold-2); animation:owedflash 1.8s ease-in-out infinite; }
  @keyframes owedflash{
    0%, 100%{ box-shadow:0 0 0 0 transparent; }
    50%{ box-shadow:0 0 12px -1px var(--gold-2); }
  }
  #m-ship.owed:hover, #m-ship.owed:focus-visible{ animation:none; box-shadow:0 0 12px -1px var(--gold-2); }

  /* ---- Settings: a gear at the end of the strip ----------------------- */
  /* The one control that is about the game rather than about the ship or the
     sky, so it sits apart from both, at the far end of the top strip where a
     gear is the first place anybody looks for one. */
  #m-gear{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--glass); color:var(--dim); cursor:pointer; backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; padding:0; line-height:1;
    margin-left:auto; flex:0 0 auto;
  }
  #m-gear svg{
    display:block; width:19px; height:19px;
    fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
  }
  #m-gear:hover{ color:var(--ink); border-color:var(--line-2); }
  #m-gear[aria-expanded="true"]{ color:var(--gold-ink); border-color:var(--gold-2); }
  /* Fixed and placed when it opens, rather than hung off the button: the HUD
     is a stacking context underneath the panel, so a menu drawn inside it
     would open behind the panel it has to cover. */
  /* Built like the side panel rather than like a dropdown, because it is one:
     a tab row and a body under it. There is one tab today and room for the
     next without moving anything. */
  #gearmenu{
    position:fixed; z-index:9; width:230px; overflow:hidden;
    background:var(--glass-2); border:1px solid var(--line); border-radius:var(--radius);
    backdrop-filter:blur(10px); display:flex; flex-direction:column;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.7);
  }
  #gearmenu[hidden]{ display:none; }
  #gear-tabs{ display:flex; gap:2px; padding:.4rem .4rem 0; border-bottom:1px solid var(--line); }
  /* Tabs start at the left and are as wide as their word. The panel's own tabs
     share the row out between them, which for a row of one means a lone tab
     stretched across the whole menu with its label stranded in the middle. */
  #gear-tabs .tab{ flex:0 0 auto; padding:.45rem .7rem; }
  #gear-body{ padding:.55rem; display:flex; flex-direction:column; gap:.35rem; }
  #gear-body .btn{ width:100%; text-align:left; }

  /* ---- The panel: right column on wide screens, a sheet on narrow ---- */
  #panel{
    position:fixed; top:64px; right:.8rem; bottom:64px; width:min(var(--panel-w), calc(100vw - 5.5rem)); z-index:6;
    display:flex; flex-direction:column;
    background:var(--glass-2); border:1px solid var(--line); border-radius:var(--radius);
    backdrop-filter:blur(10px); overflow:hidden;
    transition:transform .2s ease, opacity .2s ease, height .18s ease;
  }
  /* Under a finger the sheet follows the finger. Snapping is the only part
     that should be animated. */
  #panel.dragging{ transition:none; }
  #panel.closed{ transform:translateX(calc(100% + 1rem)); opacity:0; pointer-events:none; }
  #tabs{ display:flex; gap:2px; padding:.4rem .4rem 0; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tab{
    /* Six tabs is the widest this row ever gets — the flight row once the
       Astrolabe is fitted — and it overran the panel by thirteen pixels at
       .45rem a side. Tabs are short words and they do not need the room, and
       `flex:1 0 auto` hands the slack back whenever there are fewer of them,
       so a narrower tab is only narrower when it has to be. */
    flex:1 0 auto; padding:.5rem .34rem; border:0; border-bottom:2px solid transparent; background:none;
    color:var(--dim); cursor:pointer; font-size:.82rem; letter-spacing:.04em; white-space:nowrap;
  }
  .tab[aria-selected="true"]{ color:var(--gold-ink); border-bottom-color:var(--gold-2); }
  #tabbody{ flex:1; overflow-y:auto; padding:.75rem .85rem 1rem; }
  #tabbody h2{ margin:0 0 .25rem; font-size:1.05rem; }
  #tabbody h3{ margin:1rem 0 .35rem; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  #tabbody p{ margin:.3rem 0; color:var(--dim); }
  #tabbody p.say{ color:var(--ink); font-style:italic; border-left:2px solid var(--line-2); padding-left:.6rem; }
  .sp-emberkin{ color:var(--emberkin); } .sp-otter{ color:var(--otter); } .sp-cat{ color:var(--cat); } .sp-frog{ color:var(--frog); } .sp-builders{ color:var(--chorus); } .sp-mixed{ color:var(--gold-ink); }
  #grab{ display:none; }

  /* Two lines, always: name and price on the first, the description and the
     buttons on the second. A one-line row looked tidier until a good with a
     sentence of flavour squeezed the price into a column one word wide. */
  .row{ display:grid; grid-template-columns:1fr auto; gap:.15rem .5rem; padding:.5rem 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:0; }
  .row .name{ min-width:0; }
  .row .name b{ display:block; font-weight:600; }
  .row .name small{ display:block; color:var(--dim); font-size:.78rem; margin-top:.1rem; }
  .row .price{ font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; align-self:start; }
  .row .price small{ display:block; color:var(--dim); font-size:.74rem; }
  .row .btns{ grid-column:1 / -1; justify-content:flex-end; margin-top:.2rem; }
  .up{ color:var(--leaf); } .down{ color:var(--rose); } .flat{ color:var(--dim); }
  /* The "i" beside a good: small, quiet, and the same size as the text it
     sits in, so a row of them does not read as a row of buttons. */
  .inspect{
    display:inline-flex; align-items:center; justify-content:center;
    width:1.15em; height:1.15em; margin-left:.35em; padding:0; vertical-align:baseline;
    border:1px solid var(--line-2); border-radius:50%; background:transparent;
    color:var(--dim); font-size:.72rem; font-style:italic; line-height:1; cursor:pointer;
  }
  .inspect:hover, .inspect:focus-visible{ color:var(--gold-ink); border-color:var(--gold-2); }
  .btns{ display:flex; gap:.3rem; flex-wrap:wrap; }
  .btn{
    min-height:32px; padding:.25rem .6rem; border-radius:8px; border:1px solid var(--line-2);
    background:var(--gv-sunk); color:var(--ink); cursor:pointer; font-size:.82rem;
  }
  .btn:hover{ border-color:var(--gold-2); }
  .btn.primary{ background:var(--gold); color:#1a1310; border-color:var(--gold); font-weight:700; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ border-color:var(--gv-bad); color:var(--gv-bad); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.sm{ min-height:28px; padding:.1rem .45rem; font-size:.76rem; }
  .btn.wide{ width:100%; margin-top:.4rem; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:.15rem .8rem; font-variant-numeric:tabular-nums; }
  .kv dt{ color:var(--dim); } .kv dd{ margin:0; text-align:right; }
  .lock{ color:var(--faint); font-size:.78rem; }
  .node{ border:1px solid var(--line); border-radius:10px; padding:.5rem .6rem; margin:.4rem 0; }
  /* A quest reads as a list with a place in it, so the step you are on is the
     only one that is fully lit: the ones behind are ticked and dimmed, the
     ones ahead are waiting. */
  /* ---- Crew: a portrait, a name, and three berths with nobody in them -- */
  .crew{ display:flex; gap:.7rem; align-items:flex-start; padding:.6rem 0; border-top:1px solid var(--line); }
  .crew:first-of-type{ border-top:0; }
  .crew img{
    width:64px; height:64px; flex:0 0 64px; border-radius:10px;
    image-rendering:pixelated; background:var(--gv-sunk); border:1px solid var(--line-2);
  }
  .crew.open img{ opacity:.8; }
  .crew .who{ min-width:0; }
  .crew .who b{ display:block; }
  .crew .who small{ display:block; color:var(--faint); }
  .crew .who p{ margin:.25rem 0 0; font-size:.84rem; }
  /* Pressing a face. The crew menu is the only place everybody aboard is on
     screen at once, so it is where they get to say something: a line about
     wherever the ship is tied up, and whoever answers it. The portrait is the
     button — there is nothing else it could sensibly be — so it keeps the
     picture and loses everything a button would otherwise bring with it. */
  .crew .face{
    flex:0 0 64px; padding:0; border:0; background:none; line-height:0;
    border-radius:10px; cursor:pointer;
  }
  .crew .face img{ display:block; transition:border-color .15s ease; }
  .crew .face:hover img{ border-color:var(--gold-2); }
  .crew .face:focus-visible{ outline:2px solid var(--gold-2); outline-offset:2px; }
  /* The Astrolabe's rows: a world, what it costs today, and one word for
     whether today is the day. */
  .win{ display:flex; align-items:baseline; gap:.6rem; border-top:1px solid var(--line); padding-top:.4rem; margin-top:.4rem; }
  .win:first-of-type{ border-top:0; }
  .win .name{ flex:1 1 auto; min-width:0; }
  .win .name small{ display:block; color:var(--faint); font-size:.8rem; }
  .win .band{ flex:0 0 auto; text-align:right; font-size:.78rem; letter-spacing:.04em; text-transform:uppercase; }
  .win .band small{ display:block; color:var(--faint); letter-spacing:0; text-transform:none; }
  .win.perfect .band{ color:var(--leaf); }
  .win.good .band{ color:var(--mint); }
  .win.bad .band{ color:var(--gold); }
  .win.impossible .band{ color:var(--rose); }
  .quest{ border-top:1px solid var(--line); padding-top:.6rem; margin-top:.6rem; }
  .quest:first-of-type{ border-top:0; padding-top:0; margin-top:0; }
  .quest h3{ margin:0 0 .1rem; }
  .quest.done h3{ color:var(--dim); }
  ol.steps{ list-style:none; margin:.5rem 0 .3rem; padding:0; display:flex; flex-direction:column; gap:.3rem; }
  ol.steps li{ color:var(--dim); font-size:.88rem; padding-left:1.4rem; position:relative; }
  ol.steps li::before{ content:'○'; position:absolute; left:0; color:var(--line-2); }
  ol.steps li.ok{ color:var(--faint); }
  ol.steps li.ok::before{ content:'✓'; color:var(--leaf-soft, var(--mint)); }
  ol.steps li.now{ color:var(--ink); font-weight:600; }
  ol.steps li.now::before{ content:'▸'; color:var(--gold-2); }
  .empty{ color:var(--faint); font-style:italic; }
  select{ font:inherit; background:var(--gv-sunk); color:var(--ink); border:1px solid var(--line-2); border-radius:8px; padding:.35rem .5rem; width:100%; }

  /* ---- Toasts, modal, tutorial ---------------------------------------- */
  #toasts{ position:fixed; left:50%; top:72px; transform:translateX(-50%); z-index:8; display:flex; flex-direction:column; gap:.4rem; align-items:center; pointer-events:none; width:min(92vw, 520px); }
  .toast{ background:var(--glass-2); border:1px solid var(--line-2); border-radius:10px; padding:.5rem .8rem; color:var(--ink); font-size:.88rem; box-shadow:var(--gv-shadow); animation:toast .25s ease; max-width:100%; }
  .toast.story{ border-color:var(--gold-2); }
  .toast.bad{ border-color:var(--bad); }
  @keyframes toast{ from{ opacity:0; transform:translateY(-6px);} }

  /* A conversation. It is a popup rather than a block in the crew menu because
     a line somebody says is an event, and an event belongs on the screen the
     player is looking at — which, on a ship, is the sky. Down the left, clear
     of the panel on the right and of the toasts overhead, and above the
     tutorial card in the middle at the bottom.

     One bubble per line, and each bubble wears the face of whoever is
     speaking: an exchange is usually two people and the portraits are how you
     tell them apart without reading the names. They stack up as they are said
     rather than replacing each other, so a slow reader still has the first
     line when the third arrives. */
  #chatter{
    position:fixed; left:1rem; z-index:8;
    /* Clear of the row of buttons along the bottom, and of the tutorial card
       when there is one — `liftChatter` measures that card rather than
       guessing at it, because its height is a different number on every one of
       the fourteen and different again folded. */
    bottom:calc(64px + var(--chatter-lift, 0px) + env(safe-area-inset-bottom));
    width:min(42vw, 340px); display:flex; flex-direction:column; gap:.4rem;
    align-items:flex-start; cursor:pointer;
  }
  #chatter[hidden]{ display:none; }
  /* The panel's own glass rather than the modals' thinner sort: a bubble sits on
     the open sky, where a starfield read straight through the words is not a
     background but noise. Blurred behind it as well, so what little shows
     through is a wash rather than points of light in the middle of a sentence. */
  .bubble{
    display:flex; gap:.55rem; align-items:flex-start; width:100%;
    background:var(--glass-2); border:1px solid var(--gold-2); border-radius:12px;
    backdrop-filter:blur(14px) saturate(1.1);
    padding:.5rem .7rem; box-shadow:var(--gv-shadow);
    animation:bubble .22s ease;
  }
  .bubble img{
    width:34px; height:34px; flex:0 0 34px; border-radius:8px;
    image-rendering:pixelated; background:var(--gv-sunk); border:1px solid var(--line-2);
  }
  .bubble .who{ min-width:0; }
  .bubble .who small{
    display:block; color:var(--faint);
    font-size:.64rem; letter-spacing:.1em; text-transform:uppercase;
  }
  .bubble .who p{ margin:.1rem 0 0; font-size:.84rem; font-style:italic; color:var(--ink); }
  /* The last thing said is the thing being read; the ones above it are there to
     be looked back at, and fade so the eye knows which is which. */
  .bubble.said{ opacity:.68; }
  @keyframes bubble{ from{ opacity:0; transform:translateY(6px);} }
  @media (prefers-reduced-motion: reduce){ .bubble{ animation:none; } }

  /* A popup over a chart should not put the chart away. These sit on the sky
     at three-quarters opacity with a blur behind them, so the road you tapped
     is still visible under the question you are being asked. */
  dialog{
    background:rgba(12,15,22,.72); color:var(--ink); border:1px solid var(--line-2); border-radius:14px;
    padding:1.1rem 1.25rem; width:min(92vw, 420px); backdrop-filter:blur(14px) saturate(1.1);
    box-shadow:0 18px 50px -18px #000;
    /* Down at the bottom, near the thumb and clear of the sky you just
       tapped: a question about a point on the chart should not sit on top of
       the point. */
    margin:auto auto max(1rem, env(safe-area-inset-bottom));
  }
  dialog::backdrop{ background:rgba(0,0,0,.28); backdrop-filter:blur(1px); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--dim); }
  .btn.ghost:hover{ color:var(--ink); border-color:var(--line-2); }
  dialog h2{ margin:0 0 .5rem; font-size:1.15rem; }
  dialog p{ color:var(--dim); margin:.4rem 0; }
  dialog p.say{ color:var(--ink); font-style:italic; border-left:2px solid var(--gold-2); padding-left:.7rem; }
  dialog .btns{ margin-top:1rem; justify-content:flex-end; }

  /* Tie up: a mooring ring that appears in the chart controls the moment a
     stable orbit close in around a harbour makes it possible, and is not
     there the rest of the time. It replaced a card across the bottom of the
     sky that spent most of its life telling you what you had not done yet. */
  #dock-go{ color:var(--gold); border-color:var(--gold-2); animation:dockflash 2.8s ease-in-out infinite; }
  /* Tied up, the same button is how you leave, and it is there the whole time
     you are moored — so it stops breathing and stops being gold. Nothing that
     is always on the screen should pulse. */
  #dock-go.lift{ color:var(--dim); border-color:var(--line); animation:none; opacity:1; }
  #dock-go.lift:hover{ color:var(--ink); border-color:var(--line-2); background:var(--glass); }
  /* Slow on purpose. It is the one control that appears out of nowhere, and it
     has to catch an eye that is on the chart without becoming a strobe next to
     two buttons that are always there — so it breathes rather than blinks, and
     it stops the moment the pointer is on it. */
  @keyframes dockflash{
    0%, 100%{ opacity:.62; box-shadow:0 0 0 0 transparent; }
    50%{ opacity:1; box-shadow:0 0 10px -1px var(--gold-2); }
  }
  #dock-go:hover, #dock-go:focus-visible{ animation:none; opacity:1; }
  #act button svg, #m-ship svg, #m-dock svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #dock-go:hover{ background:var(--gold); color:#1a1310; }
  #dock-go[hidden], #m-dock[hidden]{ display:none; }

  /* Centred on the chart rather than on the window, so that with the panel
     open they do not slide under it. */
  body.panel-open #tut{
    left: calc(50% - (var(--panel-w) + 1.6rem) / 2);
  }

  #tut{
    position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:7;
    width:min(92vw, 440px); background:var(--glass-2); border:1px solid var(--gold-2); border-radius:12px;
    padding:.7rem .9rem; box-shadow:var(--gv-shadow);
  }
  #tut small{ color:var(--gold-ink); letter-spacing:.14em; text-transform:uppercase; font-size:.66rem; }
  #tut h3{ margin:.15rem 0 .2rem; font-size:1rem; padding-right:1.6rem; }
  #tut p{ margin:0; color:var(--dim); font-size:.88rem; }
  /* The cards carry their own paragraphs now: a blank line in the writing is
     a break on the screen, because eight sentences in one block is a card
     nobody reads to the end of. */
  #tut p + p{ margin-top:.5rem; }
  #tut .btns{ margin-top:.5rem; justify-content:flex-end; }
  /* The last card asks for nothing, so it stops wearing the gold the working
     cards use to say "you are in the middle of something". */
  #tut.done{ border-color:var(--leaf); }
  #tut.done small{ color:var(--leaf); }
  #tut[hidden]{ display:none; }
  /* Fold it away. Theo is good company and still in the way of the sky, so
     the card keeps its name and its number and loses everything else — one
     tap to put it down, one to pick it up, and it stays where you left it. */
  #tut-min{
    position:absolute; top:.35rem; right:.4rem; width:26px; height:26px; line-height:1;
    border:1px solid transparent; border-radius:8px; background:transparent;
    color:var(--dim); cursor:pointer; font-size:1.1rem;
  }
  #tut-min:hover{ color:var(--ink); border-color:var(--line-2); }
  #tut.min{ width:auto; max-width:min(92vw, 440px); padding:.35rem 2.2rem .35rem .7rem; cursor:pointer; }
  #tut.min h3{ font-size:.86rem; margin:.1rem 0 0; }
  #tut.min p, #tut.min .btns{ display:none; }

  /* Phone. The chart is the point, so nothing may stack on top of it: the HUD
     is two tight rows, the clock and the view buttons share one strip
     under them, the panel is a sheet that starts closed, and the cards that
     matter sit along the bottom where a thumb is. */
  @media (max-width: 760px){
    :root{ --panel-w:100%; --sheet-h:min(64vh, 560px); }
    #hud{ gap:.15rem .6rem; padding:.3rem .6rem; padding-top:max(.3rem, env(safe-area-inset-top)); }
    .stat small{ font-size:.6rem; letter-spacing:.08em; }
    .stat b{ font-size:.82rem; }
    #dvbar{ width:64px; height:4px; }
    #where{ flex:1 1 8rem; text-align:left; }
    #where b, #dockhint{ font-size:.78rem; }
    /* The gear comes out of the flex row on a phone. The strip is two tight
       rows here and the gear was being carried along by the wrap, landing at
       the end of whichever row had space — under the readouts, three pixels
       to the left of the view buttons it then sat directly above, and six
       narrower than them. Pinned to the corner it is the top of that column
       instead of a stray fourth thing: same gutter, same edge, wherever the
       text happens to break. */
    #m-gear{
      position:absolute; top:max(.3rem, env(safe-area-inset-top)); right:.4rem; margin:0;
      /* The same size as the buttons it is now the top of, or the column has a
         step in it. */
      width:40px; height:40px; border-radius:10px;
    }
    /* And the readouts keep clear of it, since it is no longer in their row. */
    #hud{ padding-right:calc(.4rem + 40px + .4rem); }

    #view{
      top:calc(74px + env(safe-area-inset-top)); bottom:auto; right:.4rem;
      flex-direction:column; gap:.25rem;
    }
    /* The other corner of the same strip. The back link is gone on a phone, so
       there is nothing under the two HUD rows for this to land on. */
    #act{ top:calc(74px + env(safe-area-inset-top)); left:.4rem; gap:.25rem; }
    #view button, #act button{ width:32px; height:30px; border-radius:8px; font-size:.95rem; }
    /* Only the panel toggle stays on top; the rest tuck under it in a column
       that the chart can still be seen around. */
    #view button:not(#m-ship):not(#m-dock){ opacity:.85; }

    #panel{
      top:auto; left:0; right:0; bottom:0; width:100%; height:var(--sheet-h);
      border-radius:16px 16px 0 0; border-bottom:0;
      padding-bottom:env(safe-area-inset-bottom);
    }
    #panel.closed{ transform:translateY(100%); opacity:1; pointer-events:none; }
    /* The grabber. It was a five-pixel pill sitting on nothing: it looked like
       the handle every phone sheet has, and was neither draggable nor — at five
       pixels tall — reliably hittable. The pill is still five pixels because
       that is what the shape is; what you are actually pressing is the strip it
       sits in, which is a thumb high.

       `touch-action:none` so the drag is ours: without it the browser claims a
       vertical swipe for scrolling or for pull-to-refresh, and the sheet either
       does not move or the whole page bounces. */
    #grab{
      display:flex; align-items:center; justify-content:center;
      height:26px; margin:0; cursor:grab; touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }
    #grab::before{
      content:''; width:44px; height:5px; border-radius:3px;
      background:var(--line-2); transition:background .15s ease, width .15s ease;
    }
    #grab:hover::before, #grab:focus-visible::before{ background:var(--gold-2); width:52px; }
    #grab:focus-visible{ outline:2px solid var(--gold-2); outline-offset:-2px; border-radius:8px; }
    #panel.dragging #grab{ cursor:grabbing; }
    #panel.dragging #grab::before{ background:var(--gold-2); width:52px; }

    /* The sheet owns the bottom of the screen, so a conversation sits above it
       rather than behind it — which is where the bubbles were, on the one
       screen where the face you press to start one is inside the sheet. */
    body.sheet #chatter{ bottom:calc(var(--sheet-h) + .5rem); }

    /* Bottom cards, stacked: the docking card closest to the thumb. */
    #tut{ left:.5rem; right:.5rem; transform:none; width:auto; bottom:calc(.6rem + env(safe-area-inset-bottom)); }
    #tut p{ font-size:.84rem; }
    #toasts{ top:calc(112px + env(safe-area-inset-top)); width:calc(100vw - 1rem); }
    /* Narrower than the screen: the view buttons are a column down the right on
       a phone, and a bubble the full width of the chart sits on top of them. */
    #chatter{ left:.5rem; width:calc(100vw - 3.6rem); }

    /* When the sheet is up it owns the bottom of the screen. */
    body.sheet #tut{ display:none; }
  }

  /* The opening film. Above everything, including the sheet and the cards,
     because for six seconds it is the only thing there; then it dissolves and
     the chart is underneath it, already drawn. The art is a canvas of chunky
     pixels (intro.js); the words are words, so they stay crisp. */
  #intro{
    position:fixed; inset:0; z-index:20; background:#02030b;
    opacity:1; transition:opacity .45s ease;
  }
  #intro[hidden]{ display:none; }
  #intro.gone{ opacity:0; pointer-events:none; }
  #intro-art{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    image-rendering:pixelated;
  }
  #intro-cap{
    position:absolute; left:50%; bottom:clamp(2.4rem, 10vh, 5.5rem); transform:translateX(-50%);
    margin:0; width:min(92vw, 34rem); text-align:center; color:var(--ink); opacity:0;
    font-size:clamp(.92rem, 2.5vw, 1.06rem); text-shadow:0 2px 12px #000, 0 0 26px #000;
  }
  #intro-cap small{
    display:block; margin-bottom:.3rem; color:var(--gold-ink);
    letter-spacing:.3em; text-transform:uppercase; font-size:.66rem;
  }
  /* The line arrives with the black, on the last beat, and stays through the
     dissolve. */
  #intro.say #intro-cap{ animation:introcap 1.2s ease both; }
  @keyframes introcap{ from{ opacity:0; transform:translate(-50%, 7px); } to{ opacity:1; transform:translate(-50%, 0); } }
  #intro-skip{
    position:absolute; right:.9rem; bottom:max(.9rem, env(safe-area-inset-bottom));
    padding:.4rem .8rem; border-radius:999px; border:1px solid var(--line-2);
    background:var(--glass-2); color:var(--dim); font:inherit; font-size:.78rem;
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
  }
  #intro-skip:hover, #intro-skip:focus-visible{ color:var(--ink); border-color:var(--gold-2); }

  @media (prefers-reduced-motion: reduce){
    #panel, .toast{ transition:none; animation:none; }
    /* It never plays under this, but if it is asked for by hand it does not
       also slide and fade. */
    #intro, #intro.say #intro-cap{ transition:none; animation:none; }
    /* The mooring ring still has to be noticed, so it keeps the brightness the
       flash was carrying it to and drops the breathing. */
    #dock-go{ animation:none; opacity:1; }
    /* Same bargain for the ship button: keep the glow, lose the breath. */
    #m-ship.owed{ animation:none; box-shadow:0 0 12px -1px var(--gold-2); }
  }
  /* The hazard marks. Amber is "this will happen and it will hurt a bit";
     red is the colour the chart already uses for ground, so the corner and
     the cross on the road say the same thing in the same voice. */
  #hud .warn{
    display:flex; align-items:center; gap:.4rem;
    padding:.3rem .6rem; border-radius:.5rem;
    border:1px solid currentColor; background:rgba(0,0,0,.35);
    color:var(--gold-deep); font-size:.82rem; font-weight:600;
  }
  #hud .warn.bad{ color:var(--gv-bad); }
  #hud .warn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #hud .warn[hidden]{ display:none; }
  @media (prefers-reduced-motion: no-preference){
    #hud .warn.bad{ animation:hazpulse 1.6s ease-in-out infinite; }
    @keyframes hazpulse{ 0%,100%{ opacity:1 } 50%{ opacity:.55 } }
  }
  @media (max-width: 560px){ #hud .warn b{ display:none; } }
  /* A save written out. Monospace so a mistyped character is findable, and
     breaking anywhere because it is one very long word. */
  .hexbox{
    width:100%; margin-top:.5rem;
    font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background:var(--sunk, rgba(0,0,0,.35)); color:inherit;
    border:1px solid var(--line); border-radius:.4rem; padding:.5rem;
    word-break:break-all; resize:vertical;
  }
  /* Collecting a job. The card is the animation: a gold edge, a lift, and the
     things you were owed climbing out of it.

     A quest is otherwise just a rule and some text under it, so the gold ring
     had nothing to stand off from and was drawn hard against the words on
     every side. Given its own padding it reads as a card that has been picked
     out, which is what it is. The top padding matches what .quest already had,
     so nothing jumps when a job finishes. */
  .quest.owed{
    position:relative;
    /* The grey rule a quest normally wears on top would run straight through
       a rounded card, so the ring is the whole of the edge and the border is
       only there to give it somewhere to sit. */
    border:1px solid transparent; border-radius:.55rem;
    padding:.6rem .7rem; margin-bottom:.2rem;
    background:color-mix(in srgb, var(--gold-2) 7%, transparent);
    box-shadow:0 0 0 1px var(--gold-2) inset;
  }
  .quest.owed .btns{ margin-top:.5rem; }
  .quest.collecting{
    position:relative; overflow:visible;
    animation:collect-lift .55s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes collect-lift{
    0%{ transform:translateY(0) scale(1); box-shadow:0 0 0 1px var(--gold-2) inset; }
    35%{ transform:translateY(-4px) scale(1.015); box-shadow:0 0 18px 2px var(--gold-2); }
    100%{ transform:translateY(0) scale(1); box-shadow:0 0 0 1px transparent inset; opacity:.55; }
  }
  .reward-fly{
    position:absolute; left:50%; top:45%;
    transform:translate(-50%,0);
    font-weight:700; font-size:1rem; color:var(--gold);
    text-shadow:0 1px 6px rgba(0,0,0,.8);
    pointer-events:none; white-space:nowrap;
    animation:reward-climb .8s ease-out both;
  }
  @keyframes reward-climb{
    0%{ opacity:0; transform:translate(-50%,6px) scale(.9); }
    25%{ opacity:1; transform:translate(-50%,-6px) scale(1.06); }
    100%{ opacity:0; transform:translate(-50%,-42px) scale(1); }
  }
  /* A berth filled gets a face rather than a line of text. */
  .joined{ text-align:center; }
  .joined-face{
    display:block; margin:0 auto .6rem;
    width:96px; height:96px; image-rendering:pixelated;
    border-radius:.6rem; border:1px solid var(--gold-2);
    background:var(--sunk, rgba(0,0,0,.3));
    animation:joined-in .5s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes joined-in{ 0%{ opacity:0; transform:scale(.8) translateY(8px); } 100%{ opacity:1; transform:none; } }
  .joined .say{ text-align:left; }
  @media (prefers-reduced-motion: reduce){
    .quest.collecting, .reward-fly, .joined-face{ animation:none; }
    .reward-fly{ opacity:0; }
  }
</style>
</head>
<body>

<canvas id="chart" aria-label="The navigation chart: the Lamp, its worlds, and your ship's predicted path." role="img"></canvas>

<header id="hud" aria-live="off">
  <!-- Two different pictures because they want two different answers: a skim
       is "brace and let it happen", the ground is "move the burn". -->
  <div class="warn" id="h-hazard" hidden role="status">
    <svg id="haz-skim" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 15 h18"/><path d="M5 18.5 h14"/><path d="M12 3.5 c2.6 3 3.6 6 3.6 8.4 L12 14.4 8.4 11.9 C8.4 9.5 9.4 6.5 12 3.5z"/></svg>
    <svg id="haz-crash" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 3.2 L22 20.5 H2 z"/><path d="M12 9.5 V14"/><path d="M12 17 v.4"/></svg>
    <b id="haz-text">—</b>
  </div>
  <div class="stat" id="h-dv-wrap"><small>Fuel</small><b id="h-dv">—</b><div id="dvbar"><i id="h-dvfill"></i><i id="h-dvplan"></i></div></div>
  <div class="stat"><small>Coin</small><b id="h-money">—</b></div>
  <div class="stat"><small>Hold</small><b id="h-hold">—</b></div>
  <div class="stat" id="clock-stat" hidden><small>Clock</small><b id="h-warp">—</b></div>
  <!-- What a cat navigator is for: not the range now, which says nothing about
       whether you arrive, but how close the path actually comes and how fast
       you are closing. Only drawn with her aboard and only near a drift. -->
  <div class="stat" id="rv-stat" hidden><small>Rendezvous</small><b id="h-rv">—</b></div>
  <div class="stat" id="where"><small>Where</small><b id="h-where">—</b><span id="dockhint"></span></div>
  <!-- A cog: one ring, one hub, eight teeth on the spokes of a compass. Drawn
       from the middle out so it is symmetric by construction — the hand-written
       bezier cog it replaces sat a pixel high and to the left of its own
       button, which is exactly the sort of thing a gear icon cannot get away
       with when it is the only round object in a row of text. -->
  <button id="m-gear" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="2.5"/><path d="M12 5.6V2.4M12 18.4v3.2M5.6 12H2.4M18.4 12h3.2M7.47 7.47 5.2 5.2M16.53 16.53l2.27 2.27M16.53 7.47 18.8 5.2M7.47 16.53 5.2 18.8"/></svg></button>
</header>
<!-- Not inside the strip: see the note by #gearmenu in the stylesheet. -->
<div id="gearmenu" role="dialog" aria-label="Settings" hidden>
  <div id="gear-tabs" role="tablist" aria-label="Settings sections">
    <button class="tab" role="tab" data-gtab="game" aria-selected="true" aria-controls="gear-body">Game</button>
  </div>
  <div id="gear-body" role="tabpanel"></div>
</div>

<div id="act">
  <button id="dock-go" hidden title="Dock (d)" aria-label="Dock here">
    <svg class="i-dock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.4"/><path d="M12 10.4 V20"/><path d="M8 13.5 H16"/><path d="M5 15.5 a7 7 0 0 0 14 0"/></svg>
    <svg class="i-lift" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M12 4 V16"/><path d="M8 8 L12 4 L16 8"/><path d="M6 20 H18"/></svg>
  </button>
</div>

<div id="view">
  <button id="v-fit" title="Back to your ship, and frame it (f)">&#9678;</button>
  <!-- Only a ship with a navigator aboard has this at all: it is what she does. -->
  <button id="v-far" hidden title="Show the path past the next flyby (v)" aria-pressed="true" aria-label="Show the path past the next flyby"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 17 c5 0 7-10 12-10 c4 0 6 3 8 5"/><circle cx="14" cy="7" r="1.6"/><path d="M18.5 10.5 L22 12 L20.5 8.4"/></svg></button>
  <button id="m-dock" hidden title="The port (p)" aria-label="Open the port menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 h16"/><path d="M8 20 V5"/><path d="M8 5 h10"/><path d="M15 5 V9"/><path d="M13 9 h4 v4 h-4 z"/></svg></button>
  <button id="m-ship" title="Your ship (p)" aria-pressed="true" aria-label="Open the ship menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 c3 3.4 4.2 7 4.2 10.2 L12 16.5 7.8 13.2 C7.8 10 9 6.4 12 3z"/><path d="M7.8 12 L4.8 16.4 7.8 15.2"/><path d="M16.2 12 L19.2 16.4 16.2 15.2"/><circle cx="12" cy="9.4" r="1.7"/></svg></button>
</div>

<aside id="panel" aria-label="Ship and port">
  <div id="grab"></div>
  <div id="tabs" role="tablist"></div>
  <div id="tabbody" role="tabpanel" tabindex="0"></div>
</aside>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="chatter" aria-live="polite" aria-atomic="false" hidden></div>

</div>

<div id="tut" hidden>
  <button id="tut-min" title="Fold it away" aria-label="Fold this message away" aria-expanded="true">&#8211;</button>
  <small id="tut-step"></small>
  <h3 id="tut-title"></h3>
  <div id="tut-body"></div>
  <div class="btns"><button class="btn sm" id="tut-skip">Stop writing, Theo</button></div>
</div>

<dialog id="modal"></dialog>

<!-- The opening film: a lighter coming up out of Tassel's ocean. Hidden until
     a new ship starts, and gone for good once it has played or been skipped. -->
<div id="intro" hidden>
  <canvas id="intro-art" role="img" aria-label="A lighter lifts out of Tassel's ocean at dawn, climbs through the clouds, and reaches orbit."></canvas>
  <p id="intro-cap"><small>Tassel</small>Out of the waves, above the clouds, and into the stars…</p>
  <button id="intro-skip" title="Skip the opening (any key)">Skip &#9656;</button>
</div>

<script type="module">
import { createChart, PALETTE, locateOnPrediction, railCrossings, fmtAu, bodyColour } from './render.js';
import { portraitURL } from './sprites.js';
import * as S from './sim.js';
import { CONST, PORTS, GOODS, UPGRADES, TEXT, SPECIES, GLOSSARY, BELT_ROCKS, ARC_DEBRIS } from './content.js';
import { segmentApses, norm, sub, add, unit, dist, absState, elementsFromState } from './orbit.js';
import { playIntro } from './intro.js';

const world = S.world;
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ------------------------------------------------------------- state */

const params = new URLSearchParams(location.search);
/* Which of the three this window is playing. The title screen puts it in the
   address; opening play.html directly picks up wherever the player was last,
   and an old save from before there were slots becomes slot one on the way. */
S.migrateLegacy();
const SLOT = S.isSlot(params.get('slot')) ? Number(params.get('slot')) : S.activeSlot();
S.setActiveSlot(SLOT);

let state = null;
const loadSave = () => S.readSlot(SLOT);
function save(){
  if(!state) return;
  S.writeSlot(SLOT, state);   // a private window or a full disk simply does not stick
}
/* A seed can be named in the address. It decides the ship's name and every
   roll the game will ever make, so two people with the same seed see the same
   offers — which is what makes a strange one reportable, and what lets the
   tests fly the same lesson twice. */
function freshSeed(){
  const asked = Number(params.get('seed'));
  return Number.isFinite(asked) && asked > 0 ? Math.floor(asked) : ((Date.now() % 100000) | 1);
}
/* A ship's first minute or a ship picked back up: the opening film plays for
   the first of those and not for the second. */
let fresh = true;
if(params.has('new') || params.has('seed')){
  state = S.newGame(freshSeed());
  if(!params.has('seed')) history.replaceState(null, '', location.pathname);
}else{
  const saved = loadSave();
  if(saved){ state = saved; fresh = false; }
  else state = S.newGame(freshSeed());
}

/* ------------------------------------------------------------- chart */

const canvas = $('chart');
const chart = createChart(canvas, world, { reducedMotion: reduced });
/* The strips the HUD, the chart controls and the panel own. Labels keep out
   of them; the dots still show through. */
function refreshInsets(){
  const h = $('hud').getBoundingClientRect().height;
  const wide = innerWidth > 760;
  chart.labelInsets = {
    top: Math.round(h + 6 + (wide ? 0 : 44)),
    right: Math.round(panelOpen && wide ? $('panel').getBoundingClientRect().width + 24 : 56),
    bottom: Math.round(wide ? 24 : 12),
    left: 8,
  };
}
addEventListener('resize', refreshInsets);
const belt = { inner: CONST.BELT.inner, outer: CONST.BELT.outer, rocks: BELT_ROCKS, debris: ARC_DEBRIS };
addEventListener('resize', () => chart.resize());

let prediction = null, nodePositions = [], apses = [], crossedRails = [], predictedAt = -1, predictedReal = -1e9;
let hazard = { skim: null, crash: null };
/* The moment on the road that was just tapped, while the card about it is
   up: drawn as a breathing ring so the player can see which line they hit
   before choosing what to do with it. Gone when the card closes. */
let tapMark = null;
let selectedNode = -1;
/* Whether the clock is stopped because a burn is open, as opposed to because
   the player stopped it. Only a hold we put on do we take off again. */
let heldForPlan = false;
let panelOpen = innerWidth > 760;
let tab = null;

/* How far ahead the *solver* is allowed to look. The drawn road is a
   different question entirely: see S.planImmediate, which shows the orbit you
   are on and the one thing that happens next, and nothing after that. */
function horizonFor(){
  const b = world.get(state.ship.body);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  let h = 0;
  if(Number.isFinite(el.period)) h = Math.max(h, Math.min(el.period * 2.2, 900));
  else h = Math.max(h, 120);
  if(state.nodes.length) h = Math.max(h, state.nodes[state.nodes.length - 1].t - state.t + Math.max(90, Number.isFinite(el.period) ? el.period : 0));
  if(b.id === 'lamp') h = Math.max(h, 900);
  return Math.min(h, 5000);
}

function replan(force = false){
  if(state.dockedAt){ prediction = null; nodePositions = []; apses = []; crossedRails = []; hazard = { skim: null, crash: null }; return; }
  /* Re-solving the whole road is the most expensive thing this page does, so
     it happens on a real-time budget rather than a game-time one: at most a few
     times a second, whatever the warp. Measuring it in game days got it wrong
     in both directions — a stray factor of sixty once let the drawn road go
     stale for four hundred days at the top warp, and taking the factor out
     made it re-solve so often at ×1 that the frame rate, and with it the
     clock, dropped to a third of real time. */
  const nowReal = performance.now();
  if(!force && predictedAt >= 0 && nowReal - predictedReal < 280) return;
  predictedReal = nowReal;
  predictedAt = state.t;
  /* A burn that is written down is on the chart whether or not it is open:
     the white road runs up to it and the yellow road carries on from it. With
     nothing written down at all there is one road, a whole lap of the orbit
     the ship is actually on. */
  prediction = S.planImmediate(state, true, { farSight: S.seesPast(state) });
  hazard = S.hazards(state, prediction);
  if(!prediction){ nodePositions = []; apses = []; crossedRails = []; return; }
  nodePositions = state.nodes.map(n => locateOnPrediction(world, prediction, n.t));
  /* The low point and the high point of every closed leg on the drawn road.
     A near-circular heliocentric orbit has no meaningful pair — its two apses
     are a hair apart and the labels sit on top of each other — so it keeps
     neither. */
  const ic = prediction.intercept;
  /* A thing nobody has found keeps its numbers and loses its name. The road
     still runs into the Maw whether or not a ship can see it, and the crosshair
     still says how close and how fast — it is called ??? until the sensors are
     aboard, which is the whole of what they buy. */
  const unknown = S.unseen(state);
  interceptLabel = ic
    ? (ic.grazes
        ? `hits ${S.nameFor(ic.body, unknown)}`
        : `${S.nameFor(ic.body, unknown)} ${fmtAu(ic.altitude)} · ${S.fmtKms(ic.speed)}${ic.inMouth ? ' · in docking range' : ''}`)
    : null;
  /* The window in the corner already says whose encounter it is, so its line
     is the numbers only. */
  insetLabel = ic
    ? (ic.grazes
        ? 'this path hits it'
        : `${fmtAu(ic.altitude)} · ${S.fmtKms(ic.speed)}${ic.inMouth ? ' · in docking range' : ''}`)
    : null;
  /* The first rail the road cuts across, and where that world will be when it
     does. Every crossing is found, because the soonest one is not the first
     one discovered — bodies are walked in turn, not in time — and then all
     but that one is dropped. Worked out here rather than every frame: it is a
     bisection per crossing, and it only changes when the road does. */
  crossedRails = railCrossings(world, prediction, state.t, { minLead: S.MIN_LEAD });
  apses = [];
  prediction.segments.forEach((seg, i) => {
    const b = world.get(seg.body);
    if(b.id === 'lamp' && seg.elements.e < 0.05) return;
    for(const a of segmentApses(seg, b.mu)){
      apses.push({ segIndex: i, ...a, label: `${a.kind === 'periapsis' ? 'Low' : 'High'} ${fmtAu(Math.max(0, a.distance - (b.radius ?? 0)))}` });
    }
  });
}

/* ------------------------------------------------------------- loop */

let last = performance.now();
let saveTimer = 0;
let firstStoryDone = false;
let lockedTo = null;
/* The one number the on-chart editor shows. Recomputed when the burn changes,
   not every frame: solving what a mark costs is not free. */
let nodeLabel = null, nodeLabelKey = '', interceptLabel = null, insetLabel = null;
/* The Astrolabe is the one tab that goes stale on its own: every other one
   reads the ship, and this one reads the sky moving. It is also the most
   expensive thing the panel draws — a Lambert sweep per world — so it is
   redrawn on a budget rather than every frame, and only while the clock is
   actually running and the tab is actually up.

   The budget is in *game* time, which is the thing it reads. It used to be
   half a second of real time, and at ×1 that is four ten-thousandths of a day:
   the sweep ran twice a second and produced the same characters every time,
   because the coarsest figure on a row moves by one digit every forty-five
   real minutes at that rate. Two Lambert sweeps a second to redraw nothing.
   Budgeted on the sky instead, it recomputes when there is something to
   recompute — rarely at ×1, smoothly under warp — and the real-time floor is
   left in so that a fast skip cannot make it thrash. */
const WINDOWS_REDRAW_MS = 250;
const WINDOWS_STEP_DAYS = 0.05;      // the resolution of the coarsest figure shown
let windowsDrawnAt = -1e9, windowsDrawnT = null;
let dockLineKey = null, dockLineAt = -1e9;
/* What every mark written down will take out of the tank, drawn on the gauge. */
let plannedSpend = 0;
/* What the selected mark says on the chart, and what the whole plan will
   spend. Both come from one solve, keyed on every mark rather than on the
   open one: the fuel gauge shows the total, so a mark nobody has selected
   still has to count. */
function refreshNodeLabel(){
  const key = state.dockedAt ? '' : state.nodes.map(n => `${n.t}|${n.prograde}|${n.radial}`).join(';') + `@${selectedNode}`;
  if(key === nodeLabelKey) return;
  nodeLabelKey = key;
  const n = state.nodes[selectedNode];
  if(state.dockedAt || !state.nodes.length){ nodeLabel = null; plannedSpend = 0; return; }
  const marks = S.markStates(state, horizonFor());
  plannedSpend = marks.reduce((sum, m) => sum + (m?.cost ?? 0), 0);
  /* Direction words, not a length. "0.12 km/s" is the fuel this will burn,
     and two playtesters braking at Slate read it as their speed and were
     baffled that pressing Back made it climb. The fuel is on the gauge. */
  const rvNow = S.rendezvous(state);
  nodeLabel = n ? `${S.burnWords(n, rvNow ? S.portName(rvNow.target) : null)} · in ${S.fmtDays(n.t - state.t)}` : null;
}
function frame(now){
  const real = Math.min(0.1, (now - last) / 1000);
  last = now;
  const dt = S.dtForFrame(state, real);
  if(dt > 0){
    const wasDocked = state.dockedAt;
    const events = S.tick(state, dt);
    handleEvents(events);
    /* Arriving ends a skip. A tow or a distress call can land a ship at a
       harbour in the middle of one, and the clock should not carry on running
       past the thing it was sent to. Pressing dock does this for itself. */
    if(!wasDocked && state.dockedAt){ stopSkip(); replan(true); }
    else if(events.length) replan(true);
    else replan(false);
  }
  /* Crossing into a moon's reach changes what the chart is about by four
     orders of magnitude. The lock follows it; so must the zoom, or the new
     orbit is a dot or a wall. */
  /* Crossing into a moon's reach changes what the chart is about by four
     orders of magnitude: come back to the ship and re-frame, or the player is
     left looking at a world they have just left. */
  if(state.ship.body !== lockedTo){
    lockedTo = state.ship.body;
    /* Through focus, not by setting the lock: a pan is an offset from the
       thing you were looking at, and four orders of magnitude ago is not a
       place to keep looking from. */
    chart.focus('ship', null, false);
    replan(true);
    frameShipOrbit();
  }
  saveTimer += real;
  if(saveTimer > 30){ saveTimer = 0; save(); }
  refreshNodeLabel();
  const docking = state.dockedAt ? null : S.dockingStatus(state);
  /* A harbour in sight ends a skip once, so you are awake for the arrival —
     but only a harbour somewhere other than where the skip set off from. A
     change of reach already ends a skip on its own, so what this is really
     for is a harbour with no reach to cross: the Maw. */
  if(docking && docking.port !== skipHome && (docking.ok || docking.inZone) && state.warp > 1 && !state.flags.zoneWarpDropped){ stopSkip(); state.flags.zoneWarpDropped = true; }
  if(!docking) state.flags.zoneWarpDropped = false;
  if(warpTarget != null && state.t >= warpTarget) stopSkip();
  const shipAbs = state.dockedAt ? { r: absState(world, state.dockedAt, state.t).r, v: absState(world, state.dockedAt, state.t).v } : { r: S.shipAbsPos(state), v: S.shipAbsVel(state) };
  chart.draw({
    t: state.t, now, shipAbs, shipBody: state.ship.body, docked: !!state.dockedAt,
    prediction, nodes: state.nodes, nodePositions, selectedNode, apses, railCrossings: crossedRails,
    tapMark: tapMark != null && prediction && !state.dockedAt ? locateOnPrediction(world, prediction, tapMark) : null,
    editing: selectedNode >= 0 && !!state.nodes[selectedNode],
    shipLocalV: state.dockedAt ? null : state.ship.v,
    nodeLabel, interceptLabel, insetLabel,
    belt, nearPort: docking?.port ?? null, docking,
    hidden: S.unseen(state),
  });
  if(dt > 0 && panelOpen && tab === 'windows'
     && now - windowsDrawnAt > WINDOWS_REDRAW_MS
     && (windowsDrawnT == null || Math.abs(state.t - windowsDrawnT) >= WINDOWS_STEP_DAYS)){
    windowsDrawnAt = now;
    windowsDrawnT = state.t;
    renderTab();
  }
  /* The Ahead panel now leads with the harbour you are inside, and that line
     is a number the pilot is actively burning down — so it has to move. Keyed
     on what it says rather than on the state behind it, so a steady coast
     rebuilds nothing and a burn rebuilds it a few times a second. */
  if(panelOpen && tab === 'ship' && dt > 0){
    const key = docking && docking.kind === 'zone' && (docking.inZone || docking.ok)
      ? `${docking.port}:${docking.ok}:${Math.round(S.kms(docking.relSpeed) * 100)}` : '';
    if(key !== dockLineKey && now - dockLineAt > 200){ dockLineKey = key; dockLineAt = now; renderTab(); }
  }
  renderHud(docking);
  renderDockCard(docking);
  refreshRecentre();
  /* Seen is seen, even for a moment. Nothing else in the page knows what is
     actually in the frame, and a moon that swings through it between two
     reads of the lesson would otherwise not count. One arithmetic check a
     frame, and only until it has happened once. */
  if(!state.flags.sawTarget && !state.flags.tutorialSkipped && targetOnScreen()) noteLook('sawTarget');
  requestAnimationFrame(frame);
}

/* Somebody signing on is the one reward that does not show up in the purse,
   and finishing a quest is otherwise silent — the Quests card just quietly
   ticks over. Without this a berth fills and nothing says so. */
/* A berth filled is the one reward with a face, so it gets shown rather than
   mentioned: the portrait, who they are, and the line their card carries. */
function showCrewPortrait(role, quest){
  const r = (TEXT.crew?.roles ?? []).find(x => x.id === role);
  const name = r?.person?.name ?? 'Somebody';
  const url = portraitURL(role);
  openModal(`<div class="joined">
      ${url ? `<img class="joined-face" src="${url}" alt="" width="96" height="96">` : ''}
      <h2>${esc(name)} signs on</h2>
      <p class="lock">Your ${esc((r?.name ?? role).toLowerCase())}${quest ? ` · ${esc(quest.title)}` : ''}</p>
      <p class="say">${esc(r?.person?.line ?? '')}</p>
      <div class="btns"><button class="btn primary" id="m-ok">Welcome aboard</button></div>
    </div>`, m => m.querySelector('#m-ok').addEventListener('click', closeModal));
}

/* A job has three things written for it and this is where two of them land.
   The board carries the pitch; these are the moment you agree and the moment
   you are paid, which are the two beats a card in a list cannot do — one is an
   answer to something you just pressed, and the other is the point of the whole
   trip. Both are the same shape so they read as a pair. */
function showQuestScene(q, { kind, say, foot, then }){
  openModal(`<div class="joined">
      <h2>${esc(q.title)}</h2>
      <p class="lock">${esc(q.giver)}${kind ? ` · ${esc(kind)}` : ''}</p>
      <p class="say">${esc(say)}</p>
      ${foot ? `<p>${foot}</p>` : ''}
      <div class="btns"><button class="btn primary" id="m-ok">${then ? 'Go on' : 'Right you are'}</button></div>
    </div>`, m => m.querySelector('#m-ok').addEventListener('click', () => { closeModal(); then?.(); }));
}

function noteCrew(events){
  for(const e of events ?? []){
    if(e.kind !== 'crewJoined') continue;
    const r = (TEXT.crew?.roles ?? []).find(x => x.id === e.role);
    toast(`${r?.person?.name ?? 'Somebody'} has signed on as your ${(r?.name ?? e.role).toLowerCase()}.`, 'story', 9000);
  }
}

function handleEvents(events){
  noteCrew(events);
  for(const e of events){
    /* A skip runs through the burns it was told about. Pointing at somewhere
       past a mark is a player saying "and that one too" — stopping dead at
       every mark on the way meant a road with three burns on it took four
       skips to fly, and the burns fire by themselves anyway. What still ends
       a skip is anything the plan did not promise: a change of reach, a burn
       the tank could not pay for, a toll, a crash, a dry tank. */
    if(e.kind === 'soi') stopSkip();
    if(e.kind === 'burn') { save(); toast(`Burned ${S.fmtKms(e.magnitude)}.`); if(tab === 'ship') renderTab(); }
    if(e.kind === 'short'){ stopSkip(); toast(`The tank ran short: ${S.fmtKms(e.got)} of ${S.fmtKms(e.wanted)}.`, 'bad'); }
    /* A change of reach re-frames the chart, re-draws the road and changes
       every number on the Plan card. The panel has to be told, or it sits
       there naming the world you just left. */
    if(e.kind === 'soi'){ toast(`Now in ${S.nameFor(e.to, S.unseen(state))}'s gravity.`); renderTab(); tutorialCheck(); }
    if(e.kind === 'story') toast(e.text, 'story', 9000);
    if(e.kind === 'toll'){ stopSkip(); showToll(e.pending); }
    if(e.kind === 'crash'){ stopSkip(); showCrash(e.body); }
    if(e.kind === 'dry'){ stopSkip(); toast(`${TEXT.captainLines.onStranded[1] ?? 'The tank is dry.'} The ship menu has the distress call.`, 'bad', 9000); if(tab === 'ship') renderTab(); }
    if(e.kind === 'missed'){ toast(e.count > 1 ? `${e.count} burns went by unspent.` : 'That burn went by unspent.', 'bad'); if(tab === 'ship') renderTab(); }
    /* A handover takes the crates out of the hold and puts the pay in the
       purse, and both of those are on the panel. Without this the Ship card
       went on listing Nellie's pebble after Nellie had it — the HUD said the
       hold was empty and the panel underneath disagreed, in the same frame. */
    if(e.kind === 'salvaged'){
      toast(`Off ${S.portName(e.wreck)}: ${e.goods.map(g => `${g.qty} × ${S.goodById(g.good)?.name ?? g.good}`).join(', ')}.`, 'story', 7000);
    }
    if(e.kind === 'questStep' || e.kind === 'questDone'){ renderTab(); save(); }
  }
}

/* ------------------------------------------------------------- HUD */

/* Distance at intercept and relative speed, which are the two numbers a
   rendezvous is actually flown on. Without a navigator the ship is still in
   the reach and the axes still point at the target — she is the instruments,
   not the physics — so the readout is hers and the flying is not. */
function showRendezvous(){
  const box = $('rv-stat');
  const rv = S.rendezvous(state);
  if(!rv || !rv.instruments){ box.hidden = true; return; }
  box.hidden = false;
  const miss = rv.closing ? fmtAu(rv.atIntercept) : fmtAu(rv.range) + ' (opening)';
  $('h-rv').textContent = `${miss} · ${S.fmtKms(rv.speed)}`;
  box.title = `Closest the path comes to ${S.portName(rv.target)}, and how fast you are closing.`
    + (rv.timeToIntercept != null ? ` Nearest in ${S.fmtDays(rv.timeToIntercept)}.` : '');
}

function showHazard(){
  const box = $('h-hazard'), skim = $('haz-skim'), crash = $('haz-crash');
  const ground = hazard.crash, air = hazard.skim;
  /* Ground beats air for the corner. Both can be true — a dive that sheds too
     little still ends on the rocks — and of the two, only one of them is worth
     interrupting the player for. */
  box.hidden = !(ground || air);
  if(box.hidden) return;
  box.classList.toggle('bad', !!ground);
  crash.hidden = !ground;
  skim.hidden = !!ground;
  if(ground){
    box.setAttribute('aria-label', `Warning: this path meets ${S.portName(ground.body)}`);
    $('haz-text').textContent = `Hits ${S.portName(ground.body)}`;
  }else{
    const risky = air.risk > 0;
    box.setAttribute('aria-label', `Air braking at ${S.portName(air.body)} ahead`);
    $('haz-text').textContent = `Air brake · ${S.fmtKms(air.dv)}`
      + (risky ? ` · ${Math.round(air.risk * 100)}% risk` : ' · safe');
  }
}

function renderHud(docking){
  showHazard();
  refreshFarButton();
  showRendezvous();
  refreshOwedFlash();
  /* The tank, and what the plan will take out of it. The cost of a burn is
     shown here and nowhere near the burn itself: it is a length of fuel, and
     next to a mark it read as a speed — which made pressing Back to slow down
     look like it was speeding the ship up. */
  const spend = Math.min(plannedSpend, state.dv);
  $('h-dv').textContent = `${S.fmtKms(state.dv)} / ${S.fmtKms(S.usableTank(state))}`
    + (plannedSpend > 1e-12 ? ` · ${S.fmtKms(plannedSpend)} planned` : '');
  const fill = $('h-dvfill');
  const cap = S.usableTank(state);
  const frac = cap > 0 ? state.dv / cap : 0;
  fill.style.width = `${Math.round(frac * 100)}%`;
  fill.classList.toggle('low', frac < 0.15);
  const planBar = $('h-dvplan');
  planBar.style.right = `${Math.round((1 - frac) * 100)}%`;
  planBar.style.width = `${Math.round((cap > 0 ? spend / cap : 0) * 100)}%`;
  $('h-dv-wrap').classList.toggle('warn', frac < 0.15);
  $('h-money').textContent = S.fmtMoney(state.money) + (state.debt > 0 ? ` (owe ${S.fmtMoney(state.debt)})` : '');
  $('h-hold').textContent = `${S.usedUnits(state)} / ${S.holdUnits(state)}`;
  /* The clock says what it is doing, not what rung it is on: held, running,
     or running itself somewhere with the seconds left to sit through. */
  /* The clock only speaks up when it is doing something worth saying. A
     running clock is the ordinary state of the game and "running" was a word
     that never changed anything; held and skipping are the two a pilot has to
     know about, so the stat appears for those and is not there otherwise. */
  const clockWord = state.paused ? 'held'
    : warpTarget != null ? `skipping · ${Math.max(1, Math.round((warpTarget - state.t) / (CONST.BASE_RATE_DAYS_PER_SEC * S.warpRate(state))))}s`
    : null;
  $('clock-stat').hidden = clockWord == null;
  if(clockWord != null) $('h-warp').textContent = clockWord;
  const b = world.get(state.ship.body);
  /* Where you are, in the three states a ship is ever in: tied up, going round
     something, or on your way through its gravity and not coming back. It used
     to say "In Slate's gravity" for both of the last two, which is true of a
     ship in a neat circle and of one falling past at four km/s, and those are
     not the same news. A closed path is one with a period. */
  const el = state.dockedAt ? null : elementsFromState(b.mu, state.ship.r, state.ship.v);
  /* Whatever has hold of you, named only if you have found it. A ship can be in
     the Maw's gravity without the instrument that says what the Maw is, and the
     readout should say so rather than give the answer away. */
  const whose = S.nameFor(state.ship.body, S.unseen(state));
  $('h-where').textContent = state.dockedAt
    ? `${S.isHulk(state.dockedAt) ? 'Alongside' : 'Docked at'} ${S.portName(state.dockedAt)}`
    : Number.isFinite(el.period) ? `In orbit around ${whose}`
    : `Passing through ${whose}'s gravity`;
  const hint = $('dockhint');
  if(!docking){ hint.textContent = ''; return; }
  const pb = world.get(docking.port);
  /* The hint is a button as much as a label, so when the answer is yes it says
     what pressing it does. It used to say the harbour "will take your lines",
     which is a rope nobody in this game has ever thrown: there is no landing
     and no mooring, only an orbit you match. */
  if(docking.ok){ hint.textContent = ` · dock at ${pb.name}`; hint.className = ''; return; }
  hint.className = 'far';
  if(docking.kind === 'orbit'){
    hint.textContent = !docking.bound ? ` · ${pb.name}: not in orbit`
      : !docking.clear ? ` · ${pb.name}: that orbit goes through it`
      : ` · ${pb.name}: bring the high point inside ${fmtAu(docking.mouth)}`;
  }else{
    if(docking.inZone) hint.className = 'near';
    hint.textContent = docking.inZone
      ? ` · ${pb.name}: ${S.fmtKms(docking.over)} too fast`
      : ` · ${pb.name} ${fmtAu(docking.distance)} off`;
  }
}

/* The one button that acts on the ship: tie up, or cast off.
 *
 * Adrift it is a mooring ring, and only when a stable orbit close in has
 * earned it — a thing you have done rather than a card following you round
 * the sky listing what you have not. Tied up it is the way out again, which
 * is the only thing a moored ship ever wants from the chart, and it is the
 * same button because they are the same question answered twice. */
function renderDockCard(docking){
  const b = $('dock-go');
  const moored = !!state.dockedAt;
  b.hidden = !(moored || (docking && docking.ok));
  b.classList.toggle('lift', moored);
  /* toggleAttribute, not `.hidden`: that property belongs to HTMLElement and
     these are SVG elements, so assigning it set a JS expando nobody reads and
     left the anchor showing on a moored ship. */
  b.querySelector('.i-dock').toggleAttribute('hidden', moored);
  b.querySelector('.i-lift').toggleAttribute('hidden', !moored);
  b.title = moored ? `Lift off from ${S.portName(state.dockedAt)}` : 'Dock (d)';
  b.setAttribute('aria-label', moored ? 'Lift off' : 'Dock here');
}

/* ------------------------------------------------------------- time */

/* There is no ladder of speeds to climb, and nothing to hold down. The clock
   runs at ×1 — ten real minutes to a lap of the low orbit a new game opens
   in, and longer for everything else in the sky — until you point at
   somewhere on your road and say go. Then it runs at whatever rate covers
   that stretch in about ten seconds and stops itself on arrival.
   Anything that matters on the way (a burn, a change of reach, a harbour
   mouth) cancels the skip, because the whole point of skipping is to be
   awake for the parts that are not a coast. */

let warpTarget = null;
/* The world a skip began around. Its own harbour is not an arrival. */
let skipHome = null;
function setRate(mult){
  state.warp = Math.max(1, Math.min(CONST.MAX_WARP, mult));
}
function stopSkip(){ warpTarget = null; skipHome = null; setRate(1); }
/* There is no pause button any more: the menu is the pause. Opening it is
   already what a player does when they want to stop and read something, and
   the Clock stat in the bar says which it is. Space still works. */
function setPaused(on){
  if(state.paused === !!on) return;
  state.paused = !!on;
  if(state.paused) warpTarget = null;
  setRate(state.paused ? 1 : state.warp);
}

/* Run to a moment and stop just short of it. The rate is chosen once, from
   the whole distance, so the ten seconds it promised are the ten seconds it
   takes; a crossing part way through simply ends the skip. */
function skipTo(t){
  const plan = S.skipPlan(state, t);
  if(!plan) return false;
  warpTarget = plan.t - Math.min(0.02, plan.days * 0.02);
  state.paused = false;
  /* Remember where this skip started. The harbour rule below wakes you when
     a harbour comes into sight, which is worth waking for when it belongs to
     somewhere you have arrived — and never when it is the harbour you are
     leaving. The game opens parked in Tassel's docking range, and the quiet
     window after casting off ends a moment into the first skip, so Tassel's
     own harbour "came into sight" and cancelled it: the first skip of every
     game died on its second frame, which is what made warping look broken. */
  skipHome = state.ship.body;
  setRate(plan.rate);
  return true;
}

/* The confirmation. It says where, when, and how long you will be sitting
   there — which is the only question a skip actually raises. */
function saySeconds(sec){
  if(sec < 1.5) return 'a moment';
  if(sec < 90) return `about ${Math.round(sec)} seconds`;
  return `about ${Math.round(sec / 60)} minutes`;
}
function whereAt(t){
  if(!prediction) return null;
  const seg = prediction.segments.find(sg => t >= sg.t0 - 1e-9 && t <= sg.t1 + 1e-9) ?? prediction.segments[prediction.segments.length - 1];
  return seg ? world.get(seg.body) : null;
}
function askSkip(t, what){
  const plan = S.skipPlan(state, t);
  if(!plan){ toast('That is not ahead of you.', 'bad'); return; }
  const place = whereAt(t);
  /* Two sentences, not one: what you asked about, and then where *you* will
     be when it happens. They used to be one clause, which read correctly for
     a point on your own road and wrongly for anything else — "Veyra reaching
     that point is 240 days from now, in Tassel's gravity" says the wrong
     thing about Veyra. */
  openModal(`<h2>Skip ahead?</h2>
    <p>${esc(what ?? 'That point on your path')} is <b>${S.fmtDays(plan.days)}</b> from now.</p>
    <p class="lock">${place ? `You will be in ${esc(place.name)}'s gravity. ` : ''}The clock will run itself there and stop: ${saySeconds(plan.seconds)} of waiting.${plan.capped ? ' That is as fast as the clock goes.' : ''}</p>
    <div class="btns"><button class="btn primary" id="m-go">Go</button><button class="btn ghost" id="m-stay">Close</button></div>`, m => {
    m.querySelector('#m-go').addEventListener('click', () => { closeModal(); skipTo(t); });
    m.querySelector('#m-stay').addEventListener('click', closeModal);
  });
}

/* Tapping the road is how both of the things you can do to it start: write a
   burn down at that moment, or skip the clock to it. One gesture, two big
   buttons, and the time to that point on the card either way. */
function askAtPath(t){
  tapMark = t;
  /* One mark at a time while the lesson is running. The button is simply not
     available — no toast, no explanation: a beginner who has not been told
     they may have six does not need telling they may not. */
  const room = state.nodes.length < S.maxNodes(state);
  const full = S.tutorialRunning(state) ? '' : ' title="Six is plenty for one path."';
  const plan = S.skipPlan(state, t);
  const place = whereAt(t);
  openModal(`<h2>${S.fmtDays(Math.max(0, t - state.t))} along your path</h2>
    <div class="btns">
      <button class="btn" id="m-skip" ${plan ? '' : 'disabled'}>Warp here</button>
      <button class="btn primary" id="m-burn" ${room ? '' : 'disabled' + full}>Plan a burn</button>
      <button class="btn ghost" id="m-close">Close</button>
    </div>`, m => {
    m.querySelector('#m-close').addEventListener('click', closeModal);
    m.querySelector('#m-burn').addEventListener('click', () => {
      closeModal();
      const ix = S.addNode(state, t);
      if(ix < 0) return;   // the button is already disabled when there is no room
      /* The chart is the editor, so writing a burn down leaves the panel
         exactly as it was: shoving the side menu open over the sky is the
         opposite of what somebody who just tapped the sky wanted. */
      selectNode(ix); replan(true);
      if(tab === 'ship') renderTab();
      tutorialCheck(); save();
    });
    m.querySelector('#m-skip').addEventListener('click', () => { closeModal(); skipTo(t); });
  });
}

/* ------------------------------------------------------------- view */

$('v-fit').addEventListener('click', () => backToShip(true));
function setFarSight(on){
  state.farSight = on;
  const b = $('v-far');
  b.setAttribute('aria-pressed', String(on));
  b.classList.toggle('off', !on);
  b.title = on ? 'Showing the path past the next flyby (v)' : 'Show the path past the next flyby (v)';
  replan(true); draw(); save();
}
$('v-far').addEventListener('click', () => setFarSight(state.farSight === false));
function refreshFarButton(){
  const can = S.canSeePast(state);
  $('v-far').hidden = !can;

    const on = state.farSight !== false;

    $('v-far').classList.toggle('off', !on);
