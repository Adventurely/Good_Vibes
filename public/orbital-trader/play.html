}
$('m-ship').addEventListener('click', () => openMenu('ship'));
$('m-dock').addEventListener('click', () => openMenu('dock'));

/* ---------------------------------------------------------- settings */

/* The gear. What is in it is about the game rather than about the ship or the
   sky, which is why it is not another tab in the panel: leaving is not a thing
   you do to your ship.

   The clock stops while it is up, the way it does for every other menu here,
   and starts again exactly as it was — not simply running — so that opening
   the gear while paused and closing it again does not quietly set the ship
   moving. */
/* The sections, and what is in each. One today; the shape is here so the next
   one is a line rather than a rebuild. */
const GEAR_TABS = {
  game: () => `<button class="btn sm" id="gear-quit">&larr; Quit to title screen</button>`,
};
let gearTab = 'game';
function renderGearTab(){
  $('gear-body').innerHTML = (GEAR_TABS[gearTab] ?? GEAR_TABS.game)();
  for(const b of $('gear-tabs').querySelectorAll('[data-gtab]')){
    b.setAttribute('aria-selected', String(b.dataset.gtab === gearTab));
  }
  /* It saves as you play, but not necessarily in the last few seconds of it,
     so the way out writes the game down before it takes it. */
  $('gear-quit')?.addEventListener('click', () => { save(); location.href = './'; });
}
$('gear-tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-gtab]');
  if(!b) return;
  gearTab = b.dataset.gtab;
  renderGearTab();
  $('gear-body').querySelector('button')?.focus();
});

let gearOpen = false;
let gearWasPaused = false;
function openGear(on = !gearOpen){
  if(on === gearOpen) return;
  gearOpen = on;
  const menu = $('gearmenu'), btn = $('m-gear');
  btn.setAttribute('aria-expanded', String(on));
  menu.hidden = !on;
  if(!on){ setPaused(gearWasPaused); return; }
  gearWasPaused = !!state.paused;
  setPaused(true);
  renderGearTab();
  /* Placed off the button rather than pinned to the corner: the strip wraps
     to two rows on a phone, and a menu nailed to the top right would open
     somewhere the gear is not. */
  const r = btn.getBoundingClientRect();
  menu.style.top = `${Math.round(r.bottom + 6)}px`;
  menu.style.right = `${Math.round(innerWidth - r.right)}px`;
  $('gear-body').querySelector('button')?.focus();
}
$('m-gear').addEventListener('click', () => openGear());
/* Anywhere else is a dismissal, and only a dismissal: caught on the way down
   so the tap that closes the menu does not also land on the chart under it
   and pan the sky or plan a burn. */
addEventListener('pointerdown', e => {
  if(!gearOpen || e.target.closest('#gearmenu, #m-gear')) return;
  openGear(false);
  e.stopPropagation();
}, true);
/* The view is locked; there is nothing to keep in sync but the panel. */
function syncView(){}
/* `quiet` is for the times the layout moves the panel on its own — the first
   paint and a resize. Only a person opening it stops the clock. */
function togglePanel(open = !panelOpen, quiet = false){
  panelOpen = open;
  if(!quiet) setPaused(open);
  $('panel').classList.toggle('closed', !panelOpen);
  refreshMenuButtons();
  // On a phone the sheet covers the bottom of the chart, so the cards that
  // live there stand down while it is up.
  document.body.classList.toggle('sheet', panelOpen && innerWidth <= 760);
  document.body.classList.toggle('panel-open', panelOpen && innerWidth > 760);
  applyOffset();
}
/* The panel covers part of the chart, so shift the follow centre out from
   under it: left on a wide screen, up when it is a sheet across a phone. */
function applyOffset(){
  refreshInsets();
  if(!panelOpen){ chart.offset = [0, 0]; return; }
  const r = $('panel').getBoundingClientRect();
  chart.offset = innerWidth > 760 ? [-r.width / 2 - 8, 0] : [0, -Math.min(r.height, innerHeight * 0.62) / 2];
}
// A window that changes width changes which layout it is in, so the classes
// that depend on the width have to be worked out again.
addEventListener('resize', () => {
  /* A turn to landscape can leave a sheet taller than the screen it is on. */
  if(sheetH != null) setSheetHeight(nearestStop(sheetHeight()));
  togglePanel(panelOpen, true);
});

/* ------------------------------------------------------------- input */

/* How far a finger may slide on the way to a tap before the gesture is a drag
   instead. Below it, a slightly wobbly press on a road is still a press on
   that road; above it, the sky follows the finger. */
const TAP_SLOP = 6;

/* The chart can now be dragged away from what it is locked to, so it has to
   say when it has been. The cue is on the button that undoes it, and it lights
   only once the view is properly off — a few pixels of drift while placing a
   burn is not being lost. */
let recentreShown = false;
function refreshRecentre(){
  const off = chart.panned() > 0.03;
  if(off === recentreShown) return;
  recentreShown = off;
  $('v-fit').classList.toggle('off', off);
  $('v-fit').title = off
    ? 'Back to your ship, and frame it (f) — the chart has been dragged off its lock'
    : 'Back to your ship, and frame it (f)';
}

let drag = null;
let pinch = null;
const pointers = new Map();
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
    canvas.classList.remove('grab');
    drag = null; return;
  }
  const hit = chart.hitTest(e.clientX, e.clientY);
  if(hit?.kind === 'inset'){ lookAtEncounter(); drag = null; return; }
  if(hit?.kind === 'handle'){
    if(hit.axis === 'delete'){
      S.removeNode(state, hit.index); selectNode(-1); replan(true); renderTab(); save();
      drag = null; return;
    }
    drag = { kind: 'arrow' };
    pushAxis(hit.index, hit.axis);
    startRepeat(hit.index, hit.axis);
    return;
  }
  if(hit?.kind === 'node'){
    selectNode(selectedNode === hit.index ? -1 : hit.index);
    drag = { kind: 'node', index: hit.index, x: e.clientX, y: e.clientY, moved: false };
    replan(true); if(tab === 'ship') renderTab();
    return;
  }
  /* Empty sky is a pan. It stays a tap until the finger has actually gone
     somewhere — a few pixels of slide on the way to tapping a road is not a
     drag — and from then on it drags the sky, measured from whatever the
     chart is locked to rather than from the stars. */
  drag = { kind: 'pan', x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, hit };
});
canvas.addEventListener('pointermove', e => {
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pinch && pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    // Two fingers do both at once: the gap is the scale, the middle is the pan.
    if(d > 0 && pinch.d > 0) chart.zoomBy(d / pinch.d, m);
    chart.panBy(m[0] - pinch.m[0], m[1] - pinch.m[1]);
    noteLook('chartPanned');
    pinch.d = d; pinch.m = m; return;
  }
  if(!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(drag.kind === 'pan'){
    if(!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > TAP_SLOP){
      drag.moved = true;
      canvas.classList.add('grab');
    }
    if(drag.moved){ chart.panBy(dx, dy); noteLook('chartPanned'); }
    drag.x = e.clientX; drag.y = e.clientY;
    return;
  }
  if(drag.kind === 'node'){
    if(Math.hypot(dx, dy) > 4) drag.moved = true;
    if(!drag.moved || !prediction) return;
    /* Where the mark goes is the chart's rule (render.js, dragNodeTime): the
       time under the pointer, kept on its lap, between its neighbours, and
       never more than half a lap from where it was in one move. A finger a
       few pixels off the line used to catch the yellow road's return leg and
       throw the burn twenty laps out. */
    const t = chart.dragNodeTime(e.clientX, e.clientY, prediction, state.t, state.nodes, drag.index);
    if(t != null){
      state.nodes[drag.index].t = t;
      replan(true); if(tab === 'ship') renderTab();
    }
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  canvas.classList.remove('grab');
  if(!drag) return;
  const d = drag; drag = null;
  if(d.kind === 'pan' && !d.moved){
    /* A tap: the path takes a burn, a body becomes the target, empty sky
       deselects. The path wins ties, because a body's hit disc is a generous
       forty pixels across for fingers and at the zoom you cast off at, the
       whole parking orbit fits inside Tassel's — which made lesson two
       impossible to follow by tapping the road it names. */
    /* A burn first. A tap on the road or a rail within reach of a flame is a
       tap on the flame — a finger that lands on the line a burn sits on
       wants that burn opened, not a second one written on top of it. */
    const nb = prediction && !state.dockedAt ? chart.nearestNode(e.clientX, e.clientY) : null;
    if(nb && state.nodes[nb.index]){
      selectNode(nb.index);
      replan(true); if(tab === 'ship') renderTab();
      return;
    }
    const p = prediction && !state.dockedAt ? chart.nearestPathPoint(e.clientX, e.clientY, prediction, state.t) : null;
    const onBody = d.hit?.kind === 'body';
    const insideDrawn = onBody && d.hit.d <= (d.hit.drawn ?? 0) + 2;
    if(p && !insideDrawn && p.t > state.t + S.MIN_LEAD){ askAtPath(p.t); return; }
    if(onBody){ lookAt(d.hit.id); return; }
    /* Last, after the road and after the worlds: a tap on the ring a world
       travels on asks the clock to wait until that world gets there. It is
       the other half of a transfer — the road says where you will be, and
       until now nothing on the chart would tell you when anybody else would
       be anywhere. A rail runs through its own world, so the world has to
       win that tie or a planet could not be tapped at all. */
    /* Tied up as well as adrift. This used to be refused at a dock, because
       the loop dropped `warpTarget` the moment it saw a docked ship and a skip
       started there set the rate and then never stopped — the clock ran away
       at nine days a second on a promise of ten. That was a bug in the loop
       rather than a fact about harbours: waiting at a mooring for a world to
       come round is exactly what a pilot does at one. */
    /* Not while the lesson is running. Waiting for a world to come round is a
       real move and the chart offers it everywhere, but it is not the move any
       card is asking for, and a beginner who taps a ring while reading about
       their own orbit gets a confirmation about Grumm and a clock that runs
       off with them. It comes back the moment the lesson is done or waved off. */
    const rail = S.tutorialRunning(state) ? null : chart.nearestRailPoint(e.clientX, e.clientY, state.t);
    if(rail){ askSkip(rail.t, `${S.portName(rail.id)} reaching that point`); return; }
    selectedNode = -1; if(tab === 'ship') renderTab();
  }
  if(d.kind === 'node'){ tutorialCheck(); save(); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); chart.zoomBy(Math.pow(1.0015, -e.deltaY), [e.clientX, e.clientY]); noteLook('chartPanned'); }, { passive: false });
canvas.addEventListener('dblclick', e => { const hit = chart.hitTest(e.clientX, e.clientY); if(hit?.kind === 'body') lookAt(hit.id); });

/* A shortcut must never fire while somebody is typing into a control, and must
   never steal a browser's own combination. */
function typing(e){
  const t = e.target;
  if(!t) return false;
  if(t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable) return true;
  /* Space and Enter belong to whatever the keyboard is on. Taking Space for
     pause meant no button in the game could be pressed without a mouse. */
  return typeof t.closest === 'function' && !!t.closest('button, a[href], [role="button"], [tabindex]');
}
/* One arrow press, in screen pixels: a seventh of the short side of the chart,
   or a fortieth with shift held, so the same key is both a stride and a nudge. */
function panStep(e){ return Math.min(chart.width, chart.height) * (e.shiftKey ? 0.025 : 0.15); }
/* The keyboard's pan is a pan: the lesson's first card is passed by either. */
function keyPan(dx, dy){ chart.panBy(dx, dy); noteLook('chartPanned'); }
addEventListener('keydown', e => {
  if(typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  if($('modal').open) return;
  const fine = e.shiftKey ? 0.2 : 1;   // a fraction of one pull of an arrow
  switch(e.key){
    case ' ': e.preventDefault(); setPaused(!state.paused); break;
    case '+': case '=': chart.zoomBy(1.4); noteLook('chartPanned'); break;
    case '-': case '_': chart.zoomBy(1 / 1.4); noteLook('chartPanned'); break;
    case 'f': backToShip(); break;
    case 'v': if(S.canSeePast(state)) setFarSight(state.farSight === false); break;
    /* One key for both: it opens the ship, and at a port it steps on to the
       dock and then shuts, which is the whole cycle in one thumb. */
    case 'p': openMenu(state.dockedAt && panelOpen && panelMenu === 'ship' ? 'dock' : 'ship'); break;
    /* Escape takes down one thing: whatever was put up last. A conversation
       comes off before the panel it was started from, or pressing a face and
       changing your mind would shut the crew menu as well. */
    case 'Escape':
      if(gearOpen) openGear(false);
      else if(chatter){ dismissChatter(); renderTab(); }
      else if(selectedNode >= 0){ selectNode(-1); renderTab(); }
      else togglePanel(false);
      break;
    case 'Delete': case 'Backspace': if(state.nodes[selectedNode]){ S.removeNode(state, selectedNode); selectNode(-1); replan(true); renderTab(); } break;
    /* The arrows push the selected burn; with nothing selected they are the
       keyboard's pan, so the chart can be walked around without a pointer.
       Shift makes both of them fine. */
    case 'ArrowRight': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'pro', fine); else keyPan(-panStep(e), 0); break;
    case 'ArrowLeft': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'retro', fine); else keyPan(panStep(e), 0); break;
    case 'ArrowUp': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'out', fine); else keyPan(0, panStep(e)); break;
    case 'ArrowDown': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'in', fine); else keyPan(0, -panStep(e)); break;
  }
});

/* Planning is free, and it should not be a race: a burn that is open stops the
   clock, whether it is due in a minute or next spring. */
/* Closing the burn gives the clock back, but only if it was this that stopped
   it: a player who pressed space to stop time and then poked a mark should not
   have time start again when they put the mark away. */
function releasePlanHold(){
  if(!heldForPlan) return;
  heldForPlan = false;
  if(state.paused) setPaused(false);
}
/* Every way of opening a burn holds the clock; every way of closing one lets
   it go. Selection is the one thing that says which, so it goes through here. */
function selectNode(ix){
  const open = ix >= 0 && !!state.nodes[ix];
  selectedNode = open ? ix : -1;
  if(open) holdForPlanning(ix); else releasePlanHold();
}

function holdForPlanning(ix){
  const n = state.nodes[ix];
  if(!n || state.paused) return;
  /* The clock stops whenever a burn is open, not only when the burn is nearly
     due. The old rule held it inside twenty-five seconds and let it run
     otherwise, which is backwards: a mark months out is the one you are going
     to sit and nudge, and having the sky move under the arrows while you do it
     is the thing that made a careful pass into a chase.

     It used to say so in a toast every time. It did not need to: the Clock
     stat in the strip says "held" for as long as it is, which is the same
     news without a card over the sky every time a burn is opened and closed. */
  state.paused = true;
  heldForPlan = true;
  setRate(1);
}

/* Frame what the chart is drawing. The view is locked to the world the ship
   is going round, so the only thing left to choose is how much of that world
   fits, and the honest answer is "the road, and a little air around it". A
   parking orbit twenty pixels across inside the planet's own dot is not a
   road anybody can tap; neither is one that runs off all four sides. */
function primaryBody(){
  if(!state.dockedAt) return state.ship.body;
  const b = world.get(state.dockedAt);
  return b.mu > 0 ? state.dockedAt : b.parent;
}
/* How far the drawn road reaches from the body the chart is locked to. This
   is what the zoom is chosen from, so the framing follows the plan: push the
   far side of your orbit out past the moons and the chart pulls back to show
   you that you have. */
function roadSpan(){
  const primary = primaryBody();
  /* Measured from the ship, because that is where the chart is centred: a
     circular orbit seen from a point on it reaches twice its radius across,
     and framing it by the radius puts half the road off the screen. */
  const here = state.ship.body === primary ? state.ship.r : [0, 0];
  let span = 0;
  if(prediction){
    for(const seg of prediction.segments){
      if(seg.body !== primary) continue;
      for(const pt of seg.points) span = Math.max(span, Math.hypot(pt[0] - here[0], pt[1] - here[1]));
    }
  }
  if(span > 0) return span;
  const b = world.get(primary);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  return Number.isFinite(el.ra) ? el.ra * 2 : Math.max(norm(state.ship.r), b.soi ?? 0.01);
}
/* How much of the half-screen the road should fill when the chart frames it,
   and how far it is allowed to drift from that before the chart frames it
   again. The gap between them is the hysteresis: without it, every press of
   the burn pad would nudge the zoom and the sky would never sit still. */
const FRAME_FILL = 0.38, FRAME_SPILL = 0.5, FRAME_SHRINK = 0.16;
function usableHalf(){
  const w = chart.width - (panelOpen && innerWidth > 760 ? $('panel').getBoundingClientRect().width : 0);
  return Math.min(w, chart.height);
}
/* Take the main chart to the encounter the corner window is showing: centre
   on that world and pick a zoom that frames its reach. This is the one place
   the game chooses a scale without being asked for a fit, and it is because
   the player asked for it by tapping the thing. */
function lookAtEncounter(){
  const ic = prediction?.intercept;
  if(!ic) return;
  chart.focus(ic.body, null, false);
  chart.frameBody(ic.body);
  toast(`Looking at ${esc(S.nameFor(ic.body, S.unseen(state)))}. Press f for your ship.`);
}

/* Come home. Both halves matter: the lock goes back to the ship *and* the
   pan goes back to nothing, so one press undoes any amount of wandering. */
function backToShip(fit = false){
  chart.focus('ship', null, false);
  if(state.flags.lookedAtTarget) noteLook('lookedBack');
  if(fit) frameShipOrbit();
}
function frameShipOrbit(){
  const span = roadSpan();
  const half = usableHalf();
  if(span > 0 && half > 0) chart.camera.zoom = Math.max(8, Math.min(2e7, half * FRAME_FILL / span));
}

/* Tap a body and the chart centres on it; tap the ship, or press f, to come
   back. Nothing is selected and nothing is aimed at — looking is looking, and
   it never changes the zoom: moving the centre and changing the scale at the
   same time is how you lose track of where you were. The fit button is there
   for when you do want the scale chosen for you. Looking somewhere also ends
   any drag away from the last thing looked at: the new centre is the new
   thing, and the next pan is measured from it. */
function lookAt(id){
  chart.focus(id, null, false);
  if(id === FIRST_TARGET) noteLook('lookedAtTarget');
  toast(`Looking at ${esc(world.get(id).name)}. Press f for your ship.`);
}

/* ------------------------------------------------------------- panel */

/* Two menus, not one, and a button apiece in the chart controls. The ship
   goes where you go, so its button is always there; the port only exists
   while you are tied up at one, so its button arrives with the mooring lines
   and leaves with them. Both behind a single hamburger meant a row of six
   tabs where half of them stopped meaning anything the moment you cast off.

   The dock menu is the port: what the yard will fit, what the stalls have,
   who is looking for a ship, and who will talk to you. */
/* The ship menu reads the same tied up or adrift. It used to grow two more
   while flying — Orbit, which recited the low point, the high point and the
   lap of an orbit the chart was already drawing, and Burns, which listed marks
   you set and move on the chart and could not touch either. Two panels of
   numbers about a picture, beside the picture. The one thing in them worth
   keeping was what the road runs into next, and the distress call under it,
   and those are here, on the tab that is always open. */
const TABS_SHIP = [['ship', 'Ship'], ['quests', 'Quests'], ['crew', 'Crew']];
const TABS_DOCK = [['shipyard', 'Shipyard'], ['market', 'Trading'], ['requests', 'Requests'], ['talk', 'Talk']];
/* A wreck has no stall, no pump, no board and nobody to talk to, so it gets
   none of those four. What it has is what is aboard it. */
const TABS_WRECK = [['salvage', 'Salvage']];
/* And the end of the line gets one of its own. It is not a wreck and there is
   nothing aboard it to take: what is there is whatever happens next. */
const TABS_STATION = [['station', 'The Lantern']];
let panelMenu = 'ship';
/* Which face was last pressed, where the ship was when it was, and how far
   through that person's lines we have got. Deliberately not in the save: a
   conversation changes nothing, and a game that remembered them would have to
   version its saves every time somebody wrote another one. Cleared when the
   menu changes, and keyed on where the ship is tied up, so a line about Cinder
   never survives the trip to Moss.

   This is only the counter — what is actually on screen is `chatter`. */
let talking = null;

let lastTabsKey = null;
/* The Astrolabe is a tab because it is an instrument: it is not on the ship
   until it is bought, and then it is. Next to Ship, which is where the rest of
   what is fitted to the ship is listed. */
function tabsFor(){
  if(panelMenu === 'dock' && state.dockedAt){
    if(S.isWreck(state.dockedAt)) return TABS_WRECK;
    /* Anything else weightless is the station at the Dancer, which has no
       market, no yard, no board and nobody to talk to either. */
    if(S.isHulk(state.dockedAt)) return TABS_STATION;
    return TABS_DOCK;
  }
  if(!state.keys?.astrolabe) return TABS_SHIP;
  const out = [...TABS_SHIP];
  out.splice(1, 0, ['windows', 'Windows']);
  return out;
}
/* Open one of the two, or shut the panel if it is already showing that one. */
function openMenu(which){
  // One menu at a time: the gear stands down for the ship and the port.
  openGear(false);
  if(which === 'dock' && !state.dockedAt) which = 'ship';
  /* While a reward is sitting uncollected the ship button is flashing, and a
     button that flashes has made a promise about what pressing it does. It
     keeps the promise by opening the log rather than whichever tab you happened
     to leave open — and once the log is up it is an ordinary toggle again. */
  if(which === 'ship' && !onOwedLog() && S.unclaimedQuests(state).length){
    panelMenu = 'ship'; tab = 'quests';
    renderTabs(); setTab('quests');
    refreshMenuButtons();
    return;
  }
  if(panelOpen && panelMenu === which){ togglePanel(false); return; }
  panelMenu = which;
  renderTabs();
  togglePanel(true);
  refreshMenuButtons();
}
function refreshMenuButtons(){
  $('m-dock').hidden = !state.dockedAt;
  $('m-ship').setAttribute('aria-pressed', String(panelOpen && panelMenu === 'ship'));
  $('m-dock').setAttribute('aria-pressed', String(panelOpen && panelMenu === 'dock'));
  refreshOwedFlash();
}
/* The log is already on screen: the flash has nothing left to point at. */
function onOwedLog(){ return panelOpen && panelMenu === 'ship' && tab === 'quests'; }
/* Called every frame, because a job can finish mid-coast with no menu open and
   nothing else on the page to notice it. The button's own class is the record
   of what was last drawn, so a steady state writes nothing. */
function refreshOwedFlash(){
  const btn = $('m-ship');
  const owed = !onOwedLog() && S.unclaimedQuests(state).length > 0;
  if(owed !== btn.classList.contains('owed')) btn.classList.toggle('owed', owed);
}
function renderTabs(){
  // Casting off takes the port menu with it; there is nothing left in it.
  if(panelMenu === 'dock' && !state.dockedAt) panelMenu = 'ship';
  const tabs = tabsFor();
  const key = panelMenu + (state.dockedAt ? ':docked' : ':flight') + (state.keys?.astrolabe ? ':astro' : '');
  if(key === lastTabsKey){ refreshMenuButtons(); return; }
  lastTabsKey = key;
  const bar = $('tabs'); bar.innerHTML = '';
  for(const [id, label] of tabs){
    const b = document.createElement('button');
    b.className = 'tab'; b.role = 'tab'; b.dataset.tab = id; b.textContent = label;
    b.addEventListener('click', () => setTab(id));
    bar.appendChild(b);
  }
  if(!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  setTab(tab, panelOpen);
  refreshMenuButtons();
}
function setTab(id, open = true){
  /* A change of menu starts the next conversation from the top. Whatever is
     already being said carries on: the bubbles are over the sky rather than in
     the panel, and cutting somebody off because you pressed Ship would be a
     worse answer than letting them finish. */
  if(id !== tab) talking = null;
  tab = id;
  [...$('tabs').children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  if(open && !panelOpen) togglePanel(true);
  renderTab();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sp = species => `<span class="sp-${species}">${esc(SPECIES[species]?.name ?? species)}</span>`;

function renderTab(){
  const body = $('tabbody');
  /* Rebuilding the panel throws away the button the player is standing on, and
     the keyboard then lands back on the document. Remember which control it
     was and put it back. */
  const active = document.activeElement;
  const was = body.contains(active) ? (active.dataset?.act ?? active.id ?? null) : null;
  const fn = { market, shipyard: shipyardTab, requests: requestsTab, talk, quests: questsTab, crew: crewTab, ship: shipTab, windows: astrolabeTab, salvage: salvageTab, station: stationTab }[tab];
  body.innerHTML = fn ? fn() : '';
  wire(body);
  if(was){
    const again = body.querySelector(`[data-act="${CSS.escape(was)}"]`) ?? body.querySelector(`#${CSS.escape(was)}`);
    if(again && typeof again.focus === 'function') again.focus();
  }
}
function wire(root){
  root.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', ev => {
      // A card is itself an action, and so are the buttons inside it. Only the
      // innermost one should run: deleting a burn used to re-select the burn
      // that had just stopped existing.
      if(ev.target.closest('[data-act]') !== el) return;
      const [act, ...args] = el.dataset.act.split('|');
      actions[act]?.(...args, el);
    });
  });
  root.querySelectorAll('select[data-sel]').forEach(el => {
    el.addEventListener('change', () => actions[el.dataset.sel]?.(el.value));
  });
}

const trend = (price, base) => price > base * 1.12 ? '<span class="up">▲</span>' : price < base * 0.88 ? '<span class="down">▼</span>' : '<span class="flat">•</span>';
/* What this stall pays, said the way a trader says it rather than as a number:
   who wants it, and whether the crate has left the region it was made in,
   which between them are the whole of what it is worth. "They love it, a long
   way from home" is a thing somebody can act on; ×5.5 is a sum. */
/* The little "i" beside a good. Hovering it gives what the thing is; pressing
   it opens the appraisal, which is the same line plus who pays for it once
   there is somebody aboard who can say. */
const inspect = gid => {
  const g = S.goodById(gid);
  return ` <button class="inspect" data-act="look|${gid}" title="${esc(g.nature ?? '')}" aria-label="What is ${esc(g.name)}?">i</button>`;
};

const demand = (port, good) => {
  const words = S.demandWords(port, good);
  const far = S.demandMul(port, good) >= S.FORMULAS.demand.likedAway;
  const cls = far || words === 'they love it' ? 'up' : words === 'nobody here wants it' ? 'down' : '';
  return ` · <span class="${cls}">${words}</span>${far ? ' · <span class="up">a long way from home</span>' : ''}`;
};

function market(){
  const port = state.dockedAt;
  const p = PORTS[port];
  if(!S.portOpen(port, state.t)){
    const days = S.daysToPeriapsis(port, state.t);
    return `<h2>${esc(S.portName(port))}</h2><p>The market here keeps hours, and it is shut. It opens again in ${S.fmtDays(days)}.</p>`;
  }
  const lines = TEXT.ports[port]?.trade ?? [];
  const say = lines.length ? `<p class="say">${esc(lines[Math.floor(S.hash(port, Math.floor(state.t / 3)) * lines.length)])}</p>` : '';
  let out = `<h2>${esc(S.portName(port))} <small class="lock">${sp(p.species)}</small></h2>${say}`;
  const nobody = p.species === 'builders' || p.species === 'none';
  out += nobody ? '<h3>To be taken</h3>' : '<h3>For sale</h3>';
  const sells = p.sells.map(s => s.good);
  if(!sells.length) out += nobody ? '<p class="empty">Nothing here but the quiet.</p>' : '<p class="empty">Nothing for sale here.</p>';
  for(const gid of sells){
    const g = S.goodById(gid);
    const price = S.buyPrice(state, port, gid);
    const stock = S.stockAvailable(state, port, gid);
    const c1 = S.canBuy(state, gid, 1);
    const lock = g.needsTempControl && !state.keys.tempControl ? '<span class="lock">needs temperature control</span>' : '';
    /* How many you could actually take. It has to start from canBuy rather
       than from the arithmetic: a good that needs a held temperature and no way to hold one priced out
       the +1 button and left +10 and "all" lit, which is a button that exists
       to tell you no. If one is impossible, ten is impossible. */
    const maxQ = c1.ok ? Math.min(stock, Math.floor(state.money / price), Math.floor(S.freeUnits(state) / g.units)) : 0;
    /* Shelves do not refill on a clock any more: a merchant finds more while
       you are away, so the only way to see a full stall again is to have gone
       and traded somewhere else. */
    const restock = stock === 0 ? ' · <span class="down">picked clean; they will have found more once you have been elsewhere</span>' : '';
    out += `<div class="row"><div class="name"><b>${esc(g.name)}${inspect(gid)}</b><small>${esc(g.blurb ?? g.category)} · ${stock} in stock${restock} · ${g.units} unit${g.units > 1 ? 's' : ''} each ${lock}</small></div>
      <div class="price">${S.fmtMoney(price)}<small>${trend(price, g.basePrice)} base ${S.fmtMoney(g.basePrice)}</small></div>
      <div class="btns"><button class="btn sm" data-act="buy|${gid}|1" ${c1.ok ? '' : 'disabled title="' + esc(c1.reason) + '"'}>+1</button><button class="btn sm" data-act="buy|${gid}|10" ${maxQ >= 10 ? '' : 'disabled'}>+10</button><button class="btn sm" data-act="buy|${gid}|${maxQ}" ${maxQ > 1 ? '' : 'disabled'}>all</button></div></div>`;
  }
  out += '<h3>Aboard</h3>';
  const aboard = new Map();
  /* Only your own crates. A consignment is in the hold but it is not stock:
     it cannot be sold, so a row with a Sell button on it would be a lie. The
     Ship tab lists it, which is where a pilot looks to see what is aboard. */
  for(const c of state.cargo){
    if(c.questId != null) continue;
    const e = aboard.get(c.good) ?? { qty: 0, paid: 0 }; e.qty += c.qty; e.paid += c.price * c.qty; aboard.set(c.good, e);
  }
  if(!aboard.size) out += '<p class="empty">The hold is empty.</p>';
  for(const [gid, e] of aboard){
    const g = S.goodById(gid);
    const price = S.sellPrice(state, port, gid);
    const cold = g.needsTempControl ? ' · <span class="up">temperature control pays</span>' : '';
    const avg = e.paid / e.qty;
    out += `<div class="row"><div class="name"><b>${esc(g.name)}${inspect(gid)}</b><small>${e.qty} aboard · paid ${S.fmtMoney(avg)} each${demand(port, gid)}${cold}</small></div>
      <div class="price">${S.fmtMoney(price)}<small>${price > avg ? '<span class="up">' : '<span class="down">'}${price >= avg ? '+' : ''}${S.fmtMoney(price - avg)}</span></small></div>
      <div class="btns"><button class="btn sm" data-act="sell|${gid}|1">−1</button><button class="btn sm" data-act="sell|${gid}|10" ${e.qty >= 10 ? '' : 'disabled'}>−10</button><button class="btn sm primary" data-act="sell|${gid}|${e.qty}">all</button></div></div>`;
  }
  /* What to bring back here, worth most first, because that is the question a
     trader is actually asking the board. The ones they love are called out:
     those are the routes, and a player should be able to see one from the
     stall rather than work it out with a notebook.

     What a stall will *pay*, though, is the appraiser's to say. Until Wicket
     is aboard these are two lists of names — this port wants that, and wants
     it badly — and a captain has to find out what badly is worth by carrying
     some and seeing. She puts the numbers on them. */
  const priced = !!state.crew?.appraiser;
  const shopping = p.buys.map(b => S.goodById(b.good)).filter(g => !aboard.has(g.id))
    .map(g => ({ g, price: S.sellPrice(state, port, g.id), loved: S.lovesGood(port, g.id) }))
    .sort((a, b) => b.price - a.price);
  const listed = (r, cls) => esc(r.g.name) + (priced ? ` <span class="${cls}">${S.fmtMoney(r.price)}</span>` : '');
  const loves = shopping.filter(r => r.loved);
  if(loves.length){
    out += '<h3>They love</h3><p>' + loves.map(r => listed(r, 'up')).join(' · ') + '</p>';
  }
  const rest = shopping.filter(r => !r.loved);
  if(rest.length){
    out += '<h3>They want</h3><p>' + rest.map(r => listed(r, 'lock')).join(' · ') + '</p>';
  }
  if(!priced) out += '<p class="lock">No appraiser aboard, so these are worth whatever they turn out to be worth. Sign one on and you will see the price before you sell.</p>';
  return out;
}

/* The dock: everything a port does for you, and nothing that follows you out
   of it. Fuel, what the yard will fit, the clock, and the way back off. What
   is bolted to your ship is on the Ship tab, which you can read anywhere —
   this used to list it too, so the only place you could see your own tank was
   somewhere you happened to be moored. */
function shipyardTab(){
  const port = state.dockedAt;
  const p = PORTS[port];
  let out = `<h2>${esc(S.portName(port))} <small class="lock">${p.shipyard ? 'shipyard' : 'dock'}</small></h2>`;
  out += '<h3>Fuel</h3>';
  const fp = S.fuelPrice(state);
  const room = S.kms(S.usableTank(state) - state.dv);
  if(fp == null) out += '<p class="empty">No fuel sold here.</p>';
  else{
    out += `<p>${S.fmtMoney(fp)} per km/s · ${room.toFixed(1)} km/s of room.</p><div class="btns">
      <button class="btn" data-act="fuel|1" ${room >= 0.05 && state.money >= fp ? '' : 'disabled'}>+1 km/s</button>
      <button class="btn" data-act="fuel|5" ${room >= 0.05 && state.money >= fp ? '' : 'disabled'}>+5 km/s</button>
      <button class="btn primary" data-act="fuel|999" ${room >= 0.05 && state.money >= fp ? '' : 'disabled'}>Fill (${S.fmtMoney(Math.min(room, state.money / fp) * fp)})</button></div>`;
  }
  const ups = S.upgradesFor(port);
  /* The repair bay. It only exists when there is something to repair, so a
     sound ship never reads a row telling it that it is sound. Neither repair
     is compulsory and neither blocks undocking: a battered ship that cannot
     pay must still be able to leave and go and earn it. */
  const hull = S.hullLevel(state), cell = S.hasFuelCellFault(state);
  if(hull > 0 || cell){
    out += '<h3>Repairs</h3>';
    if(hull > 0){
      const c = S.canRepair(state, 'hull'), cost = S.repairCost(state, 'hull');
      out += `<div class="row"><div class="name"><b>${esc(S.hullWord(state))}</b><small>The frame wants straightening before it wants anything else.</small></div>
        <div class="price">${S.fmtMoney(cost)}</div>
        <div class="btns"><button class="btn sm primary" data-act="repair|hull" ${c.ok ? '' : 'disabled title="' + esc(c.reason) + '"'}>Mend</button></div></div>`;
    }
    if(cell){
      const c = S.canRepair(state, 'fuelCell'), cost = S.repairCost(state, 'fuelCell');
      out += `<div class="row"><div class="name"><b>Burnt fuel cell</b><small>The tank fills to ${Math.round(S.FUEL_CELL_CAP * 100)}% and stops. A new cell is a morning's work.</small></div>
        <div class="price">${S.fmtMoney(cost)}</div>
        <div class="btns"><button class="btn sm primary" data-act="repair|fuelCell" ${c.ok ? '' : 'disabled title="' + esc(c.reason) + '"'}>Replace</button></div></div>`;
    }
  }
  out += '<h3>On offer</h3>';
  if(!ups.length) out += `<p class="empty">${p.shipyard ? 'Nothing on the rack today.' : 'Nobody fits anything here.'}</p>`;
  for(const u of ups){
    const c = S.canBuyUpgrade(state, u.id);
    const owned = S.ownsUpgrade(state, u);
    /* Three of the keys are sold and wired to nothing yet. Saying so on the
       row is the difference between a promise and a swindle. */
    const soon = u.pending ? '<small class="lock">not fitted to anything yet</small>' : '';
    out += `<div class="row"><div class="name"><b>${esc(u.name)}</b><small>${esc(u.effect)}${u.unlocks ? ' · ' + esc(u.unlocks) : ''}</small>${soon}</div><div class="price">${owned ? '<span class="lock">fitted</span>' : S.fmtMoney(c.price ?? u.price)}</div>
      <div class="btns">${owned ? '' : `<button class="btn sm primary" data-act="upgrade|${u.id}" ${c.ok ? '' : 'disabled title="' + esc(c.reason) + '"'}>Fit</button>`}</div></div>`;
    if(!owned && !c.ok && c.reason !== 'Not enough coin.') out += `<p class="lock">${esc(c.reason)}</p>`;
  }
  out += '<h3>Wait here</h3><div class="btns"><button class="btn" data-act="wait|1">1 day</button><button class="btn" data-act="wait|10">10 days</button><button class="btn" data-act="wait|30">30 days</button></div>';
  out += `<button class="btn primary wide" data-act="undock">Undock</button>`;
  /* Being stuck at a dock is still being stuck: a ship with a dry tank at a
     port that sells no fuel needs the same rope as one adrift. */
  if(fp == null || state.dv <= 1e-9){
    out += `<p class="lock">${fp == null ? 'Nothing to burn is sold here.' : 'The tank is dry.'}</p><button class="btn wide" data-act="tow">Call for a tow</button>`;
  }
  return out;
}

function talk(){
  const port = state.dockedAt;
  const p = PORTS[port];
  const txt = TEXT.ports[port] ?? {};
  const b = world.get(port);
  const k = Math.floor(S.hash(port, Math.floor(state.t / 7)) * 3);
  let out = `<h2>${esc(b.name)} <small class="lock">${sp(p.species)}</small></h2>`;
  out += `<p>${esc(txt.blurb ?? '')}</p>`;
  if(txt.arrival) out += `<p class="say">${esc(txt.arrival[k % txt.arrival.length])}</p>`;
  if(TEXT.species[p.species]?.greeting) out += `<p>${esc(TEXT.species[p.species].greeting)}</p>`;
  if(txt.rumours) out += `<h3>Heard at the dock</h3>` + txt.rumours.map((r, i) => `<p>${i === k % txt.rumours.length ? '<b>' : ''}${esc(r)}${i === k % txt.rumours.length ? '</b>' : ''}</p>`).join('');
  out += '<h3>How they know you</h3><dl class="kv">' + Object.entries(state.rep).map(([s, v]) => `<dt>${sp(s)}</dt><dd>${repWord(v)}</dd>`).join('') + '</dl>';
  /* Where the rest of the sky is from here, in the plainest terms a dock has:
     how far away it is today, and which way from the Lamp that is. */
  out += '<h3>The sky</h3>';
  const from = absState(world, port, state.t).r;
  for(const id of ['cinder', 'veyra', 'nail', 'arc', 'grumm', 'maw']){
    if(id === port) continue;
    const there = absState(world, id, state.t).r;
    out += `<p>${esc(S.portName(id))} is ${fmtAu(dist(from, there))} away, ${norm(there).toFixed(2)} au from the Lamp.</p>`;
  }
  out += `<h3>Glossary</h3>` + GLOSSARY.slice(0, 16).map(g => `<p><b>${esc(g.term)}</b> <span class="lock">(${esc(g.plain)})</span> — ${esc(g.tip)}</p>`).join('');
  return out;
}
function repWord(v){ return v >= 8 ? 'old friends' : v >= 4 ? 'a known name' : v >= 1.5 ? 'a familiar face' : v <= -2 ? 'unwelcome' : v < 0 ? 'a story going round' : 'a stranger'; }

/* ------------------------------------------------------ editing a burn */

/* One nudge along one of the four axes — the chart's arrows and the keyboard
   both come through here. `scale` lets the keyboard ask for a smaller one
   (Shift) without inventing a second set of numbers. */
function pushAxis(i, k, scale = 1){
  const n = state.nodes[i];
  const a = AXES[k];
  if(!n || !a) return;
  n[a.axis] += a.sign * scale * S.auDay(stepFor(i) / 1000);
  replan(true);
  if(tab === 'ship') renderTab();
  tutorialCheck();
  save();
}

/* Hold an arrow down and it repeats, slowly at first so a single tap is never
   two, then faster, because pushing a big orbit around takes more than four
   presses and nobody should have to tap forty times. */
let repeat = null;
function stopRepeat(){ if(repeat){ clearTimeout(repeat.timer); repeat = null; } }
function startRepeat(i, axis){
  stopRepeat();
  let n = 0;
  const tick = () => {
    n++;
    pushAxis(i, axis, n > 12 ? 4 : n > 5 ? 2 : 1);
    repeat.timer = setTimeout(tick, n < 3 ? 260 : 90);
  };
  repeat = { timer: setTimeout(tick, 340) };
}
for(const ev of ['pointerup', 'pointercancel', 'blur']) document.addEventListener(ev, stopRepeat, true);


/* Four buttons and two axes, and that is the whole of flying this ship.
 *
 *   forward / back   along the way you are already going: raises or lowers
 *                    the far side of the orbit
 *   out / in         across it: swings the orbit round without changing its
 *                    size much
 *
 * No typing, no units to choose, no handle to drag to the right number. One
 * press is one step, and the step is sized to the orbit you are on, so the
 * same press means "a small change" whether you are creeping round a moon at
 * two hundred metres a second or falling past the Lamp at thirty kilometres
 * a second. Hold a button and it repeats, and then it hurries.
 */
const AXES = {
  pro:  { axis: 'prograde', sign:  1, key: 'pro',  label: 'Forward', hint: 'lifts the high point' },
  retro:{ axis: 'prograde', sign: -1, key: 'retro',label: 'Back',    hint: 'drops the high point' },
  out:  { axis: 'radial',   sign:  1, key: 'out',  label: 'Out',     hint: 'swings it outward' },
  in:   { axis: 'radial',   sign: -1, key: 'in',   label: 'In',      hint: 'swings it inward' },
};

/* A press should be worth something on any orbit and never enormous on any
   orbit, so it is a fixed fraction of how fast you are actually going at the
   mark, rounded to a number a person would say out loud. */
function stepFor(i){
  const where = nodePositions[i];
  // Which speed, and so which fraction of it — see `burnScaleAt`.
  const f = S.burnScaleAt(state, where, state.nodes[i]?.t ?? state.t);
  const ms = S.kms(f.speed) * 1000 * (f.relative ? S.BURN_STEP_REL : S.BURN_STEP);
  const pow = Math.pow(10, Math.floor(Math.log10(Math.max(1, ms))));
  const nice = [1, 2, 5, 10].map(m => m * pow).find(x => x >= ms) ?? 10 * pow;
  return Math.max(1, Math.min(500, nice));
}

/* The last resort, which has to live somewhere a stranded pilot can find it:
 * an empty tank is the one hole a tow cannot always dig you out of, because a
 * tow has a price and a purse can be empty. The distress call is the floor
 * under that — half of whatever you have, and the dock you last tied up at
 * comes and gets you. */
function strandedBlock(){
  let out = '';
  if(state.dv <= 1e-9){
    const d = S.distressQuote(state);
    out += `<h3>Dry tank</h3><p>${esc(TEXT.captainLines.onStranded[2] ?? '')}</p>`;
    if(d){
      out += `<p>${d.home ? `A call to ${esc(S.portName(d.port))}, where you last tied up` : `Nobody is left at your last mooring who could fetch you; ${esc(S.portName(d.port))} would come instead`}. They ask half of everything: ${S.fmtMoney(d.cost)}.</p>`
        + `<button class="btn wide danger" data-act="distress">Send a distress call</button>`;
    }
    const q = S.towQuote(state);
    out += `<p class="lock" style="margin-top:.8rem">Or a tow to ${esc(S.portName(q.port))}: ${S.fmtMoney(q.cost)}, ${S.fmtDays(q.days)}. <button class="btn sm" data-act="tow">Call for a tow</button></p>`;
  }else{
    out += `<p class="lock" style="margin-top:1rem">Stuck anywhere? <button class="btn sm" data-act="tow">Call for a tow</button></p>`;
  }
  return out;
}

/* What the drawn road runs into, in the order it runs into it: the doors it
 * goes through and the nearest it passes whatever it meets on the way. */
function aheadList(){
  if(!prediction) return '';
  const skip = t => `<button class="btn sm" data-act="skipto|${t}">Skip to it</button>`;
  const lines = [];
  /* Before anything ahead: the harbour you are inside this second, and what it
     is still waiting for. A rendezvous has no gravity to finish the job — you
     are not captured, you are merely nearby — so a ship can sit in the middle
     of Whisker's mouth at five kilometres a second with nothing on this panel
     mentioning Whisker at all. The corner of the HUD said "4.55 km/s too fast"
     in grey, and the reasonable thing to conclude from the rest of the screen
     was that the place was broken. */
  const now = state.dockedAt ? null : S.dockingStatus(state);
  if(now && now.kind === 'zone' && now.inZone && !now.ok){
    const pb = world.get(now.port);
    lines.push({ t: -Infinity, html: `<p class="down"><b>${esc(pb.name)} is right here</b>, and there is nothing to fall into: `
      + `${fmtAu(now.distance)} off and closing at ${S.fmtKms(now.relSpeed)}. `
      + `Match its speed to ${S.fmtKms(now.dockSpeed)} or under and it will take you.</p>` });
  }else if(now && now.ok){
    lines.push({ t: -Infinity, html: `<p class="up"><b>${esc(S.nameFor(now.port, S.unseen(state)))} will take you now.</b> Press the anchor, or <kbd>d</kbd>.</p>` });
  }
  /* Whatever the road runs into keeps its numbers and loses its name where the
     player has not found it yet: the Maw is a door and a pass and a crossing
     like anywhere else, called ??? until the sensors say otherwise. */
  const unknown = S.unseen(state);
  for(const e of prediction.events){
    if(e.kind === 'soi'){
      const to = world.get(e.to), from = world.get(e.from);
      lines.push({ t: e.t, html: `<p>${to.parent === from.id ? 'Into' : 'Out to'} ${esc(S.nameFor(e.to, unknown))}'s gravity in ${S.fmtDays(e.t - state.t)}. ${skip(e.t)}</p>` });
    }else if(e.kind === 'burn' && e.node.aero){
      lines.push({ t: e.t, html: `<p class="up">Air brake at ${esc(S.portName(e.node.body))}: shed ${S.fmtKms(e.magnitude)} in ${S.fmtDays(e.t - state.t)}. ${skip(e.t)}</p>` });
    }else if(e.kind === 'crash'){
      lines.push({ t: e.t, html: `<p class="down">This path strikes ${esc(S.nameFor(e.body, unknown))} in ${S.fmtDays(e.t - state.t)}.</p>` });
    }
  }
  /* Every reach the road passes through, in the order they happen — falling
     into Grumm and going on to one of its moons is two, and both are things
     that happen to this ship before the road runs out.
     Two numbers, not one, because at a place with no gravity worth the name
     they are both the job: being inside the mouth of a rock you cannot fall
     into is no use whatever at five kilometres a second, and a line that says
     "inside docking range" and stops there sends a pilot 146 days down a road
     to find that out on arrival. */
  for(const ic of prediction.intercepts ?? []){
    const b = world.get(ic.body);
    const fast = ic.inMouth && b.rendezvous && ic.speed > b.dockSpeed;
    const verdict = !ic.inMouth ? ''
      : fast ? ` Inside the mouth, but ${S.fmtKms(ic.speed)} is too fast to tie up: match it to ${S.fmtKms(b.dockSpeed)} or under.`
      : ' That is inside docking range.';
    const what = esc(S.nameFor(ic.body, unknown));
    lines.push({ t: ic.t, html: ic.grazes
      ? `<p class="down">This path hits ${what} in ${S.fmtDays(ic.t - state.t)}.</p>`
      : `<p class="${fast ? 'down' : ic.inMouth ? 'up' : ''}">Closest approach to ${what}: ${fmtAu(ic.altitude)} at ${S.fmtKms(ic.speed)}, in ${S.fmtDays(ic.t - state.t)}.${verdict} ${skip(ic.t)}</p>` });
  }
  lines.sort((a, b) => a.t - b.t);
  return '<h3>Ahead</h3>' + (lines.length
    ? lines.map(l => l.html).join('')
    : '<p class="lock">Nothing changes before this orbit comes round again.</p>');
}

/* The ship: where it is going, what is bolted to it, what is in the hold, and
   what it has done. Readable tied up or adrift, because none of it stops being
   true when you throw a line.

   Ahead comes first while flying, above everything the ship is made of,
   because it is the only thing in here the chart cannot say better. It matters
   most at the places with no gravity to speak of — Nail, Whisker, the Maw.
   There is nothing to fall into at one of those, so arriving is a matter of
   being in the same place at the same speed, and the line that says how close
   this road comes and how fast it is going past is the whole instrument. */
function shipTab(){
  const flying = !state.dockedAt;
  let out = `<h2>${esc(state.shipName)}</h2>`;
  out += `<p class="lock">${flying ? `In ${esc(world.get(state.ship.body).name)}'s gravity` : `Tied up at ${esc(S.portName(state.dockedAt))}`}</p>`;
  if(flying) out += aheadList();

  out += '<h3>Fitted</h3>';
  const t = state.tiers;
  /* The fitted list reads the rack rather than naming the keys itself, so a
     new one appears here the moment it exists in the tables. */
  const fittedKeys = UPGRADES.filter(u => u.kind === 'key' && state.keys[u.key]);
  out += `<dl class="kv"><dt>Tank</dt><dd>${esc(S.tiers('tank')[t.tank].name)} · ${S.fmtKms(state.dv)} of ${S.fmtKms(S.usableTank(state))}</dd>
    <dt>Hold</dt><dd>${esc(S.tiers('hold')[t.hold].name)} · ${S.usedUnits(state)} of ${S.holdUnits(state)} units</dd>
    <dt>Systems</dt><dd>${fittedKeys.map(u => esc(u.name)).join(', ') || '<span class="lock">nothing yet</span>'}</dd></dl>`;

  out += '<h3>Hold</h3>';
  if(!state.cargo.length) out += '<p class="empty">Empty.</p>';
  for(const c of state.cargo){
    const g = S.goodById(c.good);
    const forWhom = c.questId != null ? ` · <span class="up">for ${esc(S.questById(c.questId)?.title ?? 'a job')}</span>` : '';
    out += `<p>${c.qty} × ${esc(g.name)} <span class="lock">from ${esc(S.portName(c.from))} · paid ${S.fmtMoney(c.price)} each</span>${forWhom}</p>`;
  }

  /* Not cargo and not a fitting, so neither list will have them: a relic
     weighs nothing, cannot be sold, and nothing in the game takes one back.
     Silent until the first one is in the bag, because a heading that says
     "none yet" is a spoiler with a shrug on it. */
  const relics = S.heldRelics(state);
  if(relics.length){
    out += `<h3>Carried</h3>`;
    for(const r of relics){
      out += `<div class="row"><div class="name"><b>${esc(r.name)}</b><small>${esc(r.blurb ?? '')}</small></div></div>`;
    }
    if(relics.length < S.RELICS.length) out += `<p class="lock">${relics.length} of ${S.RELICS.length}.</p>`;
  }

  out += '<h3>Record</h3>';
  out += `<p>${state.stats.docks} docking${state.stats.docks === 1 ? '' : 's'} · ${S.fmtKms(state.stats.dvSpent)} burned in ${state.stats.burns} burn${state.stats.burns === 1 ? '' : 's'} · farthest ${fmtAu(state.stats.farthest)} from the Lamp.</p>`;
  if(state.debt > 0) out += `<p class="down">${S.fmtMoney(state.debt)} owed to the harbour bank.</p>`;
  if(flying){
    const line = TEXT.captainLines.onLongCoast[Math.floor(S.hash(Math.floor(state.t / 20)) * TEXT.captainLines.onLongCoast.length)];
    out += `<p class="say">${esc(line)}</p>`;
  }
  if(flying) out += strandedBlock();
  /* Which of the three this is, and the two ways a game leaves the browser it
     was played in. The title screen has the same pair; both go through sim.js
     so there is one idea of what a save is. */
  out += `<h3>This game</h3><p class="lock">Saved in slot ${SLOT}. It saves itself as you play.</p>`;
  out += `<div class="btns"><button class="btn sm" data-act="exportsave">Copy this game out</button><button class="btn sm" data-act="importsave">Paste a game in</button></div>`;
  out += `<div class="btns"><button class="btn sm danger" data-act="newgame">New game</button><a class="btn sm" href="./">&larr; Title screen</a></div>`;
  return out;
}

/* Who is aboard. The captain, and three berths. An empty one says only that
   it is empty and which job it is: naming the people who do that work, and
   where you would have to go to ask, was the whole of it explained before
   anybody had been anywhere. The mystery is the point.

   Everybody who is actually aboard has a face you can press, which is the
   other half of this menu — see `playChatter` and dialog.json. */
/* A portrait you can press, for somebody who is actually aboard. An empty
   berth keeps the plain picture: there is nobody in it to answer. What comes
   back is a popup over the sky rather than a block under the picture — see
   `#chatter` and `playChatter`. */
function face(who, name){
  const url = portraitURL(who);
  return `<button class="face" data-act="say|${who}" aria-expanded="${chatter?.who === who}"`
    + ` title="Ask ${esc(name)} what they make of it"`
    + ` aria-label="What does ${esc(name)} have to say?">`
    + `<img src="${url}" alt="" width="24" height="24"></button>`;
}

function crewTab(){
  const c = TEXT.crew;
  let out = '<h2>Crew</h2>';
  out += '<div class="crew">'
    + face('captain', c.captain.name)
    + `<div class="who"><b>${esc(c.captain.name)}</b><small>${esc(c.captain.role)} · ${sp(c.captain.species)}</small>`
    + `<p class="say">${esc(c.captain.line)}</p></div></div>`;
  out += `<p class="lock">${esc(state.shipName)} · ${state.stats.docks} docking${state.stats.docks === 1 ? '' : 's'} · ${S.fmtKms(state.stats.dvSpent)} burned</p>`;
  out += '<h3>Berths</h3>';
  for(const r of c.roles ?? []){
    const aboard = state.crew?.[r.id] ?? null;
    const name = r.person?.name ?? r.name;
    out += aboard
      ? `<div class="crew">${face(r.id, name)}`
        + `<div class="who"><b>${esc(name)}</b><small>${esc(r.name)} · ${sp(r.species)}</small>`
        + `<p class="say">${esc(r.person?.line ?? r.does)}</p></div></div>`
      : `<div class="crew open"><img src="${portraitURL('berth')}" alt="" width="24" height="24">`
        + `<div class="who"><b>Missing ${esc(r.name)}</b></div></div>`;
  }
  return out;
}

/* Tied up to a wreck. The one stop in the game with nobody in it, so the menu
   is not four empty rooms pretending otherwise: it is what is aboard, whose job
   it is, and whether it has come across yet.

   A wreck with no job attached is a thing you found by flying into it, which is
   allowed and says so. */
function salvageTab(){
  const id = state.dockedAt;
  const b = world.get(id);
  let out = `<h2>${esc(b.name)}</h2>`;
  const mine = (state.quests ?? [])
    .map(l => ({ live: l, q: S.questById(l.id) }))
    .filter(x => x.q?.wreck === id);

  if(!mine.length){
    return out + '<p class="say">Nothing aboard is yours, and nobody asked you to come. '
      + 'You are tied to a hull that has been going round this path a long time, and it will go on going round it.</p>'
      + '<p class="lock">A salvor somewhere is holding the paperwork for this one.</p>';
  }

  for(const { live, q } of mine){
    const steps = S.questSteps(q);
    const recovered = live.step > 0;
    const load = S.salvageLoad(q);
    const short = load - S.freeUnits(state);
    out += `<p class="say">${esc(q.aboard ?? '')}</p>`;
    out += '<h3>The haul</h3>';
    for(const g of q.goods ?? []){
      const good = S.goodById(g.good);
      out += `<div class="row"><div class="name"><b>${g.qty} × ${esc(good?.name ?? g.good)}</b>`
        + `<small>${esc(good?.blurb ?? good?.category ?? '')}</small></div>`
        + `<div class="price">${recovered ? '<span class="up">aboard</span>' : `${(good?.units ?? 1) * g.qty} unit${(good?.units ?? 1) * g.qty === 1 ? '' : 's'}`}</div></div>`;
    }
    out += recovered
      ? `<p class="lock">Off her and into your hold. ${esc(steps[steps.length - 1]?.text ?? '')}.</p>`
      : short > 0
        ? `<p class="down">No room for it: ${short} unit${short === 1 ? '' : 's'} short. Sell something or put something down, and it comes across — she is not going anywhere.</p>`
        : '<p class="lock">Coming across now.</p>';
  }
  return out;
}

/* Tied up to the thing at the end of the line. Nothing to trade, nothing to
   salvage and nobody aboard: what is here is what the last job says happens,
   and the three things it took to be allowed to read it. */
function stationTab(){
  const id = state.dockedAt;
  const b = world.get(id);
  const q = S.QUESTS.find(x => x.ends && x.to === id);
  const live = (state.quests ?? []).find(l => l.id === q?.id);
  let out = `<h2>${esc(b.name)}</h2>`;
  if(q && live?.step >= S.questSteps(q).length){
    out += `<p class="say">${esc(q.done)}</p>`;
  }else{
    out += '<p class="say">Lit, keeping station, and not answering. Your lines are across and something on the other end has taken them.</p>';
  }
  const relics = S.heldRelics(state);
  if(relics.length){
    out += '<h3>What you brought</h3>';
    for(const r of relics) out += `<div class="row"><div class="name"><b>${esc(r.name)}</b><small>${esc(r.blurb ?? '')}</small></div></div>`;
  }
  return out;
}

/* The board. Fourteen quests have been written and flyable for a while with
   nowhere to press; this is the somewhere. A job says who is asking, what it
   is, and what it pays, and the Take button carries the rules: three at once,
   and a delivery needs the hold room (and the cold hold) before anybody will
   hand it to you. */
function requestsTab(){
  const port = state.dockedAt;
  const open = S.questsAt(state, port);
  let out = `<h2>Looking for a ship</h2>`;
  if(!open.length) return out + '<p class="empty">Nobody here needs anything carrying.</p>';
  out += `<p class="lock">You can hold ${S.MAX_ACTIVE_QUESTS} jobs at once. ${S.activeQuests(state).length} taken.</p>`;
  for(const q of open){
    const can = S.canAcceptQuest(state, q);
    const load = S.questLoad(q);
    /* A delivery takes the hold here and now; a salvage takes it at the far
       end, which is still a number somebody deciding needs in front of them. */
    const later = S.salvageLoad(q);
    const room = load ? `${load} unit${load === 1 ? '' : 's'} of hold`
      : later ? `${later} unit${later === 1 ? '' : 's'} of hold, out there`
      : '';
    out += `<div class="quest">`;
    out += `<h3>${esc(q.title)}</h3>`;
    out += `<p class="lock">${esc(q.giver)}${room ? ` · ${room}` : ''}</p>`;
    out += `<p class="say">${esc(q.blurb)}</p>`;
    out += '<ol class="steps">' + S.questSteps(q).map(st => `<li>${esc(st.text)}</li>`).join('') + '</ol>';
    out += `<div class="row"><div class="name"><small>${q.pay ? `Pays ${S.fmtMoney(q.pay)}` : ''}</small></div>
      <div class="btns"><button class="btn sm primary" data-act="takequest|${q.id}" ${can.ok ? '' : 'disabled title="' + esc(can.reason) + '"'}>Take it on</button></div></div>`;
    if(!can.ok) out += `<p class="lock">${esc(can.reason)}</p>`;
    out += '</div>';
  }
  return out;
}

/* What you are carrying, and then what you have carried.
 *
 * A finished job used to sit wherever it had been taken on, in the middle of
 * the live ones with its steps all ticked — which read as though it were
 * still taking up one of the three, and there was nothing on this tab to say
 * otherwise. It never was: the rule counts what is still open. So the live
 * jobs come first with the count above them, and the finished ones go
 * underneath, newest first, as a record of the trip rather than a list of
 * things to do. */
function questsTab(){
  let out = '<h2>Quests</h2>';
  const held = (state.quests ?? []).map(l => ({ l, q: S.questById(l.id) })).filter(x => x.q);
  if(!held.length) return out + '<p class="say">Nobody has asked you for anything yet.</p>';
  /* Three groups, in the order a player wants them: something owed to you,
     then what you are doing, then what is behind you. */
  const owed = held.filter(x => x.l.done && !x.l.claimed)
    .sort((a, b) => (a.l.doneAt ?? 0) - (b.l.doneAt ?? 0));
  const live = held.filter(x => !x.l.done);
  const done = held.filter(x => x.l.done && x.l.claimed)
    .sort((a, b) => (b.l.claimedAt ?? b.l.doneAt ?? 0) - (a.l.claimedAt ?? a.l.doneAt ?? 0));

  out += `<p class="lock">${live.length} of ${S.MAX_ACTIVE_QUESTS} in hand`
    + `${owed.length ? ` · <b class="up">${owed.length} to collect</b>` : ''}`
    + `${done.length ? ` · ${done.length} finished` : ''}.</p>`;

  if(owed.length){
    out += '<h3>Ready to collect</h3>';
    for(const { l, q } of owed){
      void l;
      const pays = [];
      if(q.pay) pays.push(S.fmtMoney(q.pay));
      if(q.rep) pays.push(`standing with the ${sp(q.rep)}`);
      if(q.crew) pays.push('somebody for a berth');
      out += `<div class="quest owed" id="owed-${esc(q.id)}">`
        + `<h3>${esc(q.title)}</h3>`
        + `<p class="lock">${esc(q.giver)} · the work is done</p>`
        + `<p class="say">${esc(q.done ?? q.blurb)}</p>`
        + `<p>Owed: ${pays.length ? pays.join(' · ') : 'the thanks of the person who asked'}.</p>`
        + `<div class="btns"><button class="btn primary collect" data-act="claim|${esc(q.id)}">Collect</button></div>`
        + '</div>';
    }
  }

  if(!live.length && !owed.length) out += '<p class="say">Nothing in hand. A port\'s Requests tab is where the next one comes from.</p>';
  for(const { l, q } of live){
    /* In hand, the card carries what was said when you agreed rather than the
       pitch off the board: you are not being sold this one any more. */
    out += '<div class="quest">';
    out += `<h3>${esc(q.title)}</h3>`;
    out += `<p class="lock">${esc(q.giver)}</p>`;
    out += `<p class="say">${esc(q.taken ?? q.blurb)}</p>`;
    out += '<ol class="steps">';
    S.questSteps(q).forEach((st, i) => {
      const state_ = i < l.step ? 'ok' : i === l.step ? 'now' : '';
      out += `<li class="${state_}">${esc(st.text)}</li>`;
    });
    out += '</ol>';
    if(q.pay) out += `<p class="lock">Pays ${S.fmtMoney(q.pay)} when it is finished.</p>`;
    out += '</div>';
  }
  /* The finished cards keep the payoff line and drop the steps: a ticked list
     of things you are no longer doing is the longest part of the tab and the
     least worth reading, and there will be twenty of these by the end. */
  if(done.length){
    out += '<h3>Finished</h3>';
    for(const { l, q } of done){
      void l;
      out += '<div class="quest done">';
      out += `<h3>${esc(q.title)}</h3>`;
      out += `<p class="lock">${esc(q.giver)} · done${q.pay ? ` · paid ${S.fmtMoney(q.pay)}` : ''}</p>`;
      out += `<p class="say">${esc(q.done ?? q.blurb)}</p>`;
      out += '</div>';
    }
  }
  return out;
}

/* The Astrolabe. One line per world that goes round the Lamp — no moons, which
   are reached from the world they belong to rather than through a window.
   Name, verdict, what it costs to leave today, and how long until it is
   cheap. The four words do the explaining. */
const BAND_WORD = { perfect: 'Perfect', good: 'Good', bad: 'Bad', impossible: 'Impossible' };
function astrolabeTab(){
  let out = '<h2>Transfer windows</h2>';
  if(!state.keys?.astrolabe) return out + '<p class="say">No Astrolabe fitted.</p>';
  const rows = S.transferWindows(state);
  out += `<p class="lock">From ${esc(S.departureName(state) ?? 'here')} · tank ${S.fmtKms(S.usableTank(state))}</p>`;
  if(!rows.length) return out + '<p class="empty">Nothing else goes round the Lamp from here.</p>';
  for(const r of rows){
    /* No countdown where waiting cannot help: the crossing is past this tank
       at every phase, and a date would be a promise the ship cannot keep. */
    const ever = r.best <= S.usableTank(state) && r.days != null;
    /* And a way to be there when it happens. The Astrolabe knew the date and
       could do nothing about it, which is most of why it reads as dead: at ×1
       the numbers are right and will not visibly move for the better part of
       an hour. Everywhere else in the game you skip by pointing at the thing
       you are waiting for, so you can point at a window too. */
    /* A window you are standing in does not get a countdown to the next one.
       The clock lands on the window, the band turns perfect — and the row used
       to say "103 d" beside it, because that is when the *next* one comes
       round. Read together those say the instrument is wrong, which is how it
       read to everybody who waited for a window and then looked at it. */
    const open = r.band === 'perfect';
    const wait = !open && ever && r.days > 0.05
      ? ` <button class="btn sm" data-act="skipto|${state.t + r.days}|${esc(r.name)}'s window">Wait for it</button>`
      : '';
    const when = open ? 'now' : ever ? S.fmtDays(r.days) : '—';
    out += `<div class="win ${r.band}">`
      + `<div class="name"><b>${esc(r.name)}</b><small>${S.fmtKms(r.cost)} · ${S.fmtDays(r.tof)}</small></div>`
      + `<div class="band">${BAND_WORD[r.band]}<small>${when}</small>${wait}</div>`
      + '</div>';
  }
  return out;
}

/* ------------------------------------------------------------- actions */

const actions = {
  /* Collecting a job. The card is the animation: it lights, lifts, and the
     things you were owed fly up out of it one after another, and only then
     does the log redraw with the card moved down to Finished. A reward that
     appears in a corner while you are looking at the chart is not a reward. */
  claim(id){
    const r = S.claimQuest(state, id);
    if(!r.ok){ toast(r.reason, 'bad'); return; }
    const card = document.getElementById(`owed-${id}`);
    const bits = [];
    if(r.pay) bits.push(`+${S.fmtMoney(r.pay)}`);
    if(r.rep) bits.push('+ standing');
    if(r.crew) bits.push('+ a berth filled');
    if(r.relic) bits.push(`+ ${S.relicById(r.relic)?.name ?? 'something'}`);
    if(card){
      card.classList.add('collecting');
      bits.forEach((text, i) => {
        const fly = document.createElement('div');
        fly.className = 'reward-fly';
        fly.textContent = text;
        fly.style.animationDelay = `${i * 160}ms`;
        card.appendChild(fly);
      });
    }
    renderHud();
    save();
    const settle = () => {
      renderTab();
      /* The payoff is the point of the trip, so it gets the scene rather than a
         line in the corner: what happened when you handed it over, and what you
         were given for it. A job that pays in a person goes on to their face
         from here, which is one press rather than two modals racing. */
      showQuestScene(r.quest, {
        kind: 'collected',
        say: r.quest.done,
        foot: bits.length ? bits.join(' · ') : esc(TEXT.events.questCollected ?? 'Collected.'),
        then: r.crew ? () => showCrewPortrait(r.crew, r.quest) : null,
      });
    };
    /* Long enough for the last chip to finish its climb, and short enough that
       nobody presses anything twice. Reduced motion skips straight to the end. */
    const motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(card && motion) setTimeout(settle, 640 + bits.length * 160);
    else settle();
  },
  exportsave(){
    const hex = S.exportSave(state);
    openModal(`<h2>This game, written out</h2>
      <p>Keep this anywhere. Pasting it into a slot on any machine brings this ship back exactly as it is — same day, same hold, same purse.</p>
      <textarea id="m-hex" class="hexbox" rows="5" readonly spellcheck="false" aria-label="The save, written out">${esc(hex)}</textarea>
      <div class="btns"><button class="btn" id="m-copy">Copy</button><button class="btn primary" id="m-ok">Done</button></div>`, m => {
      const box = m.querySelector('#m-hex');
      box.addEventListener('focus', () => box.select());
      m.querySelector('#m-copy').addEventListener('click', async () => {
        box.select();
        try{ await navigator.clipboard.writeText(hex); toast('Copied.'); }
        catch{ toast('Press Ctrl or Cmd and C to copy.', 'bad', 5000); }
      });
      m.querySelector('#m-ok').addEventListener('click', closeModal);
    });
  },
  importsave(){
    openModal(`<h2>Paste a game in</h2>
      <p>This replaces the ship you are flying with the one in the save. Spaces and line breaks do not matter.</p>
      <textarea id="m-hex" class="hexbox" rows="5" spellcheck="false" autocomplete="off" aria-label="Paste a save here"></textarea>
      <div class="btns"><button class="btn" id="m-no">Not now</button><button class="btn primary" id="m-go">Load it</button></div>`, m => {
      m.querySelector('#m-no').addEventListener('click', closeModal);
      m.querySelector('#m-go').addEventListener('click', () => {
        let loaded;
        try{ loaded = S.importSave(m.querySelector('#m-hex').value); }
        catch(err){ toast(err.message, 'bad', 6000); return; }
        if(!confirm('Replace the ship you are flying with the one in that save?')) return;
        closeModal();
        state = loaded;
        selectedNode = -1; lastDockedMode = null;
        replan(true); renderTabs(); renderHud(); backToShip(true); save();
        toast('Loaded.', 'story', 5000);
      });
    });
  },
  repair(what){
    const r = S.repair(state, what);
    if(!r.ok){ toast(r.reason, 'bad'); return; }
    toast(what === 'fuelCell' ? 'New cell fitted.' : 'Hull made good.', 'story', 5000);
    renderTab(); renderHud(); save();
  },
  buy(gid, q){ const r = S.buy(state, gid, Number(q)); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); },
  sell(gid, q){ const r = S.sell(state, gid, Number(q)); if(!r.ok) toast(r.reason, 'bad'); else toast(`Sold for ${S.fmtMoney(r.total)} (${r.profit >= 0 ? '+' : ''}${S.fmtMoney(r.profit)}).`); renderTab(); save(); },
  takequest(id){
    const r = S.acceptQuest(state, id);
    if(!r.ok){ toast(r.reason, 'bad'); return; }
    if(!state.target) state.target = S.questTarget(r.quest);
    renderTab(); save(); tutorialCheck();
    const load = S.questLoad(r.quest);
    showQuestScene(r.quest, {
      kind: 'taken on',
      say: r.quest.taken,
      foot: [
        load ? `${load} unit${load === 1 ? '' : 's'} of your hold, now` : '',
        r.quest.pay ? `Pays ${S.fmtMoney(r.quest.pay)} when it is done.` : '',
      ].filter(Boolean).join(' · '),
    });
  },
  look(gid){ showAppraisal(gid); },
  /* Pressing a face: they say their piece, as a popup over the sky. Pressing it
     again while they are still speaking is "yes, and?" and brings the rest of
     it up at once; pressing a finished one gets the next thing they have to say
     about this place, and once they are out of lines the popup goes away rather
     than looping — a portrait that will not stop talking is a portrait you stop
     pressing. */
  say(who){
    if(chatter?.who === who && chatter.i < chatter.lines.length) return restOfChatter();
    const n = S.exchangesFor(state, who).length;
    const sameSpot = talking?.who === who && talking.at === (state.dockedAt ?? null);
    if(!n || (sameSpot && talking.nth >= n - 1)) dismissChatter();
    else{
      talking = sameSpot ? { ...talking, nth: talking.nth + 1 } : { who, nth: 0, at: state.dockedAt ?? null };
      const x = S.exchangeFor(state, who, talking.nth);
      if(x) playChatter(who, x); else dismissChatter();
    }
    renderTab();
  },
  fuel(k){ const r = S.refuel(state, Number(k)); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); },
  upgrade(id){ const r = S.buyUpgrade(state, id); if(!r.ok) toast(r.reason, 'bad'); else toast(`${S.upgradeById(id).name} fitted.`); renderTab(); save(); },
  wait(d){ const days = Number(d); S.wait(state, days); toast(`${S.fmtDays(days)} pass. ${S.calendar(state.t).text}.`); renderTab(); save(); },
  undock(){
    const r = S.undock(state);
    if(!r.ok) return;
    selectedNode = -1; replan(true); renderTabs(); backToShip(true); tutorialCheck(); save();
  },
  dock(){ doDock(); },
  closenode(){ selectNode(-1); replan(true); renderTab(); save(); },
  delnode(i){ S.removeNode(state, Number(i)); selectNode(-1); replan(true); renderTab(); save(); },
  warpnode(i){ const n = state.nodes[Number(i)]; if(n) askSkip(n.t - 0.05, `Burn ${Number(i) + 1}`); },
  skipto(t, what){ askSkip(Number(t), typeof what === 'string' ? what : undefined); },
  push(i, k){ pushAxis(Number(i), k); },
  zeronode(i){ const n = state.nodes[Number(i)]; if(!n) return; n.prograde = 0; n.radial = 0; replan(true); renderTab(); save(); },
  shift(i, d){ const n = state.nodes[Number(i)]; n.t = Math.max(state.t + 1e-3, n.t + Number(d)); state.nodes.sort((a, b) => a.t - b.t); selectedNode = state.nodes.indexOf(n); replan(true); renderTab(); },
  tow(){ showTow('dry'); },
  distress(){ showDistress(); },
  newgame(){ confirmNew(); },
};

function doDock(){
  const r = S.dock(state);
  if(!r.ok){
    /* Every refusal says the next thing to do. This used to answer "too fast"
       and call everything else "No port nearby", which was survivable while
       the only orbital harbours were worlds you already knew; now that the two
       big rocks are docked at by orbiting, a player meets "not in orbit" and
       "that orbit goes through it" early and often. */
    const WHY = {
      'too fast': 'Too fast to come alongside. Match its speed first.',
      'too far': 'Not close enough yet.',
      'not in orbit': 'Get into an orbit round it first.',
      'that orbit goes through it': 'That orbit goes through the ground. Raise the low point.',
      'too far out': 'The high point is outside docking range. Bring it in.',
      'no navigator': 'Nothing here is holding still, and nobody aboard can hold the ship against it. A cat navigator can.',
    };
    toast(WHY[r.reason] ?? 'No port nearby.', 'bad', r.reason === 'no navigator' ? 7000 : 4000);
    return;
  }
  stopSkip();
  selectedNode = -1; replan(true); panelMenu = 'dock'; tab = 'market'; renderTabs(); setTab('market');
  const txt = TEXT.ports[r.port];
  const line = txt?.arrival?.[Math.floor(S.hash(r.port, Math.floor(state.t)) * txt.arrival.length)];
  toast(`Docked at ${S.portName(r.port)}.${line ? ' ' + line : ''}`, 'story', 7000);
  for(const e of r.events ?? []) if(e.kind === 'story') showStory(e.name, e.text);
  noteCrew(r.events);
  tutorialCheck();
  save();
}
/* Three ways in, and all three have to work. The anchor in the chart controls
   is the one the lesson names and the only one a player will find on a phone;
   it appeared beside the other view buttons without ever being wired to
   anything, so it lit up the moment a harbour would take you and then did
   nothing when you pressed it. The HUD hint docks too, because it is the thing
   that says you can, and `d` because a keyboard is a keyboard. */
const dockIfWeCan = () => { const d = S.dockingStatus(state); if(d?.ok) doDock(); };
$('dock-go').addEventListener('click', () => { if(state.dockedAt) actions.undock(); else dockIfWeCan(); });
$('dockhint').addEventListener('click', dockIfWeCan);
$('dockhint').style.cursor = 'pointer';
addEventListener('keydown', e => {
  if(e.key !== 'd' || e.ctrlKey || e.metaKey || e.altKey) return;
  if($('modal').open || typing(e)) return;
  dockIfWeCan();
});

/* ------------------------------------------------------------- modals */

const modal = $('modal');
function openModal(html, wireFn){
  modal.innerHTML = html;
  wire(modal);
  if(wireFn) wireFn(modal);
  if(!modal.open) modal.showModal();
  // showModal traps focus by itself; this only decides where it lands, which
  // should be the thing you are most likely to want.
  const first = modal.querySelector('.btn.primary') ?? modal.querySelector('button');
  if(first) first.focus();
}
function closeModal(){ if(modal.open) modal.close(); modal.innerHTML = ''; tapMark = null; }
modal.addEventListener('cancel', e => { if(state.pending) e.preventDefault(); });

    <div class="btns"><button class="btn" id="m-cargo">Pay in cargo</button><button class="btn primary" id="m-coin">Pay in coin</button></div>`, m => {
    m.querySelector('#m-coin').addEventListener('click', () => { const r = S.resolveToll(state, 'coin'); closeModal(); toast(r.text, 'story', 8000); save(); });
    m.querySelector('#m-cargo').addEventListener('click', () => { const r = S.resolveToll(state, 'cargo'); closeModal(); toast(r.text, 'story', 8000); save(); });

  openModal(`<h2>${esc(storyTitle(name))}</h2>${paras}<div class="btns"><button class="btn primary" id="m-ok">Close</button></div>`, m => m.querySelector('#m-ok').addEventListener('click', closeModal));

/* What a thing is, and — if there is anybody aboard who can tell you — who
   pays for it. The split is the whole of the appraiser's berth: the nature of
   a good is written on the crate and readable by anyone, while knowing which
   of four frog moons will pay over the odds for it is a trade, and Wicket is
   the trade. */
function showAppraisal(gid){
  const g = S.goodById(gid);
  const loved = S.lovedByWords(gid), wanted = S.wantedByWords(gid);
  let body = `<p class="say">${esc(g.nature ?? g.blurb ?? '')}</p>`;
  if(state.crew?.appraiser){
    const who = TEXT.crew.roles.find(r => r.id === 'appraiser')?.person?.name ?? 'The appraiser';
    body += `<dl class="kv"><dt>Loved by</dt><dd>${loved ? esc(loved) : '<span class="lock">nobody, anywhere</span>'}</dd>
      <dt>Wanted by</dt><dd>${wanted ? esc(wanted) : '<span class="lock">nobody else</span>'}</dd></dl>
      <p class="lock">${esc(who)} says so, and has not been wrong yet.</p>`;
  }else{
    body += `<p class="lock">Who pays over the odds for this, and who merely takes it, is a thing you would have to find out by carrying some. An appraiser would already know.</p>`;
  }
