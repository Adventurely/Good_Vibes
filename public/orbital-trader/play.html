function storyTitle(name){ return { mawArrival: 'The Maw', tollGiftLater: 'A parcel from the Belt' }[name] ?? 'A note in the log'; }
function confirmNew(){
  openModal(`<h2>Start over?</h2><p>This save is replaced by a fresh ship at Tassel. There is one save slot.</p><div class="btns"><button class="btn" id="m-no">Keep playing</button><button class="btn danger" id="m-yes">New game</button></div>`, m => {
    m.querySelector('#m-no').addEventListener('click', closeModal);
    m.querySelector('#m-yes').addEventListener('click', () => { closeModal(); state = S.newGame(freshSeed()); save(); selectedNode = -1; lastDockedMode = null; replan(true); renderTabs(); backToShip(true); tutorialCheck(); if(filmWanted(true)) rollFilm(); });
  });
}

/* ------------------------------------------------------------- toasts */

/* A toast stays up for as long as it takes to read, never less than the time
   the caller asked for. Nellie's scene at the end of the lesson is sixty words
   and used to be pulled off the screen in nine seconds, which is halfway
   through it: a story beat somebody only sees once should not be a race. */
/* ------------------------------------------------------------ conversation */

/* An exchange plays out a line at a time, and the gap before the next line is
   how long the one on screen takes to read — `S.sayMs`, which is where that
   rule is written down and tested.

   What is being said right now: the exchange, how much of it is on screen, and
   the timer that will put up the next line. Never saved — see `talking`. */
let chatter = null;

/* The tutorial card is bottom-centre and this is bottom-left, which on a narrow
   screen is the same place. While a card is up the conversation sits above it
   rather than under it: the card is the more important of the two, and it is
   the one that must not be covered. */
function liftChatter(){
  const t = $('tut');
  const h = t && !t.hidden ? t.getBoundingClientRect().height + 12 : 0;
  document.documentElement.style.setProperty('--chatter-lift', `${Math.round(h)}px`);
}

/* Take the bubbles down. This leaves `talking` alone, because the next thing
   about to happen may be the next exchange from the same face. */
function wipeChatter(){
  if(chatter?.timer) clearTimeout(chatter.timer);
  chatter = null;
  const box = $('chatter');
  box.innerHTML = ''; box.hidden = true;
  /* A conversation that ends on its own ends without a re-render, so the faces
     are told here rather than left claiming somebody is still speaking. */
  for(const b of document.querySelectorAll('.crew .face')) b.setAttribute('aria-expanded', 'false');
}

/* The conversation is over: bubbles down, and the count of what has been asked
   forgotten with them.

   Forgetting is the point. Pressing Escape, or walking away and letting the
   bubbles time out, is ending a conversation rather than getting through one —
   so the next press starts it again instead of being told they have run out of
   things to say. Without this, everybody with one exchange to their name
   answered every *other* press and stood there mute in between. */
function dismissChatter(){ wipeChatter(); talking = null; }

/* Everything still unsaid, said at once. What a player pressing during a
   conversation means is "yes, and?", so the answer is the rest of it rather
   than nothing — a drip you cannot outrun is a drip you sit through. */
function restOfChatter(){
  if(!chatter) return;
  while(chatter.i < chatter.lines.length) sayLine();
  if(chatter.timer) clearTimeout(chatter.timer);
  chatter.timer = setTimeout(dismissChatter, S.sayMs(chatter.lines.at(-1)?.say) + 1400);
}

function sayLine(){
  const l = chatter.lines[chatter.i++];
  if(!l) return;
  liftChatter();
  const box = $('chatter');
  for(const b of box.children) b.classList.add('said');
  const who = S.speaker(l.who);
  const el = document.createElement('div');
  el.className = 'bubble';
  el.innerHTML = `<img src="${portraitURL(l.who)}" alt="" width="34" height="34">`
    + `<div class="who"><small>${esc(who.name)}</small><p>${esc(l.say)}</p></div>`;
  box.appendChild(el);
  box.hidden = false;
}

function stepChatter(){
  if(!chatter) return;
  sayLine();
  const last = chatter.lines[chatter.i - 1];
  const wait = S.sayMs(last?.say);
  /* After the last line the whole thing stays up a moment longer and then goes
     of its own accord: a conversation nobody dismissed should not still be on
     the sky when the ship arrives somewhere. */
  chatter.timer = setTimeout(chatter.i < chatter.lines.length ? stepChatter : dismissChatter,
    chatter.i < chatter.lines.length ? wait : wait + 1400);
}

/* Somebody's turn to speak. Under reduced motion the whole exchange goes up at
   once: a timed reveal is motion, and it is also the one kind of motion a
   player cannot simply wait out. */
function playChatter(who, x){
  wipeChatter();
  chatter = { who, lines: x.lines ?? [], i: 0, timer: null };
  if(!chatter.lines.length) return dismissChatter();
  if(reduced) restOfChatter(); else stepChatter();
}

/* The stack is one big button: press it and the rest of the exchange arrives,
   press a finished one and it goes away. */
$('chatter').addEventListener('click', () => {
  if(!chatter) return;
  if(chatter.i < chatter.lines.length) restOfChatter(); else dismissChatter();
});


function toast(text, kind = '', ms = 4200){
  if(!text) return;
  ms = Math.max(ms, 1200 + text.split(/\s+/).length * 280);
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
  while($('toasts').children.length > 4) $('toasts').firstChild.remove();
}

/* ------------------------------------------------------------- tutorial */

/* The lesson is the chart and then the first delivery: four cards to learn
   what the map does — drag it, zoom it, tap a moon, come back — and then the
   orbit you open in, out to Slate, and home again. There is no casting off to
   do, since the game starts in flight, so the flying half begins at the first
   thing a player actually has to decide.

   It watches the state rather than the clicks, so doing a step your own way
   still counts, and it steps out of the way the moment you are tied up. */
const TUT = TEXT.tutorial;
const FIRST_TARGET = S.questTarget(S.QUESTS[0]) ?? CONST.START_PORT;

/* One test per card, in order, each asking the game the same question the
   card asks the player. The card on screen is the first one whose test is
   false. */
function tutorialTests(){
  const target = FIRST_TARGET;
  const moon = world.get(target);
  const here = world.get(state.ship.body);
  const el = state.dockedAt ? null : elementsFromState(here.mu, state.ship.r, state.ship.v);
  const segs = prediction?.segments ?? [];
  const afterBurn = segs.find((sg, i) => i > 0 && segs[i - 1].reason === 'burn');
  const raAfter = afterBurn?.elements?.ra;
  const docking = state.dockedAt ? null : S.dockingStatus(state);

  // Having been there is a fact about the trip, not about right now.
  if(state.ship.body === target) state.flags.reachedTarget = true;
  const reached = !!state.flags.reachedTarget;
  const bought = (state.quests ?? []).some(q => q.id === 'pebble' && (q.step >= 1 || q.done));
  /* Handed over, not merely carried home. dock() runs the handover itself, so
     this turns true in the same breath as tying up. */
  const delivered = (state.quests ?? []).some(q => q.id === 'pebble' && q.done);
  const atTarget = state.ship.body === target;
  /* Aimed means the road reaches the moon *and misses the ground*. "Put Slate
     in the way" was being read literally: a road through the middle of the
     moon passed this card, and card nine then opened on a ship falling into
     a rock it had been told to slow down at. */
  /* Any of them, not just the next: a road can pass through two reaches, and a
     graze on the second is still a road into a rock. */
  const ics = prediction?.intercepts ?? [];
  const hits = ics.some(ic => ic.grazes) || (prediction?.events ?? []).some(e => e.kind === 'crash');
  const aimed = (segs.some(sg => sg.body === target) || ics.some(ic => ic.body === target)) && !hits;
  const highEnough = Number.isFinite(raAfter) && Math.abs(raAfter - moon.a) <= moon.a * 0.1;
  const dockableAt = id => state.dockedAt === id || (docking?.port === id && docking.ok);

  /* The first four cards are about the chart rather than the ship, and the
     chart keeps no diary: a drag that is undone, or a moon that crosses the
     frame and leaves it, would be gone by the time this is next read. So
     those four are latched where they happen — see noteLook — and only read
     back here.

     Thirteen tests for fourteen cards, because the last card is not a step.
     It is a goodbye, and the only thing that clears it is the button on it. */
  const f = state.flags;
  const raw = [
    !!f.chartPanned,                                  // drag the sky about
    !!f.sawTarget,                                    // zoom out until the moon is in the frame
    !!f.lookedAtTarget,                               // tap it, and the chart follows it
    !!f.lookedBack,                                   // and come back to the ship
    state.nodes.length > 0,                           // write a mark down
    highEnough,                                       // push it out to the moon's height
    aimed,                                            // slide it until the road finds the moon
    reached,                                          // warp into its gravity
    atTarget && !!el && Number.isFinite(el.period),   // brake until the path closes
    dockableAt(target),                               // bring the high point inside docking range
    bought,                                           // buy the pebble
    bought && !atTarget,                              // climb back out
    /* The pebble in Nellie's hand, which is the errand and therefore the
       lesson. Asking whether Tassel *would* take you ran the last card — and
       Nellie's scene with it — while the ship was still in the air with the
       pebble in the hold: being able to dock is not docking, and the handover
       is what finishes the job. Asking whether the quest is done also settles
       an older trap, that "docked at Tassel" is true two minutes into a new
       game, because the opening orbit sits inside Tassel's own harbour mouth
       and the list is cumulative from the back: one true card at the end made
       all fourteen true, and the lesson finished itself in the orbit it
       started in. Neither is possible to reach without the pebble. */
    delivered,                                        // and put it in her hand
  ];
  /* Every test has to be true of every state past its own card, not only of
     the moment it is passed: a pilot standing in Slate's gravity has no burn
     written down, and a lesson that read its tests one at a time would send
     them back to card five to write one. So each carries the proof that comes
     after it — reaching the moon proves the aiming, the pebble in the hold
     proves everything up to buying it — which is one pass from the back of
     the list rather than a disjunction written out by hand on every line. It
     is also what makes undoing something walk the lesson back on its own. */
  for(let i = raw.length - 2; i >= 0; i--) raw[i] = raw[i] || raw[i + 1];
  return raw;
}

/* Whether the moon the lesson is about is somewhere a player can actually see
   it: inside the frame, and not under the HUD or behind the panel. */
function targetOnScreen(){
  if(state.dockedAt) return false;
  const b = world.get(FIRST_TARGET);
  if(!b) return false;
  const p = chart.toScreen(absState(world, FIRST_TARGET, state.t).r);
  const i = chart.labelInsets ?? { top: 0, right: 0, bottom: 0, left: 0 };
  return p[0] > i.left && p[0] < chart.width - i.right
      && p[1] > i.top && p[1] < chart.height - i.bottom;
}

/* A card that is passed by a gesture rather than by a state of the ship is
   noticed as the gesture happens, once, and then it is a fact about the trip
   like any other. Zooming counts as looking around as much as dragging does:
   the first card is teaching that the view moves, and somebody who scrolled
   instead of dragged has learned it. */
function noteLook(flag){
  if(state.flags[flag] || state.flags.tutorialSkipped) return;
  state.flags[flag] = true;
  tutorialCheck();
  save();
}

function tutorialCheck(){
  if(state.flags.tutorialSkipped){ $('tut').hidden = true; return; }
  const tests = tutorialTests();
  let step = 0;
  while(step < tests.length && tests[step]) step++;
  state.flags.tutorial = step;

  const s = TUT[Math.min(step, TUT.length - 1)];
  if(!s){ $('tut').hidden = true; return; }
  const last = step >= TUT.length - 1;
  /* The pebble is home: Theo gets the last card, and Nellie gets her scene when
     the errand is collected, which is where every job's payoff lives now. This
     used to spend her paragraph here as a toast, and then the collect scene
     said the same words over again a minute later. So this is a nudge towards
     the tab and nothing else. The goodbye belongs to the trip that has just
     been made, so a save that finished this errand before the card existed —
     tutorialDone set, and no goodbye owed — gets neither: Theo congratulating
     somebody on their first trade forty jobs later is worse than saying
     nothing. */
  if(last && !state.flags.tutorialDone){
    state.flags.tutorialDone = true;
    state.flags.tutorialGoodbye = true;
    toast('The pebble is home. Theo is waiting to settle up — the Quests tab has it.', 'story', 9000);
    save();
  }
  if(last && !state.flags.tutorialGoodbye){ $('tut').hidden = true; return; }
  $('tut').hidden = false;
  $('tut-step').textContent = `${S.QUESTS[0]?.giver ?? 'Uncle Theo'} · ${last ? 'that is the job' : `${step + 1} of ${TUT.length}`}`;
  $('tut-title').textContent = s.title;
  /* Blank lines in the card are paragraphs: these are longer than they were,
     and a wall of eight sentences is a card nobody reads to the end of. */
  const body = $('tut-body');
  body.textContent = '';
  for(const para of s.body.split(/\n{2,}/)){
    const el = document.createElement('p');
    el.textContent = para;
    body.appendChild(el);
  }
  /* Nothing is left to do on the last card, so the way out of it stops being
     a way of shutting Theo up and becomes the end of the lesson. */
  $('tut-skip').textContent = last ? 'Thanks, Theo' : 'Stop writing, Theo';
  $('tut').classList.toggle('done', last);
  $('tut').classList.toggle('min', !!state.flags.tutorialFolded);
  // A different card is a different height, and a conversation may be sitting
  // on top of the old one.
  liftChatter();
}
$('tut-skip').addEventListener('click', () => { state.flags.tutorialSkipped = true; $('tut').hidden = true; save(); });

/* Folded or open, and it stays that way across steps and across sessions:
   somebody who has put the card down does not want it standing up again every
   time Theo has a new thought. */
function setTutFolded(folded){
  state.flags.tutorialFolded = !!folded;
  $('tut').classList.toggle('min', !!folded);
  $('tut-min').textContent = folded ? '+' : '\u2013';
  $('tut-min').title = folded ? 'Read it' : 'Fold it away';
  $('tut-min').setAttribute('aria-expanded', String(!folded));
  save();
}
$('tut-min').addEventListener('click', e => { e.stopPropagation(); setTutFolded(!state.flags.tutorialFolded); });
// Folded, the whole card is the way back open.
$('tut').addEventListener('click', () => { if(state.flags.tutorialFolded) setTutFolded(false); });
setInterval(() => { if(!$('tut').hidden) tutorialCheck(); }, 1500);

/* ------------------------------------------------------------- the film */

/* Six and a half seconds of launch, and then the game: intro.js draws a
   lighter coming up out of Tassel's ocean, through the weather, and out the
   top of the sky, which is where a new game opens. It plays for a new ship and
   not for a saved one, because a launch is how this game starts and not how it
   resumes, and it does not play for anybody who has asked the system for less
   motion — `?intro` plays it anyway for anyone who asks by hand, and
   `?intro=0` refuses it.
   Any key and any click is the way out of it, and the clock does not start
   until it is over, so the six seconds are not six seconds of an orbit nobody
   was watching. */
let film = null;
function filmWanted(freshShip){
  if(params.has('intro')) return params.get('intro') !== '0';
  return freshShip && !reduced;
}
function startClock(){ last = performance.now(); requestAnimationFrame(frame); }

/* `begin` is whatever has to be true before the film dissolves: at boot it is
   the clock, so the chart has painted itself once and the thing coming through
   underneath is the game rather than a black rectangle. */
function rollFilm(begin = () => {}){
  if(film) return;
  const host = $('intro');
  host.hidden = false;
  /* A restart from the menu rolls the film over a game that is already
     running; hold the clock while it plays, and put it back as it was. */
  const wasPaused = state.paused;
  setPaused(true);
  const f = film = playIntro($('intro-art'), {
    onCaption: () => host.classList.add('say'),
  });
  /* While it runs the keyboard is the film's: caught on the way down, so that
     space does not pause a game nobody can see yet. */
  const key = e => { if(e.key === 'Tab' || e.ctrlKey || e.metaKey) return; e.preventDefault(); e.stopPropagation(); f.skip(); };
  const tap = () => f.skip();
  addEventListener('keydown', key, true);
  host.addEventListener('click', tap);
  f.done.then(() => {
    removeEventListener('keydown', key, true);
    host.removeEventListener('click', tap);
    film = null;
    setPaused(wasPaused);
    begin();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      host.classList.add('gone');
      setTimeout(() => { host.hidden = true; host.classList.remove('gone', 'say'); }, 700);
    }));
  });
}
$('intro-skip').addEventListener('click', e => { e.stopPropagation(); film?.skip(); });

/* ------------------------------------------------------------- boot */

/* The sheet's handle. Three heights and a way between them.
 *
 * A phone sheet that is always the same size is a phone sheet that is always
 * the wrong size: reading the market wants the whole screen, and watching a
 * burn come up wants the chart. The three stops are a peek, the height it has
 * always opened at, and nearly the whole screen — and the middle one is
 * exactly what it was, so nothing about opening the panel has changed.
 *
 * Not saved. A sheet height is a thing you set for the next minute, not a
 * setting, and putting it in the save would mean a version bump for it. */
/* The height we have settled on, or null while it is still whatever the
   stylesheet says. Kept here rather than read back off the element, because
   the element spends a fifth of a second animating to each new height and
   everything downstream — which stop are we on, which is the next one up —
   would be working from a number that is still moving. */
let sheetH = null;
const defaultSheet = () => Math.round(Math.min(innerHeight * 0.64, 560));
const sheetStops = () => [Math.round(innerHeight * 0.34), defaultSheet(), Math.round(innerHeight * 0.9)];
const sheetHeight = () => sheetH ?? defaultSheet();
const setSheetHeight = px => {
  sheetH = Math.round(px);
  document.documentElement.style.setProperty('--sheet-h', `${sheetH}px`);
};
const nearestStop = h => sheetStops().reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a);

/* Step to the next stop up or down, for a keyboard and for the two ends of a
   drag that went past them. */
function stepSheet(dir){
  const stops = sheetStops();
  const i = stops.indexOf(nearestStop(sheetHeight()));
  const next = stops[Math.max(0, Math.min(stops.length - 1, i + dir))];
  setSheetHeight(next);
  applyOffset();
}

let sheetDrag = null;
$('grab').addEventListener('pointerdown', e => {
  if(innerWidth > 760 || !panelOpen) return;
  sheetDrag = { id: e.pointerId, y: e.clientY, h0: sheetHeight(), moved: false };
  $('grab').setPointerCapture(e.pointerId);
  $('panel').classList.add('dragging');
  e.preventDefault();
});
$('grab').addEventListener('pointermove', e => {
  if(!sheetDrag || e.pointerId !== sheetDrag.id) return;
  const dy = sheetDrag.y - e.clientY;                      // up is taller
  if(Math.abs(dy) > TAP_SLOP) sheetDrag.moved = true;
  const stops = sheetStops();
  /* A little give at each end, so the sheet feels like a sheet rather than a
     wall — and so there is somewhere below the smallest stop to let go and
     have it mean "away with it". */
  setSheetHeight(Math.max(stops[0] * 0.5, Math.min(stops.at(-1) + 28, sheetDrag.h0 + dy)));
});
function endSheetDrag(e){
  if(!sheetDrag || (e && e.pointerId !== sheetDrag.id)) return;
  const h = sheetHeight(), stops = sheetStops(), moved = sheetDrag.moved;
  sheetDrag = null;
  $('panel').classList.remove('dragging');
  /* A press that never moved is the press it always was: the sheet goes away.
     This is why there is no click handler here — after a drag the browser
     fires one anyway, and the panel would shut every time it was resized. */
  if(!moved) return togglePanel(false);
  /* Pulled down below the smallest stop and let go: away with it. The height
     goes back to the middle one, so opening it again is not a sliver. */
  if(h < stops[0] * 0.8){ setSheetHeight(stops[1]); return togglePanel(false); }
  setSheetHeight(nearestStop(h));
  applyOffset();
}
$('grab').addEventListener('pointerup', endSheetDrag);
$('grab').addEventListener('pointercancel', endSheetDrag);

$('grab').setAttribute('role', 'button');
$('grab').setAttribute('tabindex', '0');
$('grab').setAttribute('aria-label', 'Panel height: drag to resize, or press to close');
$('grab').addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); togglePanel(false); }
  // The drag is a drag; the arrows are how it is reachable without one.
  else if(e.key === 'ArrowUp'){ e.preventDefault(); stepSheet(1); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); stepSheet(-1); }
});

renderTabs();
togglePanel(panelOpen, true);
replan(true);
/* Again, now that there is a road to read. The panel is built before the first
   solve — it has to be, the solve wants a drawn chart — and Ahead is the first
   thing in it, so on the opening frame it would otherwise be missing from the
   one tab the game starts on. */
renderTab();
backToShip(true);
syncView();
setRate(state.warp ?? 1);
tutorialCheck();
setTutFolded(!!state.flags.tutorialFolded);
if(state.pending?.kind === 'toll') showToll(state.pending);
if(state.pending?.kind === 'crash') showCrash(state.pending.body);
if(filmWanted(fresh)) rollFilm(startClock);
else startClock();
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); else last = performance.now(); });
</script>
</body>
</html>
