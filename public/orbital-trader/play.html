function repWord(v){ return v >= 8 ? 'old friends' : v >= 4 ? 'a known name' : v >= 1.5 ? 'a familiar face' : v <= -2 ? 'unwelcome' : v < 0 ? 'a story going round' : 'a stranger'; }

/* ---------------------------------------------------------- the burn pad */

/* One press of one of the four buttons. `scale` lets the keyboard ask for a
   smaller one (Shift) without inventing a second set of numbers. */
function pushAxis(i, k, scale = 1){
  const n = state.nodes[i];
  const a = AXES[k];
  if(!n || !a) return;
  n[a.axis] += a.sign * scale * S.auDay(stepFor(i) / 1000);
  replan(true);
  if(tab === 'plan') renderTab();
  tutorialCheck();
  save();
}

/* Hold a button down and it repeats, slowly at first so a single tap is never
   two, then faster, because pushing a big orbit around takes more than four
   presses and nobody should have to click forty times. */
let repeat = null;
function stopRepeat(){ if(repeat){ clearTimeout(repeat.timer); repeat = null; } }
document.addEventListener('pointerdown', e => {
  const btn = e.target.closest('button.pv[data-act]');
  if(!btn) return;
  const [, i, k] = btn.dataset.act.split('|');
  stopRepeat();
  let n = 0;
  const tick = () => {
    n++;
    pushAxis(Number(i), k, n > 12 ? 4 : n > 5 ? 2 : 1);
    repeat.timer = setTimeout(tick, n < 3 ? 260 : 90);
  };
  repeat = { timer: setTimeout(tick, 340) };
});
for(const ev of ['pointerup', 'pointercancel', 'pointerleave', 'blur']) document.addEventListener(ev, stopRepeat, true);


/* Four buttons and two axes, and that is the whole of flying this ship.
 *
 *   forward / back   along the way you are already going: raises or lowers
 *                    the far side of the orbit
 *   out / in         across it: swings the orbit round without changing its
 *                    size much
 *
 * No typing, no units to choose, no handle to drag to the right number. One
 * press is one step, and the step is sized to the orbit you are on, so the
 * same press means "a small change" whether you are creeping round a moon at
 * two hundred metres a second or falling past the Lamp at thirty kilometres
 * a second. Hold a button and it repeats, and then it hurries.
 */
const AXES = {
  pro:  { axis: 'prograde', sign:  1, key: 'pro',  label: 'Forward', hint: 'lifts the far side' },
  retro:{ axis: 'prograde', sign: -1, key: 'retro',label: 'Back',    hint: 'drops the far side' },
  out:  { axis: 'radial',   sign:  1, key: 'out',  label: 'Out',     hint: 'swings it outward' },
  in:   { axis: 'radial',   sign: -1, key: 'in',   label: 'In',      hint: 'swings it inward' },
};

/* A press should be worth something on any orbit and never enormous on any
   orbit, so it is a fixed fraction of how fast you are actually going at the
   mark, rounded to a number a person would say out loud. */
function stepFor(i){
  const where = nodePositions[i];
  const v = where ? norm(where.v) : norm(state.ship.v);
  const ms = S.kms(v) * 1000 * 0.005;
  const pow = Math.pow(10, Math.floor(Math.log10(Math.max(1, ms))));
  const nice = [1, 2, 5, 10].map(m => m * pow).find(x => x >= ms) ?? 10 * pow;
  return Math.max(1, Math.min(500, nice));
}

const ARROW = {
  pro:   'M4 12 L16 12 M11 7 L16 12 L11 17',
  retro: 'M20 12 L8 12 M13 7 L8 12 L13 17',
  out:   'M12 20 L12 8 M7 13 L12 8 L17 13',
  in:    'M12 4 L12 16 M7 11 L12 16 L17 11',
};
const arrow = k => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ARROW[k]}"/></svg>`;

function padButton(i, k){
  const a = AXES[k];
  return `<button class="pv ${k}" data-act="push|${i}|${k}" title="${a.label} — ${a.hint}" aria-label="${a.label}, ${a.hint}">${arrow(k)}<span>${a.label}</span></button>`;
}

/* The burn editor floats over the chart, because the chart is the thing it
   changes: while it is open the road past the burn is drawn in yellow and
   dashed, and every press moves that yellow line where you can see it. Close
   it and the yellow goes away again. */
/* Rebuilt only when something in it changed. Re-writing the card's markup
   every frame emptied it out from under the finger on its way down, so no
   button in it could ever be pressed. */
let burnCardKey = '';
function renderBurnCard(){
  const card = $('burncard');
  const i = selectedNode;
  const n = state.nodes[i];
  if(!n || state.dockedAt){
    if(burnCardKey !== ''){ burnCardKey = ''; card.hidden = true; card.innerHTML = ''; document.body.classList.remove('editing'); }
    return;
  }
  const when = $('burn-when');
  const key = `${i}|${n.prograde}|${n.radial}|${n.t}|${state.nodes.length}`;
  if(key === burnCardKey){
    if(when) when.textContent = `fires in ${S.fmtDays(n.t - state.t)}`;
    return;
  }
  burnCardKey = key;
  card.hidden = false;
  document.body.classList.add('editing');
  const step = stepFor(i);
  const marks = S.markStates(state, horizonFor());
  const fwd = S.kms(n.prograde) * 1000, side = S.kms(n.radial) * 1000;
  const say = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(2) + ' km/s' : Math.round(Math.abs(v)) + ' m/s'}`;
  card.innerHTML = `<div class="burnhead"><b>Burn ${i + 1}</b><small id="burn-when">fires in ${S.fmtDays(n.t - state.t)}</small>
      <button class="btn sm" data-act="closenode" title="Done">Done</button></div>
    <div class="padgrid">
      <div class="padcell up">${padButton(i, 'out')}</div>
      <div class="padcell left">${padButton(i, 'retro')}</div>
      <div class="padcell mid"><b>${S.fmtKms(marks[i]?.cost ?? 0)}</b><small>${step} m/s a press</small></div>
      <div class="padcell right">${padButton(i, 'pro')}</div>
      <div class="padcell down">${padButton(i, 'in')}</div>
    </div>
    <dl class="padout">
      <dt>Forward / back</dt><dd>${say(fwd)}</dd>
      <dt>Out / in</dt><dd>${say(side)}</dd>
    </dl>
    <div class="btns">
      <button class="btn sm" data-act="shift|${i}|-0.0416667">&minus;1 h</button>
      <button class="btn sm" data-act="shift|${i}|0.0416667">+1 h</button>
      <button class="btn sm" data-act="zeronode|${i}">Start over</button>
      <button class="btn sm danger" data-act="delnode|${i}">Scrap it</button>
    </div>`;
  wire(card);
}
/* The Plan tab reads; it does not edit. A burn is set on the chart, where
 * the road it changes is in front of you — a panel of numbers beside a
 * picture of the thing the numbers are about is a worse place to work than
 * the picture. So this lists what is written down and what is coming. */
function plan(){
  let out = '<h2>Planned burns</h2>';
  const marks = state.nodes.length ? S.markStates(state, horizonFor()) : [];
  const cost = marks.reduce((a, m) => a + m.cost, 0);
  const short = cost > state.dv + 1e-9;
  if(!state.nodes.length){
    out += '<p class="say">Nothing written down. Tap your road on the chart and choose <b>Plan a burn</b>.</p>';
  }else{
    out += `<p>These cost <b class="${short ? 'down' : ''}">${S.fmtKms(cost)}</b> of your ${S.fmtKms(state.dv)}.${short ? ' <span class="down">The tank will not cover it.</span>' : ''}</p>`;
    state.nodes.forEach((n, i) => {
      const where = nodePositions[i];
      const frame = where ? world.get(where.body).name : '?';
      const fwd = Math.round(S.kms(n.prograde) * 1000), side = Math.round(S.kms(n.radial) * 1000);
      out += `<div class="node ${i === selectedNode ? 'sel' : ''}" data-act="selnode|${i}">
        <b>Burn ${i + 1}</b>
        <small>in ${S.fmtDays(n.t - state.t)} · ${esc(frame)}'s reach · ${S.fmtKms(marks[i]?.cost ?? 0)}</small>
        <small>${fwd >= 0 ? 'forward' : 'back'} ${Math.abs(fwd)} m/s · ${side >= 0 ? 'out' : 'in'} ${Math.abs(side)} m/s</small>
      </div>`;
    });
    out += '<p class="lock">A burn fires by itself the moment the clock reaches it. Tap one here, or its ring on the chart, to open it and change it.</p>';
  }
  out += aheadList();
  if(state.dv <= 1e-9){
    const q = S.towQuote(state);
    out += `<h3>Dry tank</h3><p>${esc(TEXT.captainLines.onStranded[2] ?? '')}</p><p>A tow to ${esc(S.portName(q.port))}: ${S.fmtMoney(q.cost)}, ${S.fmtDays(q.days)}.</p><button class="btn wide" data-act="tow">Call for a tow</button>`;
  }else{
    out += `<p class="lock" style="margin-top:1rem">Stuck anywhere? <button class="btn sm" data-act="tow">Call for a tow</button></p>`;
  }
  return out;
}

/* What the drawn road runs into, which is at most one crossing by design. */
function aheadList(){
  if(!prediction) return '';
  let out = '<h3>Ahead</h3>';
  const evs = prediction.events.filter(e => e.kind !== 'burn' || e.node.aero);
  const skip = t => `<button class="btn sm" data-act="skipto|${t}">Skip to it</button>`;
  if(!evs.length && !prediction.crashed) out += '<p class="lock">Nothing changes before this orbit comes round again.</p>';
  for(const e of evs){
    if(e.kind === 'soi'){
      const to = world.get(e.to), from = world.get(e.from);
      out += `<p>${to.parent === from.id ? 'Into' : 'Out to'} ${esc(to.name)}'s reach in ${S.fmtDays(e.t - state.t)}. ${skip(e.t)}</p>`;
    }else if(e.kind === 'burn' && e.node.aero){
      out += `<p class="up">Skim ${esc(S.portName(e.node.body))}: shed ${S.fmtKms(e.magnitude)} in ${S.fmtDays(e.t - state.t)}. ${skip(e.t)}</p>`;
    }else if(e.kind === 'crash'){
      out += `<p class="down">This path strikes ${esc(S.portName(e.body))} in ${S.fmtDays(e.t - state.t)}.</p>`;
    }
  }
  return out;
}

function orbitTab(){
  const b = world.get(state.ship.body);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  const alt = d => fmtAu(Math.max(0, d - (b.radius ?? 0)));
  const shape = !Number.isFinite(el.period) ? 'an escape' :
    el.e < 0.02 ? 'a circle' : el.e < 0.3 ? 'a gentle ellipse' :
    el.e < 0.7 ? 'a long ellipse' : 'a very long ellipse';
  let out = `<h2>Your orbit</h2>`;
  out += `<p>You are going round <b>${esc(b.name)}</b> on ${shape}.</p>`;
  out += `<dl class="kv"><dt>Low point</dt><dd>${alt(el.rp)}</dd>`;
  out += Number.isFinite(el.ra) ? `<dt>High point</dt><dd>${alt(el.ra)}</dd>` : `<dt>High point</dt><dd>none — you are leaving</dd>`;
  out += `<dt>Height now</dt><dd>${alt(norm(state.ship.r))}</dd>`;
  out += `<dt>Speed</dt><dd>${S.fmtKms(norm(state.ship.v))}</dd>`;
  if(Number.isFinite(el.period)) out += `<dt>A lap takes</dt><dd>${S.fmtDays(el.period)}</dd>`;
  out += `</dl>`;
  if(el.rp <= (b.radius ?? 0)) out += `<p class="down">The low point of this orbit is inside ${esc(b.name)}. Burn forward before it arrives.</p>`;
  else if(b.atmo && el.rp < b.atmo) out += `<p class="up">The low point dips into ${esc(b.name)}'s air. With a heat shield that is free braking; without one it is a bad day.</p>`;
  out += aheadList();
  out += `<h3>What is out here</h3>`;
  const kin = world.children(b.id).filter(c => c.port || c.kind === 'moon');
  if(kin.length) out += `<p class="lock">${kin.map(c => esc(c.name)).join(' · ')} go round ${esc(b.name)} too. Tap one on the chart to look at it.</p>`;
  else out += `<p class="lock">Nothing else goes round ${esc(b.name)}.</p>`;
  return out;
}

function shipTab(){
  const b = world.get(state.ship.body);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  let out = `<h2>${esc(state.shipName)}</h2>`;
  out += `<dl class="kv"><dt>Reach</dt><dd>${esc(b.name)}</dd><dt>Distance</dt><dd>${fmtAu(norm(state.ship.r))}</dd><dt>Speed</dt><dd>${S.fmtKms(norm(state.ship.v))}</dd>`;
  out += `<dt>Kissing distance</dt><dd>${fmtAu(el.rp)}</dd><dt>Farthest</dt><dd>${Number.isFinite(el.ra) ? fmtAu(el.ra) : 'escaping'}</dd>`;
  if(Number.isFinite(el.period)) out += `<dt>Period</dt><dd>${S.fmtDays(el.period)}</dd>`;
  out += `<dt>Shape</dt><dd>e = ${el.e.toFixed(3)}</dd></dl>`;
  if(b.atmo){
    out += el.rp < b.atmo ? (state.keys.heatShield ? `<p class="up">Skimming ${esc(b.name)}'s clouds: the shield will brake you.</p>` : `<p class="down">That kissing distance is inside ${esc(b.name)}'s clouds, and you have no heat shield.</p>`) : '';
  }
  out += '<h3>Hold</h3>';
  if(!state.cargo.length && !state.passengers.length) out += '<p class="empty">Empty.</p>';
  for(const c of state.cargo){ const g = S.goodById(c.good); out += `<p>${c.qty} × ${esc(g.name)} <span class="lock">from ${esc(S.portName(c.from))}${g.lifetimeDays ? ` · ${Math.round(S.freshness(g, state.t - c.t) * 100)}% fresh` : ''}</span></p>`; }
  for(const c of state.passengers){ const days = c.deadline - state.t; out += `<p>${esc(c.title)} <span class="lock">→ ${esc(S.portName(c.to))} · ${days < 0 ? 'late' : S.fmtDays(days) + ' left'}</span> <button class="btn sm" data-act="target|${c.to}">Target</button></p>`; }
  out += '<h3>Fitted</h3>';
  out += `<p>${esc(S.tiers('tank')[state.tiers.tank].name)}, ${esc(S.tiers('engine')[state.tiers.engine].name)}, ${esc(S.tiers('hold')[state.tiers.hold].name)}.</p>`;
  out += `<p>${['heatShield', 'refrigeration', 'sensors', 'stealth'].filter(k => state.keys[k]).map(k => esc(UPGRADES.find(u => u.key === k)?.name ?? k)).join(', ') || '<span class="lock">No keys yet.</span>'}</p>`;
  const line = TEXT.captainLines.onLongCoast[Math.floor(S.hash(Math.floor(state.t / 20)) * TEXT.captainLines.onLongCoast.length)];
  out += `<p class="say">${esc(line)}</p>`;
  return out;
}

function logTab(){
  return `<h2>Log</h2><ul id="log" aria-live="polite" aria-relevant="additions">` + [...state.log].reverse().map(l => `<li class="${l.kind === 'story' ? 'story' : ''}"><b>${S.calendar(l.t).year}.${S.calendar(l.t).day}</b>${esc(l.text)}</li>`).join('') + '</ul>';
}

/* ------------------------------------------------------------- actions */

const actions = {
  buy(gid, q){ const r = S.buy(state, gid, Number(q)); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); },
  sell(gid, q){ const r = S.sell(state, gid, Number(q)); if(!r.ok) toast(r.reason, 'bad'); else toast(`Sold for ${S.fmtMoney(r.total)} (${r.profit >= 0 ? '+' : ''}${S.fmtMoney(r.profit)}).`); renderTab(); save(); },
  take(id){ const r = S.takeContract(state, id); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); tutorialCheck(); },
  fuel(k){ const r = S.refuel(state, Number(k)); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); },
  upgrade(id){ const r = S.buyUpgrade(state, id); if(!r.ok) toast(r.reason, 'bad'); else toast(`${S.upgradeById(id).name} fitted.`); renderTab(); save(); },
  wait(d){ const days = Number(d); S.wait(state, days); toast(`${S.fmtDays(days)} pass. ${S.calendar(state.t).text}.`); renderTab(); save(); },
  undock(){
    const r = S.undock(state);
    if(!r.ok) return;
    selectedNode = -1; replan(true); renderTabs(); backToShip(); tutorialCheck(); save();
  },
  dock(){ doDock(); },
  addmark(){
    const ix = S.addNodeAhead(state);
    if(ix < 0){ toast('No room for another burn on this road.', 'bad'); return; }
    selectedNode = ix; holdForPlanning(ix); replan(true); renderTab(); tutorialCheck();
  },
  closenode(){ selectedNode = -1; replan(true); renderTab(); save(); },
  selnode(i){ selectedNode = selectedNode === Number(i) ? -1 : Number(i); replan(true); renderTab(); },
  delnode(i){ S.removeNode(state, Number(i)); selectedNode = -1; replan(true); renderTab(); save(); },
  warpnode(i){ const n = state.nodes[Number(i)]; if(n) askSkip(n.t - 0.05, `Burn ${Number(i) + 1}`); },
  skipto(t){ askSkip(Number(t)); },
  push(i, k){ pushAxis(Number(i), k); },
  zeronode(i){ const n = state.nodes[Number(i)]; if(!n) return; n.prograde = 0; n.radial = 0; replan(true); renderTab(); save(); },
  shift(i, d){ const n = state.nodes[Number(i)]; n.t = Math.max(state.t + 1e-3, n.t + Number(d)); state.nodes.sort((a, b) => a.t - b.t); selectedNode = state.nodes.indexOf(n); replan(true); renderTab(); },
  tow(){ showTow('dry'); },
  newgame(){ confirmNew(); },
};

for(const el of document.querySelectorAll('.node[data-act]')) void el;
// Node cards select on click, but their buttons should not also select.
document.addEventListener('click', e => {
  const card = e.target.closest('.node[data-act]');
  if(card && !e.target.closest('button')){ selectedNode = Number(card.dataset.act.split('|')[1]); renderTab(); }
}, true);

function doDock(){
  const r = S.dock(state);
  if(!r.ok){ toast(r.reason === 'too fast' ? 'Too fast to dock. Kill some speed first.' : 'No port in reach.', 'bad'); return; }
  stopSkip();
  selectedNode = -1; replan(true); renderTabs(); setTab('market');
  const txt = TEXT.ports[r.port];
  const line = txt?.arrival?.[Math.floor(S.hash(r.port, Math.floor(state.t)) * txt.arrival.length)];
  toast(`Docked at ${S.portName(r.port)}.${line ? ' ' + line : ''}`, 'story', 7000);
  for(const d of r.delivered){ toast(`${d.contract.title}: ${S.fmtMoney(d.pay)}${d.late ? ' (late)' : d.early ? ' (early!)' : ''}. ${d.say ?? ''}`, d.late ? 'bad' : 'story', 8000); }
  for(const e of r.events ?? []) if(e.kind === 'story') showStory(e.name, e.text);
  tutorialCheck();
  save();
}
// The dock button lives in the HUD hint: clicking the hint docks when it says so.
$('dockhint').addEventListener('click', () => { const d = S.dockingStatus(state); if(d?.ok) doDock(); });
$('dockhint').style.cursor = 'pointer';
addEventListener('keydown', e => {
  if(e.key !== 'd' || e.ctrlKey || e.metaKey || e.altKey) return;
  if($('modal').open || typing(e)) return;
  const d = S.dockingStatus(state);
  if(d?.ok) doDock();
});

/* ------------------------------------------------------------- modals */

const modal = $('modal');
function openModal(html, wireFn){
  modal.innerHTML = html;
  wire(modal);
  if(wireFn) wireFn(modal);
  if(!modal.open) modal.showModal();
  // showModal traps focus by itself; this only decides where it lands, which
  // should be the thing you are most likely to want.
  const first = modal.querySelector('.btn.primary') ?? modal.querySelector('button');
  if(first) first.focus();
}
function closeModal(){ if(modal.open) modal.close(); modal.innerHTML = ''; }
modal.addEventListener('cancel', e => { if(state.pending) e.preventDefault(); });

function showToll(p){
  openModal(`<h2>A hail from the Scatter</h2><p class="say">${esc(p.line)}</p><p>${esc(p.captain)} asks ${S.fmtMoney(p.amount)}, or the crates to match. Your hold is worth about ${S.fmtMoney(p.cargoValue)}; they will not take it all, and nobody is hurt who yields.</p>
    <div class="btns"><button class="btn" id="m-cargo">Pay in cargo</button><button class="btn primary" id="m-coin">Pay in coin</button></div>`, m => {
    m.querySelector('#m-coin').addEventListener('click', () => { const r = S.resolveToll(state, 'coin'); closeModal(); toast(r.text, 'story', 8000); save(); });
    m.querySelector('#m-cargo').addEventListener('click', () => { const r = S.resolveToll(state, 'cargo'); closeModal(); toast(r.text, 'story', 8000); save(); });
  });
}
function showCrash(bodyId){
  const b = world.get(bodyId);
  const atmo = state.pending?.atmosphere;
  const q = S.towQuote(state);
  openModal(`<h2>${atmo ? 'Too deep' : 'Hard landing'}</h2><p class="say">${esc(atmo ? TEXT.events.towAtmosphere : TEXT.events.towCrash[0])}</p>
    <p>${atmo ? `${esc(b.name)}'s clouds took the ship without a heat shield.` : `The ship met ${esc(b.name)} faster than it should have.`} A tow to ${esc(S.portName(q.port))} will cost ${S.fmtMoney(Math.round(q.cost * 1.5))} and ${S.fmtDays(q.days)}. Cargo and passengers ride along.</p>
    <div class="btns"><button class="btn primary" id="m-tow">Call for a tow</button></div>`, m => {
    m.querySelector('#m-tow').addEventListener('click', () => { const r = S.callTow(state, atmo ? 'atmosphere' : 'crash'); closeModal(); afterTow(r); });
  });
}
function showTow(reason){
  const q = S.towQuote(state);
  openModal(`<h2>Call for a tow</h2><p>The nearest help is at ${esc(S.portName(q.port))}, ${fmtAu(q.distance)} away. They ask ${S.fmtMoney(q.cost)} and it will take ${S.fmtDays(q.days)}. ${state.money < q.cost ? 'What you cannot pay, Ledger will lend.' : ''}</p>
    <div class="btns"><button class="btn" id="m-no">Not yet</button><button class="btn primary" id="m-tow">Call</button></div>`, m => {
    m.querySelector('#m-no').addEventListener('click', closeModal);
    m.querySelector('#m-tow').addEventListener('click', () => { const r = S.callTow(state, reason); closeModal(); afterTow(r); });
  });
}
function afterTow(r){
  selectedNode = -1; replan(true); renderTabs(); setTab('shipyard'); stopSkip();
  openModal(`<h2>Towed to ${esc(S.portName(r.port))}</h2><p class="say">${esc(r.story)}</p><p>${S.fmtDays(r.days)} later and ${S.fmtMoney(r.cost)} poorer, you are docked. ${state.debt > 0 ? esc(TEXT.events.ledgerDebt) : ''}</p><div class="btns"><button class="btn primary" id="m-ok">Carry on</button></div>`, m => m.querySelector('#m-ok').addEventListener('click', closeModal));
  save();
}
function showStory(name, text){
  const paras = String(text).split(/\n+/).map(p => `<p class="say">${esc(p)}</p>`).join('');
  openModal(`<h2>${esc(storyTitle(name))}</h2>${paras}<div class="btns"><button class="btn primary" id="m-ok">Close</button></div>`, m => m.querySelector('#m-ok').addEventListener('click', closeModal));
}
function storyTitle(name){ return { cometCaught: "Merrow's Comet", chimeArrival: 'Chime', mossbackHeartbeat: 'Mossback', hushRelic: 'Hush', lanternArrival: 'The Far Lantern', tollGiftLater: 'A parcel from the Scatter' }[name] ?? 'A note in the log'; }
function confirmNew(){
  openModal(`<h2>Start over?</h2><p>This save is replaced by a fresh ship at Tessel. There is one save slot.</p><div class="btns"><button class="btn" id="m-no">Keep playing</button><button class="btn danger" id="m-yes">New game</button></div>`, m => {
    m.querySelector('#m-no').addEventListener('click', closeModal);
    m.querySelector('#m-yes').addEventListener('click', () => { closeModal(); state = S.newGame(freshSeed()); save(); selectedNode = -1; lastDockedMode = null; replan(true); renderTabs(); backToShip(); tutorialCheck(); });
  });
}

/* ------------------------------------------------------------- toasts */

function toast(text, kind = '', ms = 4200){
  if(!text) return;
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
  while($('toasts').children.length > 4) $('toasts').firstChild.remove();
}

/* ------------------------------------------------------------- tutorial */

/* The lesson is the first delivery: the orbit you open in, out to Pip, the
   nearest moon. There is no casting off to do — the game starts in flight —
   so step one is the first thing a player actually has to decide. It watches
   the state rather than the clicks, so doing a step your own way still
   counts, and it steps out of the way the moment you are tied up. */
const TUT = TEXT.tutorial;
const FIRST_TARGET = S.FIRST_DELIVERY.to;
function tutorialCheck(){
  if(state.flags.tutorial >= TUT.length || state.flags.tutorialSkipped){ $('tut').hidden = true; return; }
  let step = state.flags.tutorial;
  const target = FIRST_TARGET;
  const marked = state.nodes.length > 0;
  const pushed = state.nodes.some(n => Math.abs(n.prograde) > 1e-9 || Math.abs(n.radial) > 1e-9);
  const reaches = prediction?.events.some(e => e.kind === 'soi' && e.to === target);
  /* Tied up at the far end is the whole lesson, however you got there — by the
     steps below, or by being towed. Checking it first means the card cannot
     sit there telling you to do a thing you have done. */
  if(state.dockedAt === target){
    state.flags.tutorial = TUT.length;
    $('tut').hidden = true;
    if(!state.flags.tutorialDone){ state.flags.tutorialDone = true; toast('Lesson done. The rafts are yours to hop.', 'story'); }
    return;
  }
  if(step === 0 && marked) step = 1;
  if(step === 1 && pushed) step = 2;
  if(step === 2 && reaches) step = 3;
  if(step === 3 && state.ship.body === target) step = 4;
  if(step >= 1 && !marked && !reaches && state.ship.body !== target && !state.dockedAt) step = 0;
  if(step === 3 && !reaches && state.ship.body !== target) step = 2;
  state.flags.tutorial = step;
  if(step >= TUT.length){ $('tut').hidden = true; return; }
  const s = TUT[step];
  $('tut').hidden = false;
  $('tut-step').textContent = `Lesson · ${step + 1} of ${TUT.length}`;
  $('tut-title').textContent = s.title;
  $('tut-body').textContent = s.body;
}
$('tut-skip').addEventListener('click', () => { state.flags.tutorialSkipped = true; $('tut').hidden = true; save(); });
setInterval(() => { if(!$('tut').hidden) tutorialCheck(); }, 1500);

/* ------------------------------------------------------------- boot */

$('grab').addEventListener('click', () => togglePanel(false));
$('grab').setAttribute('role', 'button');
$('grab').setAttribute('tabindex', '0');
$('grab').setAttribute('aria-label', 'Close the panel');
$('grab').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); togglePanel(false); } });

renderTabs();
togglePanel(panelOpen);
replan(true);
backToShip();
syncView();
setRate(state.warp ?? 1);
tutorialCheck();
if(state.pending?.kind === 'toll') showToll(state.pending);
if(state.pending?.kind === 'crash') showCrash(state.pending.body);
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); else last = performance.now(); });
</script>
</body>
