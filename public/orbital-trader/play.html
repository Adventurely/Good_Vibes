  .padout{ display:grid; grid-template-columns:auto 1fr; gap:.1rem .8rem; margin:.5rem 0 .4rem; font-variant-numeric:tabular-nums; }
  .padout dt{ color:var(--dim); font-size:.78rem; } .padout dd{ margin:0; text-align:right; }
  @media (prefers-reduced-motion: reduce){ .pv:active{ transform:none; } }
  #log{ list-style:none; margin:0; padding:0; font-size:.84rem; }
  #log li{ padding:.3rem 0; border-bottom:1px solid var(--line); color:var(--dim); }
  #log li b{ color:var(--faint); font-weight:500; font-variant-numeric:tabular-nums; margin-right:.4rem; }
  #log li.story{ color:var(--ink); }
  .empty{ color:var(--faint); font-style:italic; }
  select{ font:inherit; background:var(--gv-sunk); color:var(--ink); border:1px solid var(--line-2); border-radius:8px; padding:.35rem .5rem; width:100%; }

  /* ---- Toasts, modal, tutorial ---------------------------------------- */
  #toasts{ position:fixed; left:50%; top:72px; transform:translateX(-50%); z-index:8; display:flex; flex-direction:column; gap:.4rem; align-items:center; pointer-events:none; width:min(92vw, 520px); }
  .toast{ background:var(--glass-2); border:1px solid var(--line-2); border-radius:10px; padding:.5rem .8rem; color:var(--ink); font-size:.88rem; box-shadow:var(--gv-shadow); animation:toast .25s ease; max-width:100%; }
  .toast.story{ border-color:var(--gold-2); }
  .toast.bad{ border-color:var(--bad); }
  @keyframes toast{ from{ opacity:0; transform:translateY(-6px);} }

  /* A popup over a chart should not put the chart away. These sit on the sky
     at three-quarters opacity with a blur behind them, so the road you tapped
     is still visible under the question you are being asked. */
  dialog{
    background:rgba(12,15,22,.72); color:var(--ink); border:1px solid var(--line-2); border-radius:14px;
    padding:1.1rem 1.25rem; width:min(92vw, 420px); backdrop-filter:blur(14px) saturate(1.1);
    box-shadow:0 18px 50px -18px #000;
    /* Down at the bottom, near the thumb and clear of the sky you just
       tapped: a question about a point on the chart should not sit on top of
       the point. */
    margin:auto auto max(1rem, env(safe-area-inset-bottom));
  }
  dialog::backdrop{ background:rgba(0,0,0,.28); backdrop-filter:blur(1px); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--dim); }
  .btn.ghost:hover{ color:var(--ink); border-color:var(--line-2); }
  dialog h2{ margin:0 0 .5rem; font-size:1.15rem; }
  dialog p{ color:var(--dim); margin:.4rem 0; }
  dialog p.say{ color:var(--ink); font-style:italic; border-left:2px solid var(--gold-2); padding-left:.7rem; }
  dialog .btns{ margin-top:1rem; justify-content:flex-end; }


  /* Centred on the chart rather than on the window, so that with the panel
     open they do not slide under it. */
  body.panel-open #tut{
    left: calc(50% - (var(--panel-w) + 1.6rem) / 2);
  }

  #tut{
    position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:7;
    width:min(92vw, 440px); background:var(--glass-2); border:1px solid var(--gold-2); border-radius:12px;
    padding:.7rem .9rem; box-shadow:var(--gv-shadow);
  }
  #tut small{ color:var(--gold-ink); letter-spacing:.14em; text-transform:uppercase; font-size:.66rem; }
  #tut h3{ margin:.15rem 0 .2rem; font-size:1rem; padding-right:1.6rem; }
  #tut p{ margin:0; color:var(--dim); font-size:.88rem; }
  #tut .btns{ margin-top:.5rem; justify-content:flex-end; }
  #tut[hidden]{ display:none; }
  /* Fold it away. Theo is good company and still in the way of the sky, so
     the card keeps its name and its number and loses everything else — one
     tap to put it down, one to pick it up, and it stays where you left it. */
  #tut-min{
    position:absolute; top:.35rem; right:.4rem; width:26px; height:26px; line-height:1;
    border:1px solid transparent; border-radius:8px; background:transparent;
    color:var(--dim); cursor:pointer; font-size:1.1rem;
  }
  #tut-min:hover{ color:var(--ink); border-color:var(--line-2); }
  #tut.min{ width:auto; max-width:min(92vw, 440px); padding:.35rem 2.2rem .35rem .7rem; cursor:pointer; }
  #tut.min h3{ font-size:.86rem; margin:.1rem 0 0; }
  #tut.min p, #tut.min .btns{ display:none; }

  #back{ position:fixed; left:.8rem; top:calc(46px + env(safe-area-inset-top)); z-index:5; color:var(--faint); font-size:.78rem; text-decoration:none; }
  #back:hover{ color:var(--ink); }

  /* Phone. The chart is the point, so nothing may stack on top of it: the HUD
     is two tight rows, the clock and the view buttons share one strip
     under them, the panel is a sheet that starts closed, and the cards that
     matter sit along the bottom where a thumb is. */
  @media (max-width: 760px){
    :root{ --panel-w:100%; }
    #hud{ gap:.15rem .6rem; padding:.3rem .6rem; padding-top:max(.3rem, env(safe-area-inset-top)); }
    .stat small{ font-size:.6rem; letter-spacing:.08em; }
    .stat b{ font-size:.82rem; }
    #dvbar{ width:64px; height:4px; }
    #where{ flex:1 1 8rem; text-align:left; }
    #where b, #dockhint{ font-size:.78rem; }
    /* Two rows is the budget; the back link moves into the Shipyard tab. */
    #back{ display:none; }

    #view{
      top:calc(74px + env(safe-area-inset-top)); bottom:auto; right:.4rem;
      flex-direction:column; gap:.25rem;
    }
    #view button{ width:32px; height:30px; border-radius:8px; font-size:.95rem; }
    /* Only the panel toggle stays on top; the rest tuck under it in a column
       that the chart can still be seen around. */
    #view button:not(#v-panel){ opacity:.85; }

    #panel{
      top:auto; left:0; right:0; bottom:0; width:100%; height:min(64vh, 560px);
      border-radius:16px 16px 0 0; border-bottom:0;
      padding-bottom:env(safe-area-inset-bottom);
    }
    #panel.closed{ transform:translateY(100%); opacity:1; pointer-events:none; }
    #grab{ display:block; width:44px; height:5px; border-radius:3px; background:var(--line-2); margin:.45rem auto 0; }

    /* Bottom cards, stacked: the docking card closest to the thumb. */
    #tut{ left:.5rem; right:.5rem; transform:none; width:auto; bottom:calc(.6rem + env(safe-area-inset-bottom)); }
    #tut p{ font-size:.84rem; }
    #toasts{ top:calc(112px + env(safe-area-inset-top)); width:calc(100vw - 1rem); }

    /* When the sheet is up it owns the bottom of the screen. */
    body.sheet #tut{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    #panel, .toast{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<canvas id="chart" aria-label="The navigation chart: the Lamp, its worlds, and your ship's predicted path." role="img"></canvas>

<header id="hud" aria-live="off">
  <div class="stat" id="h-dv-wrap"><small>Fuel</small><b id="h-dv">—</b><div id="dvbar"><i id="h-dvfill"></i></div></div>
  <div class="stat"><small>Coin</small><b id="h-money">—</b></div>
  <div class="stat"><small>Hold</small><b id="h-hold">—</b></div>
  <div class="stat" id="clock-stat" hidden><small>Clock</small><b id="h-warp">—</b></div>
  <div class="stat" id="where"><small>Where</small><b id="h-where">—</b><span id="dockhint"></span></div>
</header>
<a id="back" href="./">&larr; title</a>

<div id="view">
  <button id="dock-go" hidden title="Dock (d)" aria-label="Dock here"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.4"/><path d="M12 10.4 V20"/><path d="M8 13.5 H16"/><path d="M5 15.5 a7 7 0 0 0 14 0"/></svg></button>
  <button id="v-fit" title="Back to your ship, and frame it (f)">&#9678;</button>
  <button id="v-panel" title="Show or hide the panel (p)" aria-pressed="true">&#9776;</button>
</div>

<aside id="panel" aria-label="Ship and port">
  <div id="grab"></div>
  <div id="tabs" role="tablist"></div>
  <div id="tabbody" role="tabpanel" tabindex="0"></div>
</aside>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>

</div>

<div id="tut" hidden>
  <button id="tut-min" title="Fold it away" aria-label="Fold this message away" aria-expanded="true">&#8211;</button>
  <small id="tut-step"></small>
  <h3 id="tut-title"></h3>
  <p id="tut-body"></p>
  <div class="btns"><button class="btn sm" id="tut-skip">Stop writing, Theo</button></div>
</div>

<dialog id="modal"></dialog>

<script type="module">
import { createChart, PALETTE, locateOnPrediction, fmtAu, bodyColour } from './render.js';
import * as S from './sim.js';
import { CONST, PORTS, GOODS, UPGRADES, TEXT, SPECIES, GLOSSARY, BELT_ROCKS, ARC_DEBRIS } from './content.js';
import { segmentApses, norm, sub, add, unit, dist, absState, elementsFromState } from './orbit.js';

const world = S.world;
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SAVE_KEY = 'ot:save:v1';

/* ------------------------------------------------------------- state */

const params = new URLSearchParams(location.search);
let state = null;
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return S.restore(raw);
  }catch(e){ console.warn('Save could not be read:', e); }
  return null;
}
function save(){
  if(!state) return;
  try{ localStorage.setItem(SAVE_KEY, S.serialize(state)); }catch{ /* private window, full disk: play on */ }
}
/* A seed can be named in the address. It decides the ship's name and every
   roll the game will ever make, so two people with the same seed see the same
   offers — which is what makes a strange one reportable, and what lets the
   tests fly the same lesson twice. */
function freshSeed(){
  const asked = Number(params.get('seed'));
  return Number.isFinite(asked) && asked > 0 ? Math.floor(asked) : ((Date.now() % 100000) | 1);
}
if(params.has('new') || params.has('seed')){
  state = S.newGame(freshSeed());
  if(!params.has('seed')) history.replaceState(null, '', location.pathname);
}else{
  state = loadSave() || S.newGame(freshSeed());
}

/* ------------------------------------------------------------- chart */

const canvas = $('chart');
const chart = createChart(canvas, world, { reducedMotion: reduced });
/* The strips the HUD, the chart controls and the panel own. Labels keep out
   of them; the dots still show through. */
function refreshInsets(){
  const h = $('hud').getBoundingClientRect().height;
  const wide = innerWidth > 760;
  chart.labelInsets = {
    top: Math.round(h + 6 + (wide ? 0 : 44)),
    right: Math.round(panelOpen && wide ? $('panel').getBoundingClientRect().width + 24 : 56),
    bottom: Math.round(wide ? 24 : 12),
    left: 8,
  };
}
addEventListener('resize', refreshInsets);
const belt = { inner: CONST.BELT.inner, outer: CONST.BELT.outer, rocks: BELT_ROCKS, debris: ARC_DEBRIS };
addEventListener('resize', () => chart.resize());

let prediction = null, nodePositions = [], apses = [], predictedAt = -1, predictedReal = -1e9;
let selectedNode = -1;
let panelOpen = innerWidth > 760;
let tab = null;

/* How far ahead the *solver* is allowed to look. The drawn road is a
   different question entirely: see S.planImmediate, which shows the orbit you
   are on and the one thing that happens next, and nothing after that. */
function horizonFor(){
  const b = world.get(state.ship.body);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  let h = 0;
  if(Number.isFinite(el.period)) h = Math.max(h, Math.min(el.period * 2.2, 900));
  else h = Math.max(h, 120);
  if(state.nodes.length) h = Math.max(h, state.nodes[state.nodes.length - 1].t - state.t + Math.max(90, Number.isFinite(el.period) ? el.period : 0));
  if(b.id === 'lamp') h = Math.max(h, 900);
  return Math.min(h, 5000);
}

function replan(force = false){
  if(state.dockedAt){ prediction = null; nodePositions = []; apses = []; return; }
  /* Re-solving the whole road is the most expensive thing this page does, so
     it happens on a real-time budget rather than a game-time one: at most a few
     times a second, whatever the warp. Measuring it in game days got it wrong
     in both directions — a stray factor of sixty once let the drawn road go
     stale for four hundred days at the top warp, and taking the factor out
     made it re-solve so often at ×1 that the frame rate, and with it the
     clock, dropped to a third of real time. */
  const nowReal = performance.now();
  if(!force && predictedAt >= 0 && nowReal - predictedReal < 280) return;
  predictedReal = nowReal;
  predictedAt = state.t;
  /* A burn that is written down is on the chart whether or not it is open:
     the white road runs up to it and the yellow road carries on from it. With
     nothing written down at all there is one road, a whole lap of the orbit
     the ship is actually on. */
  prediction = S.planImmediate(state);
  if(!prediction){ nodePositions = []; apses = []; return; }
  nodePositions = state.nodes.map(n => locateOnPrediction(world, prediction, n.t));
  /* The low point and the high point of every closed leg on the drawn road.
     A near-circular heliocentric orbit has no meaningful pair — its two apses
     are a hair apart and the labels sit on top of each other — so it keeps
     neither. */
  const ic = prediction.intercept;
  interceptLabel = ic
    ? (ic.grazes
        ? `hits ${S.portName(ic.body)}`
        : `${S.portName(ic.body)} ${fmtAu(ic.altitude)} · ${S.fmtKms(ic.speed)}${ic.inMouth ? ' · in docking range' : ''}`)
    : null;
  /* The window in the corner already says whose encounter it is, so its line
     is the numbers only. */
  insetLabel = ic
    ? (ic.grazes
        ? 'this path hits it'
        : `${fmtAu(ic.altitude)} · ${S.fmtKms(ic.speed)}${ic.inMouth ? ' · in docking range' : ''}`)
    : null;
  apses = [];
  prediction.segments.forEach((seg, i) => {
    const b = world.get(seg.body);
    if(b.id === 'lamp' && seg.elements.e < 0.05) return;
    for(const a of segmentApses(seg, b.mu)){
      apses.push({ segIndex: i, ...a, label: `${a.kind === 'periapsis' ? 'Low' : 'High'} ${fmtAu(Math.max(0, a.distance - (b.radius ?? 0)))}` });
    }
  });
}

/* ------------------------------------------------------------- loop */

let last = performance.now();
let saveTimer = 0;
let firstStoryDone = false;
let lockedTo = null;
/* The one number the on-chart editor shows. Recomputed when the burn changes,
   not every frame: solving what a mark costs is not free. */
let nodeLabel = null, nodeLabelKey = '', interceptLabel = null, insetLabel = null;
function refreshNodeLabel(){
  const n = state.nodes[selectedNode];
  if(!n || state.dockedAt){ nodeLabel = null; nodeLabelKey = ''; return; }
  const key = `${selectedNode}|${n.prograde}|${n.radial}|${n.t}`;
  if(key === nodeLabelKey) return;
  nodeLabelKey = key;
  const m = S.markStates(state, horizonFor())[selectedNode];
  nodeLabel = `${S.fmtKms(m?.cost ?? 0)} · in ${S.fmtDays(n.t - state.t)}`;
}
function frame(now){
  const real = Math.min(0.1, (now - last) / 1000);
  last = now;
  const dt = S.dtForFrame(state, real);
  if(dt > 0){
    const wasDocked = state.dockedAt;
    const events = S.tick(state, dt);
    handleEvents(events);
    if(!wasDocked && state.dockedAt) replan(true);
    else if(events.length) replan(true);
    else replan(false);
  }
  /* Crossing into a moon's reach changes what the chart is about by four
     orders of magnitude. The lock follows it; so must the zoom, or the new
     orbit is a dot or a wall. */
  /* Crossing into a moon's reach changes what the chart is about by four
     orders of magnitude: come back to the ship and re-frame, or the player is
     left looking at a world they have just left. */
  if(state.ship.body !== lockedTo){
    lockedTo = state.ship.body;
    /* Through focus, not by setting the lock: a pan is an offset from the
       thing you were looking at, and four orders of magnitude ago is not a
       place to keep looking from. */
    chart.focus('ship', null, false);
    replan(true);
    frameShipOrbit();
  }
  saveTimer += real;
  if(saveTimer > 30){ saveTimer = 0; save(); }
  refreshNodeLabel();
  const docking = state.dockedAt ? null : S.dockingStatus(state);
  /* A harbour in sight ends a skip once, so you are awake for the arrival. */
  if(docking && (docking.ok || docking.inZone) && state.warp > 1 && !state.flags.zoneWarpDropped){ stopSkip(); state.flags.zoneWarpDropped = true; }
  if(!docking) state.flags.zoneWarpDropped = false;
  if(state.dockedAt) warpTarget = null;
  if(warpTarget != null && state.t >= warpTarget) stopSkip();
  const shipAbs = state.dockedAt ? { r: absState(world, state.dockedAt, state.t).r, v: absState(world, state.dockedAt, state.t).v } : { r: S.shipAbsPos(state), v: S.shipAbsVel(state) };
  chart.draw({
    t: state.t, now, shipAbs, shipBody: state.ship.body, docked: !!state.dockedAt,
    prediction, nodes: state.nodes, nodePositions, selectedNode, apses,
    editing: selectedNode >= 0 && !!state.nodes[selectedNode],
    shipLocalV: state.dockedAt ? null : state.ship.v,
    nodeLabel, interceptLabel, insetLabel,
    belt, nearPort: docking?.port ?? null, docking,
  });
  renderHud(docking);
  renderDockCard(docking);
  refreshRecentre();
  requestAnimationFrame(frame);
}

function handleEvents(events){
  for(const e of events){
    if(e.kind === 'soi' || e.kind === 'burn') stopSkip();
    if(e.kind === 'burn') { save(); toast(`Burned ${S.fmtKms(e.magnitude)}.`); if(tab === 'plan') renderTab(); }
    if(e.kind === 'short') toast(`The tank ran short: ${S.fmtKms(e.got)} of ${S.fmtKms(e.wanted)}.`, 'bad');
    /* A change of reach re-frames the chart, re-draws the road and changes
       every number on the Plan card. The panel has to be told, or it sits
       there naming the world you just left. */
    if(e.kind === 'soi'){ const to = world.get(e.to); toast(`Now in ${to.name}'s gravity.`); renderTab(); tutorialCheck(); }
    if(e.kind === 'story') toast(e.text, 'story', 9000);
    if(e.kind === 'toll'){ stopSkip(); showToll(e.pending); }
    if(e.kind === 'crash'){ stopSkip(); showCrash(e.body); }
    if(e.kind === 'dry'){ stopSkip(); toast(TEXT.captainLines.onStranded[1] ?? 'The tank is dry.', 'bad', 8000); if(tab === 'plan') renderTab(); }
    if(e.kind === 'late') toast(`${e.contract.title}: you are late.`, 'bad');
    if(e.kind === 'missed'){ toast(e.count > 1 ? `${e.count} burns went by unspent.` : 'That burn went by unspent.', 'bad'); if(tab === 'plan') renderTab(); }
  }
}

/* ------------------------------------------------------------- HUD */

function renderHud(docking){
  $('h-dv').textContent = `${S.fmtKms(state.dv)} / ${S.fmtKms(state.tank)}`;
  const fill = $('h-dvfill');
  const frac = state.tank > 0 ? state.dv / state.tank : 0;
  fill.style.width = `${Math.round(frac * 100)}%`;
  fill.classList.toggle('low', frac < 0.15);
  $('h-dv-wrap').classList.toggle('warn', frac < 0.15);
  $('h-money').textContent = S.fmtMoney(state.money) + (state.debt > 0 ? ` (owe ${S.fmtMoney(state.debt)})` : '');
  $('h-hold').textContent = `${S.usedUnits(state)} / ${S.holdUnits(state)}`;
  /* The clock says what it is doing, not what rung it is on: held, running,
     or running itself somewhere with the seconds left to sit through. */
  /* The clock only speaks up when it is doing something worth saying. A
     running clock is the ordinary state of the game and "running" was a word
     that never changed anything; held and skipping are the two a pilot has to
     know about, so the stat appears for those and is not there otherwise. */
  const clockWord = state.paused ? 'held'
    : warpTarget != null ? `skipping · ${Math.max(1, Math.round((warpTarget - state.t) / (CONST.BASE_RATE_DAYS_PER_SEC * S.warpRate(state))))}s`
    : null;
  $('clock-stat').hidden = clockWord == null;
  if(clockWord != null) $('h-warp').textContent = clockWord;
  const b = world.get(state.ship.body);
  $('h-where').textContent = state.dockedAt ? `Docked at ${S.portName(state.dockedAt)}` : `In ${b.name}'s gravity`;
  const hint = $('dockhint');
  if(!docking){ hint.textContent = ''; return; }
  const pb = world.get(docking.port);
  if(docking.ok){ hint.textContent = ` · ${pb.name} will take your lines`; hint.className = ''; return; }
  hint.className = 'far';
  if(docking.kind === 'orbit'){
    hint.textContent = !docking.bound ? ` · ${pb.name}: not in orbit`
      : !docking.clear ? ` · ${pb.name}: that orbit goes through it`
      : ` · ${pb.name}: bring the high point inside ${fmtAu(docking.mouth)}`;
  }else{
    hint.textContent = docking.inZone
      ? ` · ${pb.name}: ${S.fmtKms(docking.over)} too fast`
      : ` · ${pb.name} ${fmtAu(docking.distance)} off`;
  }
}

/* Tie up. The icon is there when a stable orbit close in makes it possible
   and gone otherwise, so it is a thing you have earned rather than a card
   that follows you round the sky listing what you have not done. */
function renderDockCard(docking){
  $('dock-go').hidden = !(docking && docking.ok && !state.dockedAt);
}

/* ------------------------------------------------------------- time */

/* There is no ladder of speeds to climb, and nothing to hold down. The clock
   runs at ×1 — ten real minutes to a lap of the low orbit a new game opens
   in, and longer for everything else in the sky — until you point at
   somewhere on your road and say go. Then it runs at whatever rate covers
   that stretch in about ten seconds and stops itself on arrival.
   Anything that matters on the way (a burn, a change of reach, a harbour
   mouth) cancels the skip, because the whole point of skipping is to be
   awake for the parts that are not a coast. */

let warpTarget = null;
function setRate(mult){
  state.warp = Math.max(1, Math.min(CONST.MAX_WARP, mult));
}
function stopSkip(){ warpTarget = null; setRate(1); }
/* There is no pause button any more: the menu is the pause. Opening it is
   already what a player does when they want to stop and read something, and
   the Clock stat in the bar says which it is. Space still works. */
function setPaused(on){
  if(state.paused === !!on) return;
  state.paused = !!on;
  if(state.paused) warpTarget = null;
  setRate(state.paused ? 1 : state.warp);
}

/* Run to a moment and stop just short of it. The rate is chosen once, from
   the whole distance, so the ten seconds it promised are the ten seconds it
   takes; a crossing part way through simply ends the skip. */
function skipTo(t){
  const plan = S.skipPlan(state, t);
  if(!plan) return false;
  warpTarget = plan.t - Math.min(0.02, plan.days * 0.02);
  state.paused = false;
  setRate(plan.rate);
  return true;
}

/* The confirmation. It says where, when, and how long you will be sitting
   there — which is the only question a skip actually raises. */
function saySeconds(sec){
  if(sec < 1.5) return 'a moment';
  if(sec < 90) return `about ${Math.round(sec)} seconds`;
  return `about ${Math.round(sec / 60)} minutes`;
}
function whereAt(t){
  if(!prediction) return null;
  const seg = prediction.segments.find(sg => t >= sg.t0 - 1e-9 && t <= sg.t1 + 1e-9) ?? prediction.segments[prediction.segments.length - 1];
  return seg ? world.get(seg.body) : null;
}
function askSkip(t, what){
  const plan = S.skipPlan(state, t);
  if(!plan){ toast('That is not ahead of you.', 'bad'); return; }
  const place = whereAt(t);
  openModal(`<h2>Skip ahead?</h2>
    <p>${esc(what ?? 'That point on your path')} is <b>${S.fmtDays(plan.days)}</b> from now${place ? `, in ${esc(place.name)}'s gravity` : ''}.</p>
    <p class="lock">The clock will run itself there and stop: ${saySeconds(plan.seconds)} of waiting.${plan.capped ? ' That is as fast as the clock goes.' : ''}</p>
    <div class="btns"><button class="btn primary" id="m-go">Go</button><button class="btn ghost" id="m-stay">Close</button></div>`, m => {
    m.querySelector('#m-go').addEventListener('click', () => { closeModal(); skipTo(t); });
    m.querySelector('#m-stay').addEventListener('click', closeModal);
  });
}

/* Tapping the road is how both of the things you can do to it start: write a
   burn down at that moment, or skip the clock to it. One gesture, two big
   buttons, and the time to that point on the card either way. */
function askAtPath(t){
  const room = state.nodes.length < S.MAX_NODES;
  const plan = S.skipPlan(state, t);
  const place = whereAt(t);
  openModal(`<h2>${S.fmtDays(Math.max(0, t - state.t))} along your path</h2>
    <div class="btns">
      <button class="btn" id="m-skip" ${plan ? '' : 'disabled'}>Warp here</button>
      <button class="btn primary" id="m-burn" ${room ? '' : 'disabled title="Six is plenty for one path."'}>Plan a burn</button>
      <button class="btn ghost" id="m-close">Close</button>
    </div>`, m => {
    m.querySelector('#m-close').addEventListener('click', closeModal);
    m.querySelector('#m-burn').addEventListener('click', () => {
      closeModal();
      const ix = S.addNode(state, t);
      if(ix < 0){ toast('No room for another burn on this path.', 'bad'); return; }
      /* The chart is the editor, so writing a burn down leaves the panel
         exactly as it was: shoving the side menu open over the sky is the
         opposite of what somebody who just tapped the sky wanted. */
      selectedNode = ix; holdForPlanning(ix); replan(true);
      if(tab === 'plan') renderTab();
      tutorialCheck(); save();
    });
    m.querySelector('#m-skip').addEventListener('click', () => { closeModal(); skipTo(t); });
  });
}

/* ------------------------------------------------------------- view */

$('v-fit').addEventListener('click', () => backToShip(true));
$('v-panel').addEventListener('click', () => togglePanel());
/* The view is locked; there is nothing to keep in sync but the panel. */
function syncView(){}
/* `quiet` is for the times the layout moves the panel on its own — the first
   paint and a resize. Only a person opening it stops the clock. */
function togglePanel(open = !panelOpen, quiet = false){
  panelOpen = open;
  if(!quiet) setPaused(open);
  $('panel').classList.toggle('closed', !panelOpen);
  $('v-panel').setAttribute('aria-pressed', String(panelOpen));
  // On a phone the sheet covers the bottom of the chart, so the cards that
  // live there stand down while it is up.
  document.body.classList.toggle('sheet', panelOpen && innerWidth <= 760);
  document.body.classList.toggle('panel-open', panelOpen && innerWidth > 760);
  applyOffset();
}
/* The panel covers part of the chart, so shift the follow centre out from
   under it: left on a wide screen, up when it is a sheet across a phone. */
function applyOffset(){
  refreshInsets();
  if(!panelOpen){ chart.offset = [0, 0]; return; }
  const r = $('panel').getBoundingClientRect();
  chart.offset = innerWidth > 760 ? [-r.width / 2 - 8, 0] : [0, -Math.min(r.height, innerHeight * 0.62) / 2];
}
// A window that changes width changes which layout it is in, so the classes
// that depend on the width have to be worked out again.
addEventListener('resize', () => togglePanel(panelOpen, true));

/* ------------------------------------------------------------- input */

/* How far a finger may slide on the way to a tap before the gesture is a drag
   instead. Below it, a slightly wobbly press on a road is still a press on
   that road; above it, the sky follows the finger. */
const TAP_SLOP = 6;

/* The chart can now be dragged away from what it is locked to, so it has to
   say when it has been. The cue is on the button that undoes it, and it lights
   only once the view is properly off — a few pixels of drift while placing a
   burn is not being lost. */
let recentreShown = false;
function refreshRecentre(){
  const off = chart.panned() > 0.03;
  if(off === recentreShown) return;
  recentreShown = off;
  $('v-fit').classList.toggle('off', off);
  $('v-fit').title = off
    ? 'Back to your ship, and frame it (f) — the chart has been dragged off its lock'
    : 'Back to your ship, and frame it (f)';
}

let drag = null;
let pinch = null;
const pointers = new Map();
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
    canvas.classList.remove('grab');
    drag = null; return;
  }
  const hit = chart.hitTest(e.clientX, e.clientY);
  if(hit?.kind === 'inset'){ lookAtEncounter(); drag = null; return; }
  if(hit?.kind === 'handle'){
    if(hit.axis === 'delete'){
      S.removeNode(state, hit.index); selectedNode = -1; replan(true); renderTab(); save();
      drag = null; return;
    }
    drag = { kind: 'arrow' };
    pushAxis(hit.index, hit.axis);
    startRepeat(hit.index, hit.axis);
    return;
  }
  if(hit?.kind === 'node'){
    selectedNode = selectedNode === hit.index ? -1 : hit.index;
    drag = { kind: 'node', index: hit.index, x: e.clientX, y: e.clientY, moved: false };
    replan(true); if(tab === 'plan') renderTab();
    return;
  }
  /* Empty sky is a pan. It stays a tap until the finger has actually gone
     somewhere — a few pixels of slide on the way to tapping a road is not a
     drag — and from then on it drags the sky, measured from whatever the
     chart is locked to rather than from the stars. */
  drag = { kind: 'pan', x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, hit };
});
canvas.addEventListener('pointermove', e => {
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pinch && pointers.size === 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    // Two fingers do both at once: the gap is the scale, the middle is the pan.
    if(d > 0 && pinch.d > 0) chart.zoomBy(d / pinch.d, m);
    chart.panBy(m[0] - pinch.m[0], m[1] - pinch.m[1]);
    pinch.d = d; pinch.m = m; return;
  }
  if(!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(drag.kind === 'pan'){
    if(!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > TAP_SLOP){
      drag.moved = true;
      canvas.classList.add('grab');
    }
    if(drag.moved) chart.panBy(dx, dy);
    drag.x = e.clientX; drag.y = e.clientY;
    return;
  }
  if(drag.kind === 'node'){
    if(Math.hypot(dx, dy) > 4) drag.moved = true;
    if(!drag.moved || !prediction) return;
    const p = chart.nearestPathPoint(e.clientX, e.clientY, prediction, state.t);
    if(p){
      const n = state.nodes[drag.index];
      // Only slide within the leg the node is on, so it cannot jump past a later node.
      const later = state.nodes.find((o, i) => i !== drag.index && o.t > n.t);
      const earlier = [...state.nodes].reverse().find((o, i) => state.nodes.indexOf(o) !== drag.index && o.t < n.t);
      let t = p.t;
      if(later) t = Math.min(t, later.t - 1e-3);
      if(earlier) t = Math.max(t, earlier.t + 1e-3);
      n.t = Math.max(state.t + 1e-3, t);
      replan(true); if(tab === 'plan') renderTab();
    }
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  canvas.classList.remove('grab');
  if(!drag) return;
  const d = drag; drag = null;
  if(d.kind === 'pan' && !d.moved){
    /* A tap: the path takes a burn, a body becomes the target, empty sky
       deselects. The path wins ties, because a body's hit disc is a generous
       forty pixels across for fingers and at the zoom you cast off at, the
       whole parking orbit fits inside Tessel's — which made lesson two
       impossible to follow by tapping the road it names. */
    const p = prediction && !state.dockedAt ? chart.nearestPathPoint(e.clientX, e.clientY, prediction, state.t) : null;
    const onBody = d.hit?.kind === 'body';
    const insideDrawn = onBody && d.hit.d <= (d.hit.drawn ?? 0) + 2;
    if(p && !insideDrawn && p.t > state.t + S.MIN_LEAD){ askAtPath(p.t); return; }
    if(onBody){ lookAt(d.hit.id); return; }
    selectedNode = -1; if(tab === 'plan') renderTab();
  }
  if(d.kind === 'node'){ tutorialCheck(); save(); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); chart.zoomBy(Math.pow(1.0015, -e.deltaY), [e.clientX, e.clientY]); }, { passive: false });
canvas.addEventListener('dblclick', e => { const hit = chart.hitTest(e.clientX, e.clientY); if(hit?.kind === 'body') lookAt(hit.id); });

/* A shortcut must never fire while somebody is typing into a control, and must
   never steal a browser's own combination. */
function typing(e){
  const t = e.target;
  if(!t) return false;
  if(t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA' || t.isContentEditable) return true;
  /* Space and Enter belong to whatever the keyboard is on. Taking Space for
     pause meant no button in the game could be pressed without a mouse. */
  return typeof t.closest === 'function' && !!t.closest('button, a[href], [role="button"], [tabindex]');
}
/* One arrow press, in screen pixels: a seventh of the short side of the chart,
   or a fortieth with shift held, so the same key is both a stride and a nudge. */
function panStep(e){ return Math.min(chart.width, chart.height) * (e.shiftKey ? 0.025 : 0.15); }
addEventListener('keydown', e => {
  if(typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  if($('modal').open) return;
  const fine = e.shiftKey ? 0.2 : 1;   // a fraction of one press of the pad
  switch(e.key){
    case ' ': e.preventDefault(); setPaused(!state.paused); break;
    case '+': case '=': chart.zoomBy(1.4); break;
    case '-': case '_': chart.zoomBy(1 / 1.4); break;
    case 'f': backToShip(); break;
    case 'p': togglePanel(); break;
    case 'Escape': if(selectedNode >= 0){ selectedNode = -1; renderTab(); } else togglePanel(false); break;
    case 'Delete': case 'Backspace': if(state.nodes[selectedNode]){ S.removeNode(state, selectedNode); selectedNode = -1; replan(true); renderTab(); } break;
    /* The arrows push the selected burn; with nothing selected they are the
       keyboard's pan, so the chart can be walked around without a pointer.
       Shift makes both of them fine. */
    case 'ArrowRight': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'pro', fine); else chart.panBy(-panStep(e), 0); break;
    case 'ArrowLeft': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'retro', fine); else chart.panBy(panStep(e), 0); break;
    case 'ArrowUp': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'out', fine); else chart.panBy(0, panStep(e)); break;
    case 'ArrowDown': e.preventDefault(); if(state.nodes[selectedNode]) pushAxis(selectedNode, 'in', fine); else chart.panBy(0, -panStep(e)); break;
  }
});

/* Planning is free, and it should not be a race. A mark written down for a
   moment that is nearly here stops the clock, so the pad can be pressed
   before it arrives; anything further off leaves the clock alone. The
   threshold is in real seconds, not game days — at the top warp a fortnight
   goes by while you look at it, and at ×1 a day is the better part of three
   hours. */
const PLAN_HOLD_SECONDS = 25;
function realSecondsTo(t){
  return (t - state.t) / Math.max(1e-12, CONST.BASE_RATE_DAYS_PER_SEC * S.warpRate(state));
}
function holdForPlanning(ix){
  const n = state.nodes[ix];
  if(!n || state.paused) return;
  if(realSecondsTo(n.t) > PLAN_HOLD_SECONDS) return;
  state.paused = true;
  setRate(1);
  toast('Clock held while you plan. Press space to start it again.');
}

/* Frame what the chart is drawing. The view is locked to the world the ship
   is going round, so the only thing left to choose is how much of that world
   fits, and the honest answer is "the road, and a little air around it". A
   parking orbit twenty pixels across inside the planet's own dot is not a
   road anybody can tap; neither is one that runs off all four sides. */
function primaryBody(){
  if(!state.dockedAt) return state.ship.body;
  const b = world.get(state.dockedAt);
  return b.mu > 0 ? state.dockedAt : b.parent;
}
/* How far the drawn road reaches from the body the chart is locked to. This
   is what the zoom is chosen from, so the framing follows the plan: push the
   far side of your orbit out past the moons and the chart pulls back to show
   you that you have. */
function roadSpan(){
  const primary = primaryBody();
  /* Measured from the ship, because that is where the chart is centred: a
     circular orbit seen from a point on it reaches twice its radius across,
     and framing it by the radius puts half the road off the screen. */
  const here = state.ship.body === primary ? state.ship.r : [0, 0];
  let span = 0;
  if(prediction){
    for(const seg of prediction.segments){
      if(seg.body !== primary) continue;
      for(const pt of seg.points) span = Math.max(span, Math.hypot(pt[0] - here[0], pt[1] - here[1]));
    }
  }
  if(span > 0) return span;
  const b = world.get(primary);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  return Number.isFinite(el.ra) ? el.ra * 2 : Math.max(norm(state.ship.r), b.soi ?? 0.01);
}
/* How much of the half-screen the road should fill when the chart frames it,
   and how far it is allowed to drift from that before the chart frames it
   again. The gap between them is the hysteresis: without it, every press of
   the burn pad would nudge the zoom and the sky would never sit still. */
const FRAME_FILL = 0.38, FRAME_SPILL = 0.5, FRAME_SHRINK = 0.16;
function usableHalf(){
  const w = chart.width - (panelOpen && innerWidth > 760 ? $('panel').getBoundingClientRect().width : 0);
  return Math.min(w, chart.height);
}
/* Take the main chart to the encounter the corner window is showing: centre
   on that world and pick a zoom that frames its reach. This is the one place
   the game chooses a scale without being asked for a fit, and it is because
   the player asked for it by tapping the thing. */
function lookAtEncounter(){
  const ic = prediction?.intercept;
  if(!ic) return;
  chart.focus(ic.body, null, false);
  chart.frameBody(ic.body);
  toast(`Looking at ${esc(S.portName(ic.body))}. Press f for your ship.`);
}

/* Come home. Both halves matter: the lock goes back to the ship *and* the
   pan goes back to nothing, so one press undoes any amount of wandering. */
function backToShip(fit = false){ chart.focus('ship', null, false); if(fit) frameShipOrbit(); }
function frameShipOrbit(){
  const span = roadSpan();
  const half = usableHalf();
  if(span > 0 && half > 0) chart.camera.zoom = Math.max(8, Math.min(2e7, half * FRAME_FILL / span));
}

/* Tap a body and the chart centres on it; tap the ship, or press f, to come
   back. Nothing is selected and nothing is aimed at — looking is looking, and
   it never changes the zoom: moving the centre and changing the scale at the
   same time is how you lose track of where you were. The fit button is there
   for when you do want the scale chosen for you. Looking somewhere also ends
   any drag away from the last thing looked at: the new centre is the new
   thing, and the next pan is measured from it. */
function lookAt(id){
  chart.focus(id, null, false);
  toast(`Looking at ${esc(world.get(id).name)}. Press f for your ship.`);
}

/* ------------------------------------------------------------- panel */

const TABS_DOCKED = [['market', 'Market'], ['passengers', 'Passengers'], ['shipyard', 'Shipyard'], ['talk', 'Talk'], ['log', 'Log']];
const TABS_FLIGHT = [['orbit', 'Orbit'], ['plan', 'Burns'], ['ship', 'Ship'], ['log', 'Log']];
let lastDockedMode = null;
function renderTabs(){
  const mode = state.dockedAt ? 'docked' : 'flight';
  if(mode === lastDockedMode) return;
  lastDockedMode = mode;
  const tabs = mode === 'docked' ? TABS_DOCKED : TABS_FLIGHT;
  const bar = $('tabs'); bar.innerHTML = '';
  for(const [id, label] of tabs){
    const b = document.createElement('button');
    b.className = 'tab'; b.role = 'tab'; b.dataset.tab = id; b.textContent = label;
    b.addEventListener('click', () => setTab(id));
    bar.appendChild(b);
  }
  if(!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  setTab(tab, panelOpen);
}
function setTab(id, open = true){
  tab = id;
  [...$('tabs').children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  if(open && !panelOpen) togglePanel(true);
  renderTab();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sp = species => `<span class="sp-${species}">${esc(SPECIES[species]?.name ?? species)}</span>`;

function renderTab(){
  const body = $('tabbody');
  /* Rebuilding the panel throws away the button the player is standing on, and
     the keyboard then lands back on the document. Remember which control it
     was and put it back. */
  const active = document.activeElement;
  const was = body.contains(active) ? (active.dataset?.act ?? active.id ?? null) : null;
  const fn = { market, passengers, shipyard, talk, plan, orbit: orbitTab, ship: shipTab, log: logTab }[tab];
  body.innerHTML = fn ? fn() : '';
  wire(body);
  if(was){
    const again = body.querySelector(`[data-act="${CSS.escape(was)}"]`) ?? body.querySelector(`#${CSS.escape(was)}`);
    if(again && typeof again.focus === 'function') again.focus();
  }
}
function wire(root){
  root.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', ev => {
      // A card is itself an action, and so are the buttons inside it. Only the
      // innermost one should run: deleting a burn used to re-select the burn
      // that had just stopped existing.
      if(ev.target.closest('[data-act]') !== el) return;
      const [act, ...args] = el.dataset.act.split('|');
      actions[act]?.(...args, el);
    });
  });
  root.querySelectorAll('select[data-sel]').forEach(el => {
    el.addEventListener('change', () => actions[el.dataset.sel]?.(el.value));
  });
}

const trend = (price, base) => price > base * 1.12 ? '<span class="up">▲</span>' : price < base * 0.88 ? '<span class="down">▼</span>' : '<span class="flat">•</span>';
const plenty = (state, port, good) => { const m = S.saturationMul(state, port, good); return m >= 0.95 ? '' : ' · ' + S.saturationWords(m); };

function market(){
  const port = state.dockedAt;
  const p = PORTS[port];
  if(!S.portOpen(port, state.t)){
    const days = S.daysToPeriapsis(port, state.t);
    return `<h2>${esc(S.portName(port))}</h2><p class="say">${esc(TEXT.events.wanderwellClosing)}</p><p>The colony stands empty. Back at its low point in ${S.fmtDays(days)}. Tagalong keeps a thin market in the meantime.</p>`;
  }
  const lines = TEXT.ports[port]?.trade ?? [];
  const say = lines.length ? `<p class="say">${esc(lines[Math.floor(S.hash(port, Math.floor(state.t / 3)) * lines.length)])}</p>` : '';
  let out = `<h2>${esc(S.portName(port))} <small class="lock">${sp(p.species)}</small></h2>${say}`;
  const nobody = p.species === 'chorus' || p.species === 'none';
  out += nobody ? '<h3>To be taken</h3>' : '<h3>For sale</h3>';
  const sells = p.sells.map(s => s.good);
  if(!sells.length) out += nobody ? '<p class="empty">Nothing here but the quiet.</p>' : '<p class="empty">Nothing for sale here.</p>';
  for(const gid of sells){
    const g = S.goodById(gid);
    const price = S.buyPrice(state, port, gid);
    const stock = S.stockAvailable(state, port, gid);
    const c1 = S.canBuy(state, gid, 1);
    const lock = g.needsRefrigeration && !state.keys.refrigeration ? '<span class="lock">needs refrigeration</span>' : '';
    const maxQ = Math.min(stock, Math.floor(state.money / price), Math.floor(S.freeUnits(state) / g.units));
    const back = S.restockIn(state, port, gid);
    const restock = stock === 0 && back ? (back === Infinity ? ' · <span class="down">none left, and none coming</span>' : ` · <span class="down">none left; more in ${S.fmtDays(back)}</span>`) : '';
    out += `<div class="row"><div class="name"><b>${esc(g.name)}</b><small>${esc(g.blurb ?? g.category)} · ${stock} in stock${restock} · ${g.units} unit${g.units > 1 ? 's' : ''} each ${lock}</small></div>
      <div class="price">${S.fmtMoney(price)}<small>${trend(price, g.basePrice)} base ${S.fmtMoney(g.basePrice)}</small></div>
      <div class="btns"><button class="btn sm" data-act="buy|${gid}|1" ${c1.ok ? '' : 'disabled title="' + esc(c1.reason) + '"'}>+1</button><button class="btn sm" data-act="buy|${gid}|10" ${maxQ >= 10 ? '' : 'disabled'}>+10</button><button class="btn sm" data-act="buy|${gid}|${maxQ}" ${maxQ > 1 ? '' : 'disabled'}>all</button></div></div>`;
  }
  out += '<h3>Aboard</h3>';
  const aboard = new Map();
  for(const c of state.cargo){ const e = aboard.get(c.good) ?? { qty: 0, oldest: c.t, paid: 0 }; e.qty += c.qty; e.oldest = Math.min(e.oldest, c.t); e.paid += c.price * c.qty; aboard.set(c.good, e); }
  if(!aboard.size) out += '<p class="empty">The hold is empty.</p>';
  for(const [gid, e] of aboard){
    const g = S.goodById(gid);
    const price = S.sellPrice(state, port, gid, e.oldest);
    const wants = p.buys.some(b => b.good === gid) || (g.demandBy?.[p.species] ?? 1) > 1;
    const fr = S.freshness(g, state.t - e.oldest);
    const fresh = g.lifetimeDays ? `<span class="fresh" title="freshness"><i class="${fr > 0.66 ? '' : fr > 0.33 ? 'mid' : 'low'}" style="width:${Math.round(fr * 100)}%"></i></span> ${esc(S.freshnessWords(g, state.t - e.oldest))}` : '';
    const avg = e.paid / e.qty;
    out += `<div class="row"><div class="name"><b>${esc(g.name)}</b><small>${e.qty} aboard · paid ${S.fmtMoney(avg)} each ${fresh}${wants ? ' · <span class="up">wanted here</span>' : ''}${plenty(state, port, gid)}</small></div>
      <div class="price">${S.fmtMoney(price)}<small>${price > avg ? '<span class="up">' : '<span class="down">'}${price >= avg ? '+' : ''}${S.fmtMoney(price - avg)}</span></small></div>
      <div class="btns"><button class="btn sm" data-act="sell|${gid}|1">−1</button><button class="btn sm" data-act="sell|${gid}|10" ${e.qty >= 10 ? '' : 'disabled'}>−10</button><button class="btn sm primary" data-act="sell|${gid}|${e.qty}">all</button></div></div>`;
  }
  const wants = p.buys.map(b => S.goodById(b.good)).filter(g => !aboard.has(g.id));
  if(wants.length){
    out += '<h3>They want</h3><p>' + wants.map(g => `${esc(g.name)} <span class="lock">${S.fmtMoney(S.sellPrice(state, port, g.id))}</span>`).join(' · ') + '</p>';
  }
  return out;
}

function passengers(){
  const port = state.dockedAt;
  const offers = S.refreshOffers(state, port);
  let out = `<h2>Passengers &amp; deliveries</h2>`;
  if(!state.flags.contractsIntro) out += `<p class="say">${esc(TEXT.contractsIntro)}</p>`;
  out += '<h3>Looking for a ship</h3>';
  if(!offers.length) out += '<p class="empty">Nobody is travelling today.</p>';
  for(const c of offers){
    const ok = S.canTake(state, c);
    const days = c.deadline - state.t;
    out += `<div class="row"><div class="name"><b>${esc(c.title)}</b><small>${sp(c.species)} · to ${esc(S.portName(c.to))} · by day ${S.calendar(c.deadline).day} of year ${S.calendar(c.deadline).year} (${S.fmtDays(days)}) · ${c.units} unit${c.units > 1 ? 's' : ''}${c.needs.includes('refrigeration') ? ' · <span class="lock">needs refrigeration</span>' : ''}</small><small><i>“${esc(c.line)}”</i></small></div>
      <div class="price">${S.fmtMoney(c.pay)}</div>
      <div class="btns"><button class="btn sm primary" data-act="take|${c.id}" ${ok.ok ? '' : 'disabled title="' + esc(ok.reason) + '"'}>Take</button></div></div>`;
  }
  out += '<h3>Aboard</h3>';
  if(!state.passengers.length) out += '<p class="empty">No passengers, no parcels.</p>';
  for(const c of state.passengers){
    const days = c.deadline - state.t;
    out += `<div class="row"><div class="name"><b>${esc(c.title)}</b><small>${sp(c.species)} · to ${esc(S.portName(c.to))} · ${days < 0 ? '<span class="down">late</span>' : S.fmtDays(days) + ' left'}</small></div><div class="price">${S.fmtMoney(c.pay)}</div><div class="btns"><button class="btn sm" data-act="target|${c.to}">Target</button></div></div>`;
  }
  return out;
}

function shipyard(){
  const port = state.dockedAt;
  const p = PORTS[port];
  let out = `<h2>${p.shipyard ? 'Shipyard' : 'Dock'}</h2>`;
  out += '<h3>Fuel</h3>';
  const fp = S.fuelPrice(state);
  const room = S.kms(state.tank - state.dv);
  if(fp == null) out += '<p class="empty">No fuel sold here.</p>';
  else{
    out += `<p>${S.fmtMoney(fp)} per km/s · ${room.toFixed(1)} km/s of room.</p><div class="btns">
      <button class="btn" data-act="fuel|1" ${room >= 0.05 && state.money >= fp ? '' : 'disabled'}>+1 km/s</button>
      <button class="btn" data-act="fuel|5" ${room >= 0.05 && state.money >= fp ? '' : 'disabled'}>+5 km/s</button>
      <button class="btn primary" data-act="fuel|999" ${room >= 0.05 && state.money >= fp ? '' : 'disabled'}>Fill (${S.fmtMoney(Math.min(room, state.money / fp) * fp)})</button></div>`;
  }
  out += '<h3>Fitted</h3>';
  const t = state.tiers;
  out += `<dl class="kv"><dt>Tank</dt><dd>${esc(S.tiers('tank')[t.tank].name)} · ${S.fmtKms(state.tank)}</dd><dt>Engine</dt><dd>${esc(S.tiers('engine')[t.engine].name)}</dd><dt>Hold</dt><dd>${esc(S.tiers('hold')[t.hold].name)} · ${S.holdUnits(state)} units</dd>
    <dt>Keys</dt><dd>${['heatShield', 'refrigeration', 'sensors', 'stealth'].filter(k => state.keys[k]).map(k => esc(UPGRADES.find(u => u.key === k)?.name ?? k)).join(', ') || '<span class="lock">none yet</span>'}</dd></dl>`;
  const ups = S.upgradesFor(port);
  if(ups.length){
    out += '<h3>On offer</h3>';
    for(const u of ups){
      const c = S.canBuyUpgrade(state, u.id);
      const owned = S.ownsUpgrade(state, u);
      out += `<div class="row"><div class="name"><b>${esc(u.name)}</b><small>${esc(u.effect)}${u.unlocks ? ' · ' + esc(u.unlocks) : ''}</small></div><div class="price">${owned ? '<span class="lock">fitted</span>' : S.fmtMoney(c.price ?? u.price)}</div>
        <div class="btns">${owned ? '' : `<button class="btn sm primary" data-act="upgrade|${u.id}" ${c.ok ? '' : 'disabled title="' + esc(c.reason) + '"'}>Fit</button>`}</div></div>`;
      if(!owned && !c.ok && c.reason !== 'Not enough coin.') out += `<p class="lock">${esc(c.reason)}</p>`;
    }
  }
  out += '<h3>Wait here</h3><div class="btns"><button class="btn" data-act="wait|1">1 day</button><button class="btn" data-act="wait|10">10 days</button><button class="btn" data-act="wait|30">30 days</button>';
  const ww = S.daysToPeriapsis('wanderwell', state.t);
  out += `<button class="btn" data-act="wait|${ww.toFixed(2)}">Wanderwell's low point (${S.fmtDays(ww)})</button>`;
  if(state.keys.sensors){ const mc = S.daysToPeriapsis('merrow', state.t); out += `<button class="btn" data-act="wait|${mc.toFixed(2)}">Merrow's pass (${S.fmtDays(mc)})</button>`; }
  out += '</div>';
  out += `<button class="btn primary wide" data-act="undock">Undock</button>`;
  /* Being stuck at a dock is still being stuck: a ship with a dry tank at a
     port that sells no fuel needs the same rope as one adrift. */
  if(S.fuelPrice(state) == null || state.dv <= 1e-9){
    out += `<p class="lock">${S.fuelPrice(state) == null ? 'Nothing to burn is sold here.' : 'The tank is dry.'}</p><button class="btn wide" data-act="tow">Call for a tow</button>`;
  }
  out += `<h3>Ship</h3><p>${esc(state.shipName)} · ${state.stats.docks} dockings · ${S.fmtKms(state.stats.dvSpent)} burned in ${state.stats.burns} burns · farthest ${fmtAu(state.stats.farthest)} from the Lamp.</p>`;
  out += `<div class="btns"><button class="btn sm danger" data-act="newgame">New game</button><a class="btn sm" href="./">&larr; Title screen</a></div>`;
  return out;
}

function talk(){
  const port = state.dockedAt;
  const p = PORTS[port];
  const txt = TEXT.ports[port] ?? {};
  const b = world.get(port);
  const k = Math.floor(S.hash(port, Math.floor(state.t / 7)) * 3);
  let out = `<h2>${esc(b.name)} <small class="lock">${sp(p.species)}</small></h2>`;
  out += `<p>${esc(txt.blurb ?? '')}</p>`;
  if(txt.arrival) out += `<p class="say">${esc(txt.arrival[k % txt.arrival.length])}</p>`;
  if(TEXT.species[p.species]?.greeting) out += `<p>${esc(TEXT.species[p.species].greeting)}</p>`;
  if(txt.rumours) out += `<h3>Heard at the dock</h3>` + txt.rumours.map((r, i) => `<p>${i === k % txt.rumours.length ? '<b>' : ''}${esc(r)}${i === k % txt.rumours.length ? '</b>' : ''}</p>`).join('');
  out += '<h3>How they know you</h3><dl class="kv">' + Object.entries(state.rep).map(([s, v]) => `<dt>${sp(s)}</dt><dd>${repWord(v)}</dd>`).join('') + '</dl>';
  out += '<h3>The sky</h3>';
  const ww = S.daysToPeriapsis('wanderwell', state.t);
  const wr = norm(absState(world, 'wanderwell', state.t).r);
  out += `<p>Wanderwell is ${wr.toFixed(2)} au out, ${S.portOpen('wanderwell', state.t) ? 'and the summer market is open' : `and reaches its low point in ${S.fmtDays(ww)}`}.</p>`;
  if(state.keys.sensors) out += `<p>Merrow's Comet passes the Lamp in ${S.fmtDays(S.daysToPeriapsis('merrow', state.t))}.</p>`;
  out += `<h3>Glossary</h3>` + GLOSSARY.slice(0, 16).map(g => `<p><b>${esc(g.term)}</b> <span class="lock">(${esc(g.plain)})</span> — ${esc(g.tip)}</p>`).join('');
  return out;
}
function repWord(v){ return v >= 8 ? 'old friends' : v >= 4 ? 'a known name' : v >= 1.5 ? 'a familiar face' : v <= -2 ? 'unwelcome' : v < 0 ? 'a story going round' : 'a stranger'; }

/* ---------------------------------------------------------- the burn pad */

/* One press of one of the four buttons. `scale` lets the keyboard ask for a
   smaller one (Shift) without inventing a second set of numbers. */
function pushAxis(i, k, scale = 1){
  const n = state.nodes[i];
  const a = AXES[k];
  if(!n || !a) return;
  n[a.axis] += a.sign * scale * S.auDay(stepFor(i) / 1000);
  replan(true);
  if(tab === 'plan') renderTab();
  tutorialCheck();
  save();
}

/* Hold an arrow down and it repeats, slowly at first so a single tap is never
   two, then faster, because pushing a big orbit around takes more than four
   presses and nobody should have to tap forty times. */
let repeat = null;
function stopRepeat(){ if(repeat){ clearTimeout(repeat.timer); repeat = null; } }
function startRepeat(i, axis){
  stopRepeat();
  let n = 0;
  const tick = () => {
    n++;
    pushAxis(i, axis, n > 12 ? 4 : n > 5 ? 2 : 1);
    repeat.timer = setTimeout(tick, n < 3 ? 260 : 90);
  };
  repeat = { timer: setTimeout(tick, 340) };
}
for(const ev of ['pointerup', 'pointercancel', 'blur']) document.addEventListener(ev, stopRepeat, true);


/* Four buttons and two axes, and that is the whole of flying this ship.
 *
 *   forward / back   along the way you are already going: raises or lowers
 *                    the far side of the orbit
 *   out / in         across it: swings the orbit round without changing its
 *                    size much
 *
 * No typing, no units to choose, no handle to drag to the right number. One
 * press is one step, and the step is sized to the orbit you are on, so the
 * same press means "a small change" whether you are creeping round a moon at
 * two hundred metres a second or falling past the Lamp at thirty kilometres
 * a second. Hold a button and it repeats, and then it hurries.
 */
const AXES = {
  pro:  { axis: 'prograde', sign:  1, key: 'pro',  label: 'Forward', hint: 'lifts the high point' },
  retro:{ axis: 'prograde', sign: -1, key: 'retro',label: 'Back',    hint: 'drops the high point' },
  out:  { axis: 'radial',   sign:  1, key: 'out',  label: 'Out',     hint: 'swings it outward' },
  in:   { axis: 'radial',   sign: -1, key: 'in',   label: 'In',      hint: 'swings it inward' },
};

/* A press should be worth something on any orbit and never enormous on any
   orbit, so it is a fixed fraction of how fast you are actually going at the
   mark, rounded to a number a person would say out loud. */
function stepFor(i){
  const where = nodePositions[i];
  const v = where ? norm(where.v) : norm(state.ship.v);
  const ms = S.kms(v) * 1000 * 0.005;
  const pow = Math.pow(10, Math.floor(Math.log10(Math.max(1, ms))));
  const nice = [1, 2, 5, 10].map(m => m * pow).find(x => x >= ms) ?? 10 * pow;
  return Math.max(1, Math.min(500, nice));
}

/* The Plan tab reads; it does not edit. A burn is set on the chart, where
 * the road it changes is in front of you — a panel of numbers beside a
 * picture of the thing the numbers are about is a worse place to work than
 * the picture. So this lists what is written down and what is coming. */
function plan(){
  let out = '<h2>Planned burns</h2>';
  const marks = state.nodes.length ? S.markStates(state, horizonFor()) : [];
  const cost = marks.reduce((a, m) => a + m.cost, 0);
  const short = cost > state.dv + 1e-9;
  if(!state.nodes.length){
    out += '<p class="say">Nothing written down. Tap your path on the chart and choose <b>Plan a burn</b>.</p>';
  }else{
    out += `<p>These cost <b class="${short ? 'down' : ''}">${S.fmtKms(cost)}</b> of your ${S.fmtKms(state.dv)}.${short ? ' <span class="down">The tank will not cover it.</span>' : ''}</p>`;
    state.nodes.forEach((n, i) => {
      const where = nodePositions[i];
      const frame = where ? world.get(where.body).name : '?';
      const fwd = Math.round(S.kms(n.prograde) * 1000), side = Math.round(S.kms(n.radial) * 1000);
      out += `<div class="node ${i === selectedNode ? 'sel' : ''}" data-act="selnode|${i}">
        <b>Burn ${i + 1}</b>
        <small>in ${S.fmtDays(n.t - state.t)} · ${esc(frame)}'s gravity · ${S.fmtKms(marks[i]?.cost ?? 0)}</small>
        <small>${fwd >= 0 ? 'forward' : 'back'} ${Math.abs(fwd)} m/s · ${side >= 0 ? 'out' : 'in'} ${Math.abs(side)} m/s</small>
      </div>`;
    });
    out += '<p class="lock">A burn fires by itself the moment the clock reaches it. Tap one here, or its ring on the chart, to open it: four arrows and a cross appear round the ring, and tapping the ring again puts them away.</p>';
  }
  out += aheadList();
  if(state.dv <= 1e-9){
    const q = S.towQuote(state);
    out += `<h3>Dry tank</h3><p>${esc(TEXT.captainLines.onStranded[2] ?? '')}</p><p>A tow to ${esc(S.portName(q.port))}: ${S.fmtMoney(q.cost)}, ${S.fmtDays(q.days)}.</p><button class="btn wide" data-act="tow">Call for a tow</button>`;
  }else{
    out += `<p class="lock" style="margin-top:1rem">Stuck anywhere? <button class="btn sm" data-act="tow">Call for a tow</button></p>`;
  }
  return out;
}

/* What the drawn road runs into, in the order it runs into it: the doors it
 * goes through and the nearest it passes whatever it meets on the way. */
function aheadList(){
  if(!prediction) return '';
  const skip = t => `<button class="btn sm" data-act="skipto|${t}">Skip to it</button>`;
  const lines = [];
  for(const e of prediction.events){
    if(e.kind === 'soi'){
      const to = world.get(e.to), from = world.get(e.from);
      lines.push({ t: e.t, html: `<p>${to.parent === from.id ? 'Into' : 'Out to'} ${esc(to.name)}'s gravity in ${S.fmtDays(e.t - state.t)}. ${skip(e.t)}</p>` });
    }else if(e.kind === 'burn' && e.node.aero){
      lines.push({ t: e.t, html: `<p class="up">Air brake at ${esc(S.portName(e.node.body))}: shed ${S.fmtKms(e.magnitude)} in ${S.fmtDays(e.t - state.t)}. ${skip(e.t)}</p>` });
    }else if(e.kind === 'crash'){
      lines.push({ t: e.t, html: `<p class="down">This path strikes ${esc(S.portName(e.body))} in ${S.fmtDays(e.t - state.t)}.</p>` });
    }
  }
  const ic = prediction.intercept;
  if(ic) lines.push({ t: ic.t, html: ic.grazes
    ? `<p class="down">This path hits ${esc(S.portName(ic.body))} in ${S.fmtDays(ic.t - state.t)}.</p>`
    : `<p class="${ic.inMouth ? 'up' : ''}">Closest approach to ${esc(S.portName(ic.body))}: ${fmtAu(ic.altitude)} at ${S.fmtKms(ic.speed)}, in ${S.fmtDays(ic.t - state.t)}.${ic.inMouth ? ' That is inside docking range.' : ''} ${skip(ic.t)}</p>` });
  lines.sort((a, b) => a.t - b.t);
  return '<h3>Ahead</h3>' + (lines.length
    ? lines.map(l => l.html).join('')
    : '<p class="lock">Nothing changes before this orbit comes round again.</p>');
}

function orbitTab(){
  const b = world.get(state.ship.body);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  const alt = d => fmtAu(Math.max(0, d - (b.radius ?? 0)));
  const shape = !Number.isFinite(el.period) ? 'an escape' :
    el.e < 0.02 ? 'a circle' : el.e < 0.3 ? 'a gentle ellipse' :
    el.e < 0.7 ? 'a long ellipse' : 'a very long ellipse';
  let out = `<h2>Your orbit</h2>`;
  out += `<p>You are going round <b>${esc(b.name)}</b> on ${shape}.</p>`;
  out += `<dl class="kv"><dt>Low point</dt><dd>${alt(el.rp)}</dd>`;
  out += Number.isFinite(el.ra) ? `<dt>High point</dt><dd>${alt(el.ra)}</dd>` : `<dt>High point</dt><dd>none — you are leaving</dd>`;
  out += `<dt>Height now</dt><dd>${alt(norm(state.ship.r))}</dd>`;
  out += `<dt>Speed</dt><dd>${S.fmtKms(norm(state.ship.v))}</dd>`;
  if(Number.isFinite(el.period)) out += `<dt>A lap takes</dt><dd>${S.fmtDays(el.period)}</dd>`;
  out += `</dl>`;
  if(el.rp <= (b.radius ?? 0)) out += `<p class="down">The low point of this orbit is inside ${esc(b.name)}. Burn forward before it arrives.</p>`;
  else if(b.atmo && el.rp < b.atmo) out += `<p class="up">The low point dips into ${esc(b.name)}'s air. With a heat shield that is free braking; without one it is a bad day.</p>`;
  out += aheadList();
  out += `<h3>What is out here</h3>`;
  const kin = world.children(b.id).filter(c => c.port || c.kind === 'moon');
  if(kin.length) out += `<p class="lock">${kin.map(c => esc(c.name)).join(' · ')} go round ${esc(b.name)} too. Tap one on the chart to look at it.</p>`;
  else out += `<p class="lock">Nothing else goes round ${esc(b.name)}.</p>`;
  return out;
}

function shipTab(){
  const b = world.get(state.ship.body);
  const el = elementsFromState(b.mu, state.ship.r, state.ship.v);
  /* Heights above the ground, the same as the Orbit tab. They used to be
     distances from the middle of the world here and altitudes there, under
     two different names, so nobody noticed they disagreed; one name for one
     number means they have to. */
  const alt = d => fmtAu(Math.max(0, d - (b.radius ?? 0)));
  let out = `<h2>${esc(state.shipName)}</h2>`;
  out += `<dl class="kv"><dt>Orbiting</dt><dd>${esc(b.name)}</dd><dt>Height now</dt><dd>${alt(norm(state.ship.r))}</dd><dt>Speed</dt><dd>${S.fmtKms(norm(state.ship.v))}</dd>`;
  out += `<dt>Low point</dt><dd>${alt(el.rp)}</dd><dt>High point</dt><dd>${Number.isFinite(el.ra) ? alt(el.ra) : 'none — you are leaving'}</dd>`;
  if(Number.isFinite(el.period)) out += `<dt>A lap takes</dt><dd>${S.fmtDays(el.period)}</dd>`;
  out += `<dt>Shape</dt><dd>${el.e < 0.005 ? 'a circle' : el.e < 1 ? `an oval (${el.e.toFixed(2)} out of round)` : 'not a loop at all'}</dd></dl>`;
  if(b.atmo){
    out += el.rp < b.atmo ? (state.keys.heatShield ? `<p class="up">Air braking in ${esc(b.name)}'s clouds: the shield will slow you.</p>` : `<p class="down">Your low point is inside ${esc(b.name)}'s clouds, and you have no heat shield.</p>`) : '';
  }
  out += '<h3>Hold</h3>';
  if(!state.cargo.length && !state.passengers.length) out += '<p class="empty">Empty.</p>';
  for(const c of state.cargo){ const g = S.goodById(c.good); out += `<p>${c.qty} × ${esc(g.name)} <span class="lock">from ${esc(S.portName(c.from))}${g.lifetimeDays ? ` · ${Math.round(S.freshness(g, state.t - c.t) * 100)}% fresh` : ''}</span></p>`; }
  for(const c of state.passengers){ const days = c.deadline - state.t; out += `<p>${esc(c.title)} <span class="lock">→ ${esc(S.portName(c.to))} · ${days < 0 ? 'late' : S.fmtDays(days) + ' left'}</span> <button class="btn sm" data-act="target|${c.to}">Target</button></p>`; }
  out += '<h3>Fitted</h3>';
  out += `<p>${esc(S.tiers('tank')[state.tiers.tank].name)}, ${esc(S.tiers('engine')[state.tiers.engine].name)}, ${esc(S.tiers('hold')[state.tiers.hold].name)}.</p>`;
  out += `<p>${['heatShield', 'refrigeration', 'sensors', 'stealth'].filter(k => state.keys[k]).map(k => esc(UPGRADES.find(u => u.key === k)?.name ?? k)).join(', ') || '<span class="lock">No keys yet.</span>'}</p>`;
  const line = TEXT.captainLines.onLongCoast[Math.floor(S.hash(Math.floor(state.t / 20)) * TEXT.captainLines.onLongCoast.length)];
  out += `<p class="say">${esc(line)}</p>`;
  return out;
}

function logTab(){
  return `<h2>Log</h2><ul id="log" aria-live="polite" aria-relevant="additions">` + [...state.log].reverse().map(l => `<li class="${l.kind === 'story' ? 'story' : ''}"><b>${S.calendar(l.t).year}.${S.calendar(l.t).day}</b>${esc(l.text)}</li>`).join('') + '</ul>';
}

/* ------------------------------------------------------------- actions */

const actions = {
  buy(gid, q){ const r = S.buy(state, gid, Number(q)); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); },
  sell(gid, q){ const r = S.sell(state, gid, Number(q)); if(!r.ok) toast(r.reason, 'bad'); else toast(`Sold for ${S.fmtMoney(r.total)} (${r.profit >= 0 ? '+' : ''}${S.fmtMoney(r.profit)}).`); renderTab(); save(); },
  take(id){ const r = S.takeContract(state, id); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); tutorialCheck(); },
  fuel(k){ const r = S.refuel(state, Number(k)); if(!r.ok) toast(r.reason, 'bad'); renderTab(); save(); },
  upgrade(id){ const r = S.buyUpgrade(state, id); if(!r.ok) toast(r.reason, 'bad'); else toast(`${S.upgradeById(id).name} fitted.`); renderTab(); save(); },
  wait(d){ const days = Number(d); S.wait(state, days); toast(`${S.fmtDays(days)} pass. ${S.calendar(state.t).text}.`); renderTab(); save(); },
  undock(){
    const r = S.undock(state);
    if(!r.ok) return;
    selectedNode = -1; replan(true); renderTabs(); backToShip(true); tutorialCheck(); save();
  },
  dock(){ doDock(); },
  addmark(){
    const ix = S.addNodeAhead(state);
    if(ix < 0){ toast('No room for another burn on this path.', 'bad'); return; }
    selectedNode = ix; holdForPlanning(ix); replan(true); renderTab(); tutorialCheck();
  },
  closenode(){ selectedNode = -1; replan(true); renderTab(); save(); },
  selnode(i){ selectedNode = selectedNode === Number(i) ? -1 : Number(i); replan(true); renderTab(); },
  delnode(i){ S.removeNode(state, Number(i)); selectedNode = -1; replan(true); renderTab(); save(); },
  warpnode(i){ const n = state.nodes[Number(i)]; if(n) askSkip(n.t - 0.05, `Burn ${Number(i) + 1}`); },
  skipto(t){ askSkip(Number(t)); },
  push(i, k){ pushAxis(Number(i), k); },
  zeronode(i){ const n = state.nodes[Number(i)]; if(!n) return; n.prograde = 0; n.radial = 0; replan(true); renderTab(); save(); },
  shift(i, d){ const n = state.nodes[Number(i)]; n.t = Math.max(state.t + 1e-3, n.t + Number(d)); state.nodes.sort((a, b) => a.t - b.t); selectedNode = state.nodes.indexOf(n); replan(true); renderTab(); },
  tow(){ showTow('dry'); },
  newgame(){ confirmNew(); },
};

for(const el of document.querySelectorAll('.node[data-act]')) void el;
// Node cards select on click, but their buttons should not also select.
document.addEventListener('click', e => {
  const card = e.target.closest('.node[data-act]');
  if(card && !e.target.closest('button')){ selectedNode = Number(card.dataset.act.split('|')[1]); renderTab(); }
}, true);

function doDock(){
  const r = S.dock(state);
  if(!r.ok){ toast(r.reason === 'too fast' ? 'Too fast to dock. Kill some speed first.' : 'No port nearby.', 'bad'); return; }
  stopSkip();
  selectedNode = -1; replan(true); renderTabs(); setTab('market');
  const txt = TEXT.ports[r.port];
  const line = txt?.arrival?.[Math.floor(S.hash(r.port, Math.floor(state.t)) * txt.arrival.length)];
  toast(`Docked at ${S.portName(r.port)}.${line ? ' ' + line : ''}`, 'story', 7000);
  for(const d of r.delivered){ toast(`${d.contract.title}: ${S.fmtMoney(d.pay)}${d.late ? ' (late)' : d.early ? ' (early!)' : ''}. ${d.say ?? ''}`, d.late ? 'bad' : 'story', 8000); }
  for(const e of r.events ?? []) if(e.kind === 'story') showStory(e.name, e.text);
  tutorialCheck();
  save();
}
// The dock button lives in the HUD hint: clicking the hint docks when it says so.
$('dockhint').addEventListener('click', () => { const d = S.dockingStatus(state); if(d?.ok) doDock(); });
$('dockhint').style.cursor = 'pointer';
addEventListener('keydown', e => {
  if(e.key !== 'd' || e.ctrlKey || e.metaKey || e.altKey) return;
  if($('modal').open || typing(e)) return;
  const d = S.dockingStatus(state);
  if(d?.ok) doDock();
});

/* ------------------------------------------------------------- modals */

const modal = $('modal');
function openModal(html, wireFn){
  modal.innerHTML = html;
  wire(modal);
  if(wireFn) wireFn(modal);
  if(!modal.open) modal.showModal();
  // showModal traps focus by itself; this only decides where it lands, which
  // should be the thing you are most likely to want.
  const first = modal.querySelector('.btn.primary') ?? modal.querySelector('button');
  if(first) first.focus();
}
function closeModal(){ if(modal.open) modal.close(); modal.innerHTML = ''; }
modal.addEventListener('cancel', e => { if(state.pending) e.preventDefault(); });

function showToll(p){
  openModal(`<h2>A hail from the Scatter</h2><p class="say">${esc(p.line)}</p><p>${esc(p.captain)} asks ${S.fmtMoney(p.amount)}, or the crates to match. Your hold is worth about ${S.fmtMoney(p.cargoValue)}; they will not take it all, and nobody is hurt who yields.</p>
    <div class="btns"><button class="btn" id="m-cargo">Pay in cargo</button><button class="btn primary" id="m-coin">Pay in coin</button></div>`, m => {
    m.querySelector('#m-coin').addEventListener('click', () => { const r = S.resolveToll(state, 'coin'); closeModal(); toast(r.text, 'story', 8000); save(); });
    m.querySelector('#m-cargo').addEventListener('click', () => { const r = S.resolveToll(state, 'cargo'); closeModal(); toast(r.text, 'story', 8000); save(); });
  });
}
function showCrash(bodyId){
  const b = world.get(bodyId);
  const atmo = state.pending?.atmosphere;
  const q = S.towQuote(state);
  openModal(`<h2>${atmo ? 'Too deep' : 'Hard landing'}</h2><p class="say">${esc(atmo ? TEXT.events.towAtmosphere : TEXT.events.towCrash[0])}</p>
    <p>${atmo ? `${esc(b.name)}'s clouds took the ship without a heat shield.` : `The ship met ${esc(b.name)} faster than it should have.`} A tow to ${esc(S.portName(q.port))} will cost ${S.fmtMoney(Math.round(q.cost * 1.5))} and ${S.fmtDays(q.days)}. Cargo and passengers ride along.</p>
    <div class="btns"><button class="btn primary" id="m-tow">Call for a tow</button></div>`, m => {
    m.querySelector('#m-tow').addEventListener('click', () => { const r = S.callTow(state, atmo ? 'atmosphere' : 'crash'); closeModal(); afterTow(r); });
  });
}
function showTow(reason){
  const q = S.towQuote(state);
  openModal(`<h2>Call for a tow</h2><p>The nearest help is at ${esc(S.portName(q.port))}, ${fmtAu(q.distance)} away. They ask ${S.fmtMoney(q.cost)} and it will take ${S.fmtDays(q.days)}. ${state.money < q.cost ? 'What you cannot pay, Ledger will lend.' : ''}</p>
    <div class="btns"><button class="btn" id="m-no">Not yet</button><button class="btn primary" id="m-tow">Call</button></div>`, m => {
    m.querySelector('#m-no').addEventListener('click', closeModal);
    m.querySelector('#m-tow').addEventListener('click', () => { const r = S.callTow(state, reason); closeModal(); afterTow(r); });
  });
}
function afterTow(r){
  selectedNode = -1; replan(true); renderTabs(); setTab('shipyard'); stopSkip();
  openModal(`<h2>Towed to ${esc(S.portName(r.port))}</h2><p class="say">${esc(r.story)}</p><p>${S.fmtDays(r.days)} later and ${S.fmtMoney(r.cost)} poorer, you are docked. ${state.debt > 0 ? esc(TEXT.events.ledgerDebt) : ''}</p><div class="btns"><button class="btn primary" id="m-ok">Carry on</button></div>`, m => m.querySelector('#m-ok').addEventListener('click', closeModal));
  save();
}
function showStory(name, text){
  const paras = String(text).split(/\n+/).map(p => `<p class="say">${esc(p)}</p>`).join('');
  openModal(`<h2>${esc(storyTitle(name))}</h2>${paras}<div class="btns"><button class="btn primary" id="m-ok">Close</button></div>`, m => m.querySelector('#m-ok').addEventListener('click', closeModal));
}
function storyTitle(name){ return { cometCaught: "Merrow's Comet", chimeArrival: 'Chime', mossbackHeartbeat: 'Mossback', hushRelic: 'Hush', lanternArrival: 'The Far Lantern', tollGiftLater: 'A parcel from the Scatter' }[name] ?? 'A note in the log'; }
function confirmNew(){
  openModal(`<h2>Start over?</h2><p>This save is replaced by a fresh ship at Tessel. There is one save slot.</p><div class="btns"><button class="btn" id="m-no">Keep playing</button><button class="btn danger" id="m-yes">New game</button></div>`, m => {
    m.querySelector('#m-no').addEventListener('click', closeModal);
    m.querySelector('#m-yes').addEventListener('click', () => { closeModal(); state = S.newGame(freshSeed()); save(); selectedNode = -1; lastDockedMode = null; replan(true); renderTabs(); backToShip(true); tutorialCheck(); });
  });
}

/* ------------------------------------------------------------- toasts */

function toast(text, kind = '', ms = 4200){
  if(!text) return;
  const el = document.createElement('div');
  el.className = `toast ${kind}`; el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
  while($('toasts').children.length > 4) $('toasts').firstChild.remove();
}

/* ------------------------------------------------------------- tutorial */

/* The lesson is the first delivery: the orbit you open in, out to Pip, the
   nearest moon. There is no casting off to do — the game starts in flight —
   so step one is the first thing a player actually has to decide. It watches
   the state rather than the clicks, so doing a step your own way still
   counts, and it steps out of the way the moment you are tied up. */
const TUT = TEXT.tutorial;
const FIRST_TARGET = S.FIRST_DELIVERY.to;
function tutorialCheck(){
  if(state.flags.tutorial >= TUT.length || state.flags.tutorialSkipped){ $('tut').hidden = true; return; }
  let step = state.flags.tutorial;
  const target = FIRST_TARGET;
  const marked = state.nodes.length > 0;
  const pushed = state.nodes.some(n => Math.abs(n.prograde) > 1e-9 || Math.abs(n.radial) > 1e-9);
  const reaches = prediction?.events.some(e => e.kind === 'soi' && e.to === target);
  /* Tied up at the far end is the whole lesson, however you got there — by the
     steps below, or by being towed. Checking it first means the card cannot
     sit there telling you to do a thing you have done. */
  if(state.dockedAt === target){
    state.flags.tutorial = TUT.length;
    $('tut').hidden = true;
    if(!state.flags.tutorialDone){ state.flags.tutorialDone = true; toast("Nellie has her crate. Theo says you'll do.", 'story'); }
    return;
  }
  if(step === 0 && marked) step = 1;
  if(step === 1 && pushed) step = 2;
  if(step === 2 && reaches) step = 3;
  if(step === 3 && state.ship.body === target) step = 4;
  if(step >= 1 && !marked && !reaches && state.ship.body !== target && !state.dockedAt) step = 0;
  if(step === 3 && !reaches && state.ship.body !== target) step = 2;
  state.flags.tutorial = step;
  if(step >= TUT.length){ $('tut').hidden = true; return; }
  const s = TUT[step];
  $('tut').hidden = false;
  $('tut-step').textContent = `Uncle Theo · ${step + 1} of ${TUT.length}`;
  $('tut-title').textContent = s.title;
  $('tut-body').textContent = s.body;
  $('tut').classList.toggle('min', !!state.flags.tutorialFolded);
}
$('tut-skip').addEventListener('click', () => { state.flags.tutorialSkipped = true; $('tut').hidden = true; save(); });

/* Folded or open, and it stays that way across steps and across sessions:
   somebody who has put the card down does not want it standing up again every
   time Theo has a new thought. */
function setTutFolded(folded){
  state.flags.tutorialFolded = !!folded;
  $('tut').classList.toggle('min', !!folded);
  $('tut-min').textContent = folded ? '+' : '\u2013';
  $('tut-min').title = folded ? 'Read it' : 'Fold it away';
  $('tut-min').setAttribute('aria-expanded', String(!folded));
  save();
}
$('tut-min').addEventListener('click', e => { e.stopPropagation(); setTutFolded(!state.flags.tutorialFolded); });
// Folded, the whole card is the way back open.
$('tut').addEventListener('click', () => { if(state.flags.tutorialFolded) setTutFolded(false); });
setInterval(() => { if(!$('tut').hidden) tutorialCheck(); }, 1500);

/* ------------------------------------------------------------- boot */

$('grab').addEventListener('click', () => togglePanel(false));
$('grab').setAttribute('role', 'button');
$('grab').setAttribute('tabindex', '0');
$('grab').setAttribute('aria-label', 'Close the panel');
$('grab').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); togglePanel(false); } });

renderTabs();
togglePanel(panelOpen, true);
replan(true);
backToShip(true);
syncView();
setRate(state.warp ?? 1);
tutorialCheck();
setTutFolded(!!state.flags.tutorialFolded);
if(state.pending?.kind === 'toll') showToll(state.pending);
if(state.pending?.kind === 'crash') showCrash(state.pending.body);
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); else last = performance.now(); });
</script>
