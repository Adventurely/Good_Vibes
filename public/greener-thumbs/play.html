<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greener Thumbs — African Violet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1310'/%3E%3Ccircle cx='8' cy='9' r='3.4' fill='%236b4b9a'/%3E%3Ccircle cx='8' cy='9' r='1.1' fill='%23ffd23f'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#1a1310; --panel:#241b16; --line:#3a2b22;
    --ink:#e8ded2; --dim:#a8998a; --gold:#ffd23f; --orange:#f59a2e; --leaf:#6f9c52;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block}

  #panel{
    position:fixed; top:14px; left:14px; width:268px; max-height:calc(100vh - 28px);
    overflow-y:auto; background:color-mix(in srgb,var(--panel) 92%,transparent);
    border:1px solid var(--line); border-radius:10px; padding:14px 14px 16px;
    backdrop-filter:blur(8px);
  }
  #panel h1{
    margin:0 0 2px; font-size:15px; letter-spacing:.2px; color:var(--gold);
  }
  #panel .sub{margin:0 0 12px; font-size:11.5px; color:var(--dim)}
  fieldset{border:0;border-top:1px solid var(--line);margin:12px 0 0;padding:10px 0 0}
  legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--orange);padding:0 6px 0 0}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0}
  .row label{flex:0 0 92px;font-size:12px;color:var(--dim)}
  .row output{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink)}
  input[type=range]{flex:1;accent-color:var(--leaf);min-width:0}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  button{
    flex:1 1 auto; background:#2f241d; color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; font-size:12px; cursor:pointer;
  }
  button:hover{border-color:var(--orange);color:#fff}
  button[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:#10240a}
  #stats{
    margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  }
  #stats b{color:var(--ink);font-weight:600}
  #err{
    position:fixed;inset:auto 14px 14px 14px;max-width:620px;margin:0 auto;
    background:#3a1a16;border:1px solid #7a3226;border-radius:8px;padding:10px 12px;
    font-size:12.5px;color:#ffd9d2;display:none;white-space:pre-wrap;
  }
  #load{
    position:fixed;inset:0;display:grid;place-content:center;text-align:center;
    color:var(--dim);font-size:13px;pointer-events:none;
  }
  #back{ position:fixed; left:14px; top:14px; z-index:5; color:#9db09a;
         font-size:.85rem; text-decoration:none; background:rgba(10,16,11,.62);
         padding:.3rem .7rem; border-radius:999px; border:1px solid #2a3a2c;
         backdrop-filter:blur(6px); }
  #back:hover{ color:#eef3e6; }

  #hud{ position:fixed; left:14px; bottom:14px; z-index:5;
        background:rgba(10,16,11,.68); border:1px solid #2a3a2c;
        border-radius:12px; padding:.7rem .95rem; backdrop-filter:blur(6px);
        max-width:min(88vw, 22rem); }
  #hud h2{ margin:0; font-size:1.05rem; }
  #hud p{ margin:.15rem 0 0; color:#9db09a; font-size:.85rem; }
  #hud .hint{ margin-top:.45rem; color:#6cc24a; font-size:.78rem; }

  #devbadge{ font-size:.58rem; letter-spacing:.14em; text-transform:uppercase;
             vertical-align:middle; padding:.12rem .42rem; border-radius:999px;
             border:1px solid #3f8f38; color:#6cc24a; }

  @media (max-width:640px){ #panel{width:auto;right:14px} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="load">loading violet.glb …</div>

<a id="back" href="./">&larr; title</a>

<!-- A game run gets this in place of the inspector: what the specimen is, and
     the only interaction that currently exists. -->
<div id="hud" hidden>
  <h2>African Violet</h2>
  <p><i>Saintpaulia ionantha</i></p>
  <p class="hint">Drag to look around &middot; scroll to zoom right in</p>
  <p class="hint" style="color:#9db09a">Light: <b id="timenow">—</b></p>
</div>

<div id="panel" hidden>
  <h1>African Violet <span id="devbadge">dev</span></h1>
  <p class="sub"><i>Saintpaulia ionantha</i> — parametric, rigged, 84 bones</p>

  <fieldset>
    <legend>Condition</legend>
    <div class="row">
      <label for="droop">Thirst</label>
      <input id="droop" type="range" min="0" max="1" step="0.01" value="0">
      <output for="droop">0.00</output>
    </div>
    <div class="row">
      <label for="chlor">Chlorosis</label>
      <input id="chlor" type="range" min="0" max="1" step="0.01" value="0">
      <output for="chlor">0.00</output>
    </div>
  </fieldset>

  <fieldset>
    <legend>Light</legend>
    <div class="btns" id="times">
      <button data-t="morning">Morning</button>
      <button data-t="midday">Midday</button>
      <button data-t="evening">Evening</button>
      <button data-t="night">Night</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>View</legend>
    <div class="btns">
      <button id="spin" aria-pressed="false">Auto-spin</button>
      <button id="wire" aria-pressed="false">Wireframe</button>
      <button id="bones" aria-pressed="false">Skeleton</button>
      <button id="close">Close up</button>
      <button id="reset">Reset</button>
    </div>
  </fieldset>

  <div id="stats">
    <div><b id="s-tris">–</b> triangles &nbsp;·&nbsp; <b id="s-bones">–</b> bones</div>
    <div><b id="s-fps">–</b> fps &nbsp;·&nbsp; <b id="s-calls">–</b> draw calls</div>
  </div>
</div>

<div id="err"></div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* Dev mode arrives in the URL, put there by the switch on the title screen.
   It is the only thing between the inspector and a plain run, so it is read
   once here and neither path tests for it again. */
const DEV = new URLSearchParams(location.search).get('dev') === '1';

const $ = s => document.querySelector(s);
const errBox = $('#err');
function fail(e){
  errBox.style.display = 'block';
  errBox.textContent = String(e && e.stack || e);
  console.error(e);
}
window.addEventListener('error', e => fail(e.error || e.message));

// ---- scene -----------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
// AgX to match what Blender rendered through, so the two are comparable
renderer.toneMapping = THREE.AgXToneMapping ?? THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
$('#stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Daylight outside the glass. A dark room behind glass walls just reads as a
// dark room; the whole point of a greenhouse is that the light comes through it.
// No flat background colour: the sky dome below is what you see through the
// glass, and a colour behind it only shows up as a band when they disagree.

// Far plane out past the sky dome (140) and the hills behind it. At 60 the
// dome was clipped away and the whole outside world simply was not drawn.
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.01, 400);
camera.position.set(0.24, 1.12, 0.34);

/* Fit the plant to the viewport using BOTH field of view angles.
 *
 * A fixed camera position frames correctly at one aspect ratio and crops at
 * every other one — in a tall narrow pane the horizontal FOV is far smaller
 * than the vertical, and a plant that is wider than it is tall disappears. */
/* Two framings, because the scene has two scales in it: a 7 m room and a
   19 cm plant. `pad` is a multiple of the distance that would just fit the
   plant, so ESTABLISH lands far enough out to hold the pedestal and the
   benches, and CLOSE puts the blade veining across the viewport. */
const ESTABLISH = 15.0, CLOSE = 1.45;

function frameToFit(obj, pad = 1.6){
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const dist = Math.max((size.y / 2) / Math.tan(vFov / 2),
                        (Math.max(size.x, size.z) / 2) / Math.tan(hFov / 2)) * pad;
  const dir = new THREE.Vector3(0.55, 0.40, 0.74).normalize();
  camera.position.copy(mid).addScaledVector(dir, dist);
  controls.target.copy(mid);
  /* Close enough to read the veining on one leaf, far enough back to see the
     whole house. The specimen is 19 cm inside a 7 m room, so these two cannot
     sensibly be derived from the same number. */
  controls.minDistance = 0.045;
  controls.maxDistance = 12;
  controls.update();
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.03, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.update();
let modelRoot = null;

// Image-based light, generated in-process — no HDRI file to ship, and the site
// forbids external requests anyway.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

/* The pedestal top is the one number the rest of the scene hangs off: the
   plant sits on it, the camera aims at it, and the shadow camera is centred on
   it. Naming it once is what stops the plant floating a centimetre above its
   own plinth the next time the greenhouse changes. */
const PEDESTAL_TOP = 0.95;

/* Dimensions from a real dwarf-wall Victorian glasshouse rather than invented:
   a brick base about knee height, glass above it to the eaves, a pitched roof
   with a ridge, and the glazing divided into panes by bars rather than left as
   one sheet. The pane grid is most of what makes glass read as a greenhouse —
   a clean unbroken wall of it reads as an office. */
const GH = {
  W: 7.2, D: 5.0,
  WALL: 0.62,          // the dwarf brick wall
  EAVE: 2.45,
  RIDGE: 3.35,
  BAR: 0.045,          // glazing bar section
  PANE_W: 0.72,        // roughly a standard horticultural pane
};

// ---- materials --------------------------------------------------------------
const matFrame = new THREE.MeshStandardMaterial({ color:0x223026, roughness:0.52, metalness:0.30 });
const matBrick = new THREE.MeshStandardMaterial({ color:0x6b4436, roughness:0.94 });
const matFloor = new THREE.MeshStandardMaterial({ color:0x38332c, roughness:0.96 });
const matBench = new THREE.MeshStandardMaterial({ color:0x5a4732, roughness:0.88 });
const matStone = new THREE.MeshStandardMaterial({ color:0x6a6a63, roughness:0.80 });
const matTerra = new THREE.MeshStandardMaterial({ color:0x8a4a2c, roughness:0.90 });
const matGrass = new THREE.MeshStandardMaterial({ color:0x2f4a22, roughness:1.0 });
const matHedge = new THREE.MeshStandardMaterial({ color:0x243d1c, roughness:1.0 });
const matBark  = new THREE.MeshStandardMaterial({ color:0x3a2c22, roughness:0.92 });
const matLeaf  = new THREE.MeshStandardMaterial({ color:0x2b4a1f, roughness:0.95 });

/* Glass as a cheap translucent surface, not as refraction. `transmission`
   would be physically better and costs an extra render pass per pane; at this
   opacity nobody can tell. `depthWrite:false` because a few dozen overlapping
   transparent panes sort badly otherwise and flicker as the camera turns. */
const matGlass = new THREE.MeshStandardMaterial({
  color: 0xd6e9e2, roughness: 0.14, metalness: 0.0,
  transparent: true, opacity: 0.13, side: THREE.DoubleSide, depthWrite: false,
});

const house = new THREE.Group();
scene.add(house);

function box(w, h, d, x, y, z, mat, group = house){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  group.add(m);
  return m;
}
function pane(w, h, x, y, z, ry = 0, rx = 0){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), matGlass);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, 0);
  house.add(m);
  return m;
}

// ---- floor, and the dwarf wall it sits in -----------------------------------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(GH.W, GH.D).rotateX(-Math.PI/2), matFloor);
floor.receiveShadow = true;
house.add(floor);

const B = GH.BAR;
for (const sz of [-1, 1]) box(GH.W + B*2, GH.WALL, 0.14, 0, GH.WALL/2, sz*GH.D/2, matBrick);
for (const sx of [-1, 1]) box(0.14, GH.WALL, GH.D, sx*GH.W/2, GH.WALL/2, 0, matBrick);
// a stone coping course, which is what the frame actually bolts down to
for (const sz of [-1, 1]) box(GH.W + 0.20, 0.05, 0.20, 0, GH.WALL + 0.02, sz*GH.D/2, matStone);
for (const sx of [-1, 1]) box(0.20, 0.05, GH.D + 0.20, sx*GH.W/2, GH.WALL + 0.02, 0, matStone);

// ---- glazing ----------------------------------------------------------------
const GLASS_H = GH.EAVE - GH.WALL;
for (const sz of [-1, 1]) pane(GH.W, GLASS_H, 0, GH.WALL + GLASS_H/2, sz*GH.D/2);
for (const sx of [-1, 1]) pane(GH.D, GLASS_H, sx*GH.W/2, GH.WALL + GLASS_H/2, 0, Math.PI/2);

const slopeH = Math.hypot(GH.D/2, GH.RIDGE - GH.EAVE);
const pitch  = Math.atan2(GH.RIDGE - GH.EAVE, GH.D/2);
for (const sgn of [-1, 1]){
  const leaf = new THREE.Mesh(new THREE.PlaneGeometry(GH.W, slopeH), matGlass);
  leaf.position.set(0, (GH.EAVE + GH.RIDGE)/2, sgn * GH.D/4);
  leaf.rotation.x = sgn > 0 ? -(Math.PI/2 - pitch) : (Math.PI/2 - pitch);
  house.add(leaf);
}

/* Glazing bars. Verticals every pane width and one horizontal transom, which
   is what divides a wall of glass into a greenhouse. The rafters carry the
   same rhythm up the roof so the eye reads one structure rather than two. */
const nBays = Math.max(2, Math.round(GH.W / GH.PANE_W));
for (let i = 0; i <= nBays; i++){
  const x = -GH.W/2 + i * (GH.W / nBays);
  for (const sz of [-1, 1]){
    box(B, GLASS_H, B, x, GH.WALL + GLASS_H/2, sz*GH.D/2, matFrame);
    const raf = box(B, B, slopeH, x, (GH.EAVE + GH.RIDGE)/2, sz*GH.D/4, matFrame);
    raf.rotation.x = sz > 0 ? -(Math.PI/2 - pitch) : (Math.PI/2 - pitch);
  }
}
const nBaysD = Math.max(2, Math.round(GH.D / GH.PANE_W));
for (let i = 0; i <= nBaysD; i++){
  const z = -GH.D/2 + i * (GH.D / nBaysD);
  for (const sx of [-1, 1]) box(B, GLASS_H, B, sx*GH.W/2, GH.WALL + GLASS_H/2, z, matFrame);
}
// transoms, corner posts, eave beams, ridge
for (const sz of [-1, 1]) box(GH.W, B, B, 0, GH.WALL + GLASS_H*0.55, sz*GH.D/2, matFrame);
for (const sx of [-1, 1]) box(B, B, GH.D, sx*GH.W/2, GH.WALL + GLASS_H*0.55, 0, matFrame);
for (const sx of [-1, 1]) for (const sz of [-1, 1])
  box(B*1.5, GLASS_H, B*1.5, sx*GH.W/2, GH.WALL + GLASS_H/2, sz*GH.D/2, matFrame);
for (const sz of [-1, 1]) box(GH.W + B, B*1.6, B*1.6, 0, GH.EAVE, sz*GH.D/2, matFrame);
for (const sx of [-1, 1]) box(B*1.6, B*1.6, GH.D, sx*GH.W/2, GH.EAVE, 0, matFrame);
box(GH.W + B, B*1.8, B*1.8, 0, GH.RIDGE, 0, matFrame);

/* Ridge vents, propped open. A closed greenhouse in daylight is a greenhouse
   nobody works in; a pair of lights cracked along the ridge is the detail that
   says somebody was here this morning. */
for (const sgn of [-1, 1]){
  const v = new THREE.Mesh(new THREE.PlaneGeometry(GH.W * 0.30, 0.62), matGlass);
  v.position.set(sgn * GH.W * 0.22, GH.RIDGE - 0.10, sgn * 0.30);
  v.rotation.x = sgn > 0 ? -(Math.PI/2 - pitch) + 0.34 : (Math.PI/2 - pitch) - 0.34;
  house.add(v);
  box(0.03, 0.24, 0.03, sgn * GH.W * 0.22, GH.RIDGE - 0.22, sgn * 0.42, matFrame);
}
// ridge cresting — the row of little finials along the top
for (let i = -6; i <= 6; i++)
  box(0.028, 0.10, 0.028, i * (GH.W / 13), GH.RIDGE + 0.06, 0, matFrame);

// ---- staging, and pots on it ------------------------------------------------
/* Slatted staging, not a solid shelf: greenhouse benches are slatted so water
   drains and air moves, and the gaps let the light through onto the floor,
   which is worth the extra dozen boxes. */
for (const sz of [-1, 1]){
  const zc = sz * (GH.D/2 - 0.48);
  for (let s = 0; s < 5; s++)
    box(GH.W - 0.55, 0.035, 0.085, 0, 0.80, zc - 0.24 + s * 0.12, matBench);
  for (let i = -2; i <= 2; i++){
    box(0.05, 0.80, 0.05, i * ((GH.W - 0.9) / 4), 0.40, zc - 0.22, matFrame);
    box(0.05, 0.80, 0.05, i * ((GH.W - 0.9) / 4), 0.40, zc + 0.22, matFrame);
  }
  for (let i = 0; i < 7; i++){
    const r = 0.055 + (i % 3) * 0.012;
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(r, r*0.74, r*1.55, 14), matTerra);
    pot.position.set(-GH.W/2 + 0.7 + i * ((GH.W - 1.4)/6), 0.82 + r*0.78, zc + (i%2?0.08:-0.06));
    pot.castShadow = true; pot.receiveShadow = true;
    house.add(pot);
  }
}

// ---- the pedestal the specimen stands on ------------------------------------
box(0.42, 0.06, 0.42, 0, 0.03, 0, matStone);
const column = new THREE.Mesh(
  new THREE.CylinderGeometry(0.13, 0.155, PEDESTAL_TOP - 0.10, 24), matStone);
column.position.y = 0.06 + (PEDESTAL_TOP - 0.10)/2;
column.castShadow = true; column.receiveShadow = true;
house.add(column);
box(0.34, 0.04, 0.34, 0, PEDESTAL_TOP - 0.02, 0, matStone);

// ---- outside ----------------------------------------------------------------
/* There is a world through the glass. Without it the panes show a flat void and
   the whole room reads as a model on a table — the single biggest thing that
   made this look like a viewer rather than a place. All of it is far enough out
   to be seen through glass and never approached, so it is cones and spheres. */
const out = new THREE.Group();
scene.add(out);

const lawn = new THREE.Mesh(new THREE.CircleGeometry(90, 48).rotateX(-Math.PI/2), matGrass);
lawn.position.y = -0.02;
lawn.receiveShadow = true;
out.add(lawn);

// a gravel path out of the door end
const path = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 14).rotateX(-Math.PI/2), matStone);
path.position.set(0, -0.01, -GH.D/2 - 7.2);
out.add(path);

// hedge along two sides, kept back so it never touches the glass
for (const [w, d, x, z] of [[26, 0.9, 0, -13], [26, 0.9, 0, 13], [0.9, 26, -13, 0], [0.9, 26, 13, 0]]){
  const h = new THREE.Mesh(new THREE.BoxGeometry(w, 1.9, d), matHedge);
  h.position.set(x, 0.95, z);
  h.castShadow = true; h.receiveShadow = true;
  out.add(h);
}

// trees, as a trunk and two rough crowns
function tree(x, z, s){
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.16*s, 0.24*s, 2.6*s, 8), matBark);
  t.position.y = 1.3*s; g.add(t);
  for (const [dy, r] of [[3.1, 1.7], [4.3, 1.15]]){
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(r*s, 1), matLeaf);
    c.position.set(0.2*s, dy*s, -0.1*s);
    c.castShadow = true;
    g.add(c);
  }
  g.position.set(x, 0, z);
  out.add(g);
}
tree(-16, -12, 1.5); tree(-19, 6, 1.9); tree(15, -14, 1.25);
tree(20, 9, 2.1); tree(-9, 19, 1.6); tree(11, 18, 1.35);

// distant hills, low and wide, purely to give the horizon something to do
for (const [x, z, r, h] of [[-45, -60, 34, 7], [30, -70, 44, 9], [70, 20, 38, 6]]){
  const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 12), matHedge);
  hill.position.set(x, h - r, z);
  out.add(hill);
}

/* The sky is a vertex-coloured sphere, not a shader.
   A raw ShaderMaterial writing gl_FragColor sidesteps tone mapping and the
   output colour transform, so it comes out looking nothing like the rest of
   the frame unless the right include chunks are pasted in by hand. Vertex
   colours go through the ordinary pipeline and cannot get that wrong, and at
   ~600 vertices repainting them on every time change costs nothing. */
const skyGeo = new THREE.SphereGeometry(140, 32, 18);
skyGeo.setAttribute('color', new THREE.BufferAttribute(
  new Float32Array(skyGeo.attributes.position.count * 3), 3));
const skyDome = new THREE.Mesh(skyGeo,
  new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true, fog: false }));
scene.add(skyDome);

function paintSky(topCol, botCol){
  const pos = skyGeo.attributes.position, col = skyGeo.attributes.color;
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const h = THREE.MathUtils.clamp((pos.getY(i) / 140 + 0.22) / 1.22, 0, 1);
    c.copy(botCol).lerp(topCol, Math.pow(h, 0.7));
    col.setXYZ(i, c.r, c.g, c.b);
  }
  col.needsUpdate = true;
}

// ---- light, and the time of day ---------------------------------------------
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 22;
/* The shadow camera is tight around the pedestal on purpose. The house is
   seven metres across and the specimen is nineteen centimetres; a map that
   covers the room has nothing left over for a leaf. This covers two metres
   about the plant and the rest of the room gets by on ambient. */
const SC = 2.0;
Object.assign(sun.shadow.camera, { left:-SC, right:SC, top:SC, bottom:-SC });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.004;
sun.target.position.set(0, PEDESTAL_TOP, 0);
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444033, 0.5);
scene.add(hemi);

// Two hanging bulbs, off in daylight. They are what makes the night setting a
// place somebody works in rather than a dark room.
const lamps = [];
for (const sx of [-1, 1]){
  const g = new THREE.Group();
  g.position.set(sx * 1.9, GH.EAVE - 0.32, 0);
  const flex = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.55, 6), matFrame);
  flex.position.y = 0.30; g.add(flex);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.13, 16, 1, true),
    new THREE.MeshStandardMaterial({ color:0x2b3630, roughness:0.6, side:THREE.DoubleSide }));
  g.add(shade);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8),
    new THREE.MeshStandardMaterial({ color:0xffdca8, emissive:0xffbf70, emissiveIntensity:2.2 }));
  bulb.position.y = -0.05; g.add(bulb);
  const pt = new THREE.PointLight(0xffc98a, 0, 6.5, 2);
  pt.position.y = -0.05; g.add(pt);
  house.add(g);
  lamps.push({ pt, bulb: bulb.material });
}

/* Four settings, read off real daylight rather than picked to look nice.
   What changes between them is the sun's height and colour temperature, how
   much of the light is sky rather than sun, and how far you can see: at dawn
   the air is full of water and the horizon is close, at midday it is not. */
const TIMES = {
  morning: {
    label: 'Morning',
    az: 82, elev: 14, sunColor: 0xffd2a1, sunI: 4.6,
    skyTop: 0x7ea6cf, skyBot: 0xf0cfae,
    hemiSky: 0xbdd4ee, hemiGround: 0x4a4634, hemiI: 1.25,
    fog: 0xd8d0c4, fogD: 0.0060, env: 0.95, exposure: 1.30, lamps: 0,
  },
  midday: {
    label: 'Midday',
    az: 150, elev: 62, sunColor: 0xfff4e2, sunI: 6.2,
    skyTop: 0x3f77c4, skyBot: 0xbcd6ea,
    hemiSky: 0xcfe2f7, hemiGround: 0x54503c, hemiI: 1.50,
    fog: 0xc9d6e0, fogD: 0.0035, env: 1.25, exposure: 1.30, lamps: 0,
  },
  evening: {
    label: 'Evening',
    az: 262, elev: 7, sunColor: 0xff9346, sunI: 5.2,
    skyTop: 0x40518f, skyBot: 0xf0a065,
    hemiSky: 0x9a90c0, hemiGround: 0x3a2f24, hemiI: 0.90,
    fog: 0xd0a380, fogD: 0.0080, env: 0.72, exposure: 1.28, lamps: 0.45,
  },
  night: {
    label: 'Night',
    // Not "midday turned down". Moonlight is dim, cool and directional, the
    // sky keeps a little blue rather than going black, and the lamps take over.
    az: 300, elev: 38, sunColor: 0x9fb6ff, sunI: 0.32,
    skyTop: 0x080d1c, skyBot: 0x16203a,
    hemiSky: 0x2a3550, hemiGround: 0x121012, hemiI: 0.14,
    fog: 0x0d1220, fogD: 0.010, env: 0.08, exposure: 0.95, lamps: 1.0,
  },
};

scene.fog = new THREE.FogExp2(0xffffff, 0.006);

let timeKey = 'midday';
function applyTime(key){
  const t = TIMES[key] || TIMES.midday;
  timeKey = key;

  const el = THREE.MathUtils.degToRad(t.elev), az = THREE.MathUtils.degToRad(t.az);
  sun.position.set(Math.sin(az) * 14 * Math.cos(el),
                   PEDESTAL_TOP + 14 * Math.sin(el),
                   Math.cos(az) * 14 * Math.cos(el));
  sun.color.setHex(t.sunColor);
  sun.intensity = t.sunI;

  hemi.color.setHex(t.hemiSky);
  hemi.groundColor.setHex(t.hemiGround);
  hemi.intensity = t.hemiI;

  paintSky(new THREE.Color(t.skyTop), new THREE.Color(t.skyBot));
  scene.fog.color.setHex(t.fog);
  scene.fog.density = t.fogD;
  scene.environmentIntensity = t.env;
  renderer.toneMappingExposure = t.exposure;

  for (const l of lamps){
    l.pt.intensity = t.lamps * 5.5;
    l.bulb.emissiveIntensity = t.lamps > 0 ? 2.2 : 0.0;
  }
  const badge = document.getElementById('timenow');
  if (badge) badge.textContent = t.label;
}

/* A game run takes the time from the player's own clock, which is the point:
   the plants are cared for daily and a season is a real week, so the light in
   the house should be the light outside the window. Dev mode overrides it. */
function timeFromClock(){
  const h = new Date().getHours();
  if (h < 5 || h >= 21) return 'night';
  if (h < 11) return 'morning';
  if (h < 17) return 'midday';
  return 'evening';
}


// ---- model -----------------------------------------------------------------
const SHARE = [0.10, 0.20, 0.32, 0.38];   // must match violet.py
const LEAF_BONE = /^L(\d+)_(\d+)$/;
const leafBones = [];                      // {bone, share, k}
let skinned = null, leafMat = null, helper = null;
let baseColor = new THREE.Color(1,1,1);

/* The geometry is Draco-compressed, so the decoder has to be attached before
   anything will load. DRACOLoader defaults to fetching it from a CDN, and this
   site makes no external requests at all — so it is served from `vendor/`
   beside three.js itself, and the decoder runs in a worker off the main thread. */
const draco = new DRACOLoader();
draco.setDecoderPath('./vendor/jsm/libs/draco/gltf/');
draco.setDecoderConfig({ type: 'wasm' });

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
loader.load('./violet.glb', gltf => {
  const root = gltf.scene;
  root.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.castShadow = true; o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { m.side = THREE.DoubleSide; });
    }
    if (o.isSkinnedMesh) skinned = o;
    if (o.isBone) {
      const m = LEAF_BONE.exec(o.name);
      if (m) {
        const i = +m[1], s = +m[2];
        // outer leaves give up first — same expression as violet.py
        /* `base` is the bone's rest rotation, kept because droop is now
           applied as an absolute pose rather than as an offset. The wind clip
           used to rewrite every bone each frame and droop was layered on top
           of that; with the clip gone there is nothing to reset them, and
           subtracting an offset every frame would wind the leaves round and
           round until the plant tied itself in a knot. */
        leafBones.push({ bone:o, share:SHARE[s] ?? SHARE.at(-1),
                         k: 1.0 + 0.25 * Math.sin(i * 2.4),
                         base: o.rotation.clone() });
      }
    }
  });
  // the specimen stands on the pedestal, not on the floor
  root.position.y = PEDESTAL_TOP;
  scene.add(root);

  /* Rebuild the blade material as Physical so it can carry sheen.
   *
   * The mesh exports as four primitives, one per material slot, and GLTFLoader
   * turns those into four separate meshes. Picking "the" skinned mesh out of a
   * traverse therefore lands on whichever came last, and swapping its material
   * builds one with no maps on it — which is why the leaves came out white.
   * Match on the material instead, wherever it turns up. */
  const swapped = new Map();
  root.traverse(o => {
    if (!o.isMesh && !o.isSkinnedMesh) return;
    const arr = Array.isArray(o.material) ? o.material : [o.material];
    const next = arr.map(m => {
      if (!m || !/leaf/i.test(m.name)) return m;
      if (swapped.has(m)) return swapped.get(m);
      const pm = new THREE.MeshPhysicalMaterial({
        map: m.map, normalMap: m.normalMap, roughnessMap: m.roughnessMap,
        roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide,
        // the hairs are not in the GLB; sheen stands in for the light they scatter
        sheen: 0.7, sheenRoughness: 0.5, sheenColor: new THREE.Color(0x8fa07a),
        normalScale: m.normalScale ? m.normalScale.clone() : new THREE.Vector2(1, 1),
      });
      swapped.set(m, pm);
      leafMat = pm;
      return pm;
    });
    o.material = Array.isArray(o.material) ? next : next[0];
  });
  if (leafMat) baseColor = leafMat.color.clone();

  helper = new THREE.SkeletonHelper(root);
  helper.visible = false;
  scene.add(helper);

  let tris = 0;
  root.traverse(o => {
    if (o.geometry) {
      const g = o.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  $('#s-tris').textContent = Math.round(tris).toLocaleString();
  $('#s-bones').textContent = leafBones.length ? new Set(leafBones.map(b=>b.bone.name)).size + 12 : '–';
  modelRoot = root;
  /* Open on the room, not on the plant. You are meant to arrive in a
     greenhouse and see a specimen standing on a pedestal in the middle of it;
     the close inspection is the thing you then choose to do. */
  frameToFit(root, ESTABLISH);
  $('#load').remove();
  if (DEV) $('#panel').hidden = false;
  else     $('#hud').hidden = false;
}, undefined, err => { $('#load').textContent = 'failed to load violet.glb'; fail(err); });

// ---- controls ---------------------------------------------------------------
const ui = { droop:0, chlor:0, spin:false };
function bindRange(id, key){
  const el = $('#'+id), out = el.nextElementSibling;
  const sync = () => { ui[key] = +el.value; out.value = (+el.value).toFixed(2); };
  el.addEventListener('input', sync); sync();
}
bindRange('droop','droop'); bindRange('chlor','chlor');

function toggle(id, key, onLabel, offLabel){
  const el = $('#'+id);
  el.addEventListener('click', () => {
    ui[key] = !ui[key];
    el.setAttribute('aria-pressed', String(ui[key]));
    if (onLabel) el.textContent = ui[key] ? onLabel : offLabel;
  });
  return el;
}
toggle('spin','spin');
$('#wire').addEventListener('click', e => {
  const on = e.target.getAttribute('aria-pressed') !== 'true';
  e.target.setAttribute('aria-pressed', String(on));
  scene.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) {
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m => m.wireframe = on);
    }
  });
});
$('#bones').addEventListener('click', e => {
  const on = e.target.getAttribute('aria-pressed') !== 'true';
  e.target.setAttribute('aria-pressed', String(on));
  if (helper) helper.visible = on;
});
/* Dev mode opens at midday and lets you step through the settings; a game run
   takes the light from the player's own clock and leaves it alone. The premise
   is that a season is a real week and the plants are tended daily, so the house
   should be lit the way it is lit outside the window right now. */
const timeBtns = document.querySelectorAll('#times button');
function markTime(){
  timeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === timeKey)));
}
timeBtns.forEach(b => b.addEventListener('click', () => { applyTime(b.dataset.t); markTime(); }));
applyTime(DEV ? 'midday' : timeFromClock());
markTime();

$('#reset').addEventListener('click', () => { if (modelRoot) frameToFit(modelRoot, ESTABLISH); });
$('#close').addEventListener('click', () => { if (modelRoot) frameToFit(modelRoot, CLOSE); });

// ---- loop -------------------------------------------------------------------
let last = performance.now();
let fpsT = 0, fpsN = 0;
const YELLOW = new THREE.Color(0.62, 0.55, 0.16);

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  /* Droop is written as an absolute pose, from each bone's rest rotation.
     It used to be an offset — `rotation.x -= ...` every frame — which only
     worked because the wind clip rewrote the whole pose first and wiped it.
     With the clip gone that subtraction accumulates, and the leaves wind
     through themselves in a couple of seconds. Same bones and same shares as
     violet.py; the browser runs the Blender rig rather than approximating it. */
  if (leafBones.length){
    const total = THREE.MathUtils.degToRad(78) * ui.droop;
    for (const {bone, share, k, base} of leafBones){
      bone.rotation.x = base.x - total * share * k;
      bone.rotation.z = base.z;
    }
  }

  if (leafMat) leafMat.color.copy(baseColor).lerp(YELLOW, ui.chlor * 0.85);

  if (ui.spin){
    const a = 0.25 * dt;
    camera.position.applyAxisAngle(new THREE.Vector3(0,1,0), a);
  }
  controls.update();
  renderer.render(scene, camera);

  fpsN++; fpsT += dt;
  if (fpsT >= 0.5){
    $('#s-fps').textContent = Math.round(fpsN / fpsT);
    $('#s-calls').textContent = renderer.info.render.calls;
    fpsN = 0; fpsT = 0;
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
