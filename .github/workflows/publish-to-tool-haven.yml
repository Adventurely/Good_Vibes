name: Publish to Tool Haven

# The game is built here. The site that serves it is Adventurely/Tool-Haven,
# which Cloudflare Workers Builds redeploys within a minute of any push to its
# main branch. So publishing is: copy public/ into that repo's tool slot and
# commit. Nothing deploys from this repo directly.
#
# Requires a repository secret named TOOL_HAVEN_TOKEN — see the README.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/publish-to-tool-haven.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two runs pushing to the same branch would race and one would be rejected.
concurrency:
  group: publish-to-tool-haven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Good Vibes
        uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A page whose own tests fail should not reach the site.
      - name: Test
        working-directory: source
        run: npm test

      - name: Check out Tool Haven
        uses: actions/checkout@v4
        with:
          repository: Adventurely/Tool-Haven
          token: ${{ secrets.TOOL_HAVEN_TOKEN }}
          path: tool-haven

      # Replace rather than merge, so a file deleted here is deleted there too.
      - name: Copy the page into the tool slot
        run: |
          set -euo pipefail
          rm -rf tool-haven/tools/good-vibes
          mkdir -p tool-haven/tools/good-vibes
          cp -R source/public/. tool-haven/tools/good-vibes/

      - name: Commit and push
        working-directory: tool-haven
        run: |
          set -euo pipefail
          git add tools/good-vibes
          if git diff --cached --quiet; then
            echo "Tool Haven is already serving this build — nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync good-vibes from Good_Vibes@${GITHUB_SHA:0:7}"
          git push
