# Publish public/ to GitHub Pages whenever `main` or `preview` moves.
#
# If the deploy job fails in about a second with no logs and no steps at all,
# nothing here is wrong: GitHub rejected the deployment before the job could
# start, because the branch is not on the `github-pages` environment's
# allowlist.
#
# Do not go looking at the default branch. That was the guess this comment used
# to make, and it was wrong — it cost a session. The environment does not track
# the default branch at all: it is seeded with whatever branch happened to be
# the Pages source when GitHub first created it, and then it keeps that branch
# and only that branch forever. Here it was seeded with
# `claude/node-server-hello-world-28lx0w`, a throwaway from an old session, so
# every push to `main` died at the gate from the day this file was written
# until 2026-08-27.
#
# To see the actual allowlist, which the Actions UI does not show you:
#
#   gh api repos/Adventurely/Good_Vibes/environments/github-pages/deployment-branch-policies
#
# To add a branch to it — the fix, and it is per branch:
#
#   gh api --method POST -f name=preview -f type=branch
#     repos/Adventurely/Good_Vibes/environments/github-pages/deployment-branch-policies
#
# `main` is on it. `preview` is *not*, so pushing that branch still fails this
# way until somebody runs the line above.
#
# This is the single-player preview channel: Pages is static, so the game is
# reachable only through its offline ?preview mode — rooms and the WebSocket
# need the real server and are not served here. The live multiplayer deploy
# stays what it has always been: a push to main, which deploys the Worker.
#
# public/ ships verbatim, no build step — what you push is what you play at
#   https://adventurely.github.io/Good_Vibes/play.html?preview
# To publish any branch's state: git push origin HEAD:preview --force
name: preview-pages

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One preview site; a newer push simply replaces a deploy still in flight.
concurrency:
  group: preview-pages
  cancel-in-progress: true

# Split in two on purpose. Only `deploy` touches the `github-pages`
# environment, so only `deploy` can be refused by its branch rules; `build`
# runs unconditionally. That turns the silent failure above into a legible
# one — if build is green and deploy dies in a second, the environment is
# what is refusing, not anything in this file.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
