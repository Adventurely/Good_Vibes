# Publish public/ to GitHub Pages whenever `main` or `preview` moves.
#
# If the deploy job fails in about a second with no logs and no steps at all,
# nothing here is wrong: GitHub rejected the deployment before the job could
# start. The `github-pages` environment only accepts deployments from the
# repository's **default branch** unless somebody widens it, so a run from any
# other branch dies at the gate with nothing written down. Either make the
# branch the default (Settings -> General -> Default branch) or allow it in
# Settings -> Environments -> github-pages -> Deployment branches and tags.
# That is also why `main` is listed above: it is the branch this repo actually
# lives on, so publishing follows it by default and `preview` is the extra.
#
# This is the single-player preview channel: Pages is static, so the game is
# reachable only through its offline ?preview mode — rooms and the WebSocket
# need the real server and are not served here. The live multiplayer deploy
# stays what it has always been: a push to main, via publish-to-tool-haven.
#
# public/ ships verbatim, no build step — what you push is what you play at
#   https://adventurely.github.io/Good_Vibes/play.html?preview
# To publish any branch's state: git push origin HEAD:preview --force
name: preview-pages

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One preview site; a newer push simply replaces a deploy still in flight.
concurrency:
  group: preview-pages
  cancel-in-progress: true

# Split in two on purpose. Only `deploy` touches the `github-pages`
# environment, so only `deploy` can be refused by its branch rules; `build`
# runs unconditionally. That turns the silent failure above into a legible
# one — if build is green and deploy dies in a second, the environment is
# what is refusing, not anything in this file.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
